spec:
  inputs:
    ocudu_path:
      type: string
      default: ocudu/ocudu
      description: "OCUDU repository path."
    ocudu_ref:
      type: string
      default: dev
      description: "OCUDU reference branch or tag."
---
idle_ho:
  stage: mobility
  extends: .functional_e2e
  rules:
    - if: $ON_MR
      changes:
        - e2e/tests/**/*
        - e2e/*.yml
        - retina/**/*
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /functional/
  variables:
    KEYWORDS: "functional.mobility.idle_ho."
    TESTBED: dynamic

