spec:
  inputs:
    ocudu_path:
      type: string
      default: ocudu/ocudu
      description: "OCUDU repository path."
    ocudu_ref:
      type: string
      default: dev
      description: "OCUDU reference branch or tag."
---
example:
  stage: stage
  extends: .amarisoft_zmq
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /functional/
  variables:
    KEYWORDS: functional::stage::example
