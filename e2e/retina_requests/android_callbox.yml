- name: android-ue
  type: ue
  image: ${RETINA_REGISTRY_URI}/android:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 1
    memory:
      requests: 1G
    ephemeral-storage:
      requests: 6G
  resources:
    - type: android

- name: ocudu-gnb
  type: gnb
  image: ${RETINA_REGISTRY_URI}/ocudu:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 100%
      limits: 100%
    memory:
      requests: 100%
      limits: 100%
    ephemeral-storage:
      requests: 6G
  ip_back_source: backhaul
  resources:
    - type: sdr
      model: x300
  environment:
    - RETINA_AGENT: ocudu-gnb
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb
    - LD_LIBRARY_PATH: /opt/rohc/lib/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true

- name: amarisoft-mme
  type: 5gc
  image: ${RETINA_REGISTRY_URI}/amarisoft5gc-remote:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 1
    memory:
      requests: 1G
    ephemeral-storage:
      requests: 6G
  resources:
    - type: remote
      model: callbox
    - type: api
      model: callbox
    - type: core
      model: callbox
    - type: android
      dummy: true
