- name: amarisoft-ue
  type: ue
  image: ${RETINA_REGISTRY_URI}/amarisoftue:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 20%
    memory:
      requests: 20%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: zmq
    - type: license
      model: amarisoft-ue.*
  shared_files:
    - local_path: ${AMARISOFT_PATH}
      remote_path: /builds/amarisoft/bin
      is_executable: false
    - local_path: ${OCUDU_PATH}/build_retina/utils/trx_ocudu/libtrx_ocudu.so
      remote_path: /builds/amarisoft/trx_ocudu.so
      is_executable: true

- name: ocudu-gnb
  type: gnb
  image: ${RETINA_REGISTRY_URI}/ocudu:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 20%
    memory:
      requests: 20%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: zmq
      dummy: true
  environment:
    - RETINA_AGENT: ocudu-gnb
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb
    - LD_LIBRARY_PATH: /opt/rohc/lib/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true

- name: amarisoft-mme
  type: 5gc
  image: ${RETINA_REGISTRY_URI}/amarisoft5gc:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 10%
    memory:
      requests: 10%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: license
      model: amarisoft-mme.*
    - type: zmq
      dummy: true
  shared_files:
    - local_path: ${AMARISOFT_PATH}
      remote_path: /builds/amarisoft/bin
      is_executable: false
