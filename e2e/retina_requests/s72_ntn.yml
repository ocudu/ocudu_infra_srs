- name: amarisoft-ue
  type: ue
  image: ${RETINA_REGISTRY_URI}/amarisoftue:${RETINA_VERSION}
  nof_ports: 16
  requirements:
    cpu:
      requests: 14
      limits: 14
    memory:
      requests: 80%
      limits: 80%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: license
      model: amarisoft-ue-ntn
    - type: ru
      model: s72-ue
  shared_files:
    - local_path: ${AMARISOFT_PATH}
      remote_path: /builds/amarisoft/bin
      is_executable: false

- name: ocudu-gnb
  type: gnb
  image: ${RETINA_REGISTRY_URI}/ocudu:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 100%
      limits: 100%
    memory:
      requests: 100%
      limits: 100%
    hugepages-1Gi:
      requests: 2Gi
      limits: 2Gi
    ephemeral-storage:
      requests: 15G
  ip_back_source: backhaul
  resources:
    - type: ru
      model: s72-ocudu
  environment:
    - RETINA_AGENT: ocudu-gnb
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb_split_7_2
    - LD_LIBRARY_PATH: /opt/rohc/lib/:/opt/dpdk/${DPDK_VERSION}/lib/x86_64-linux-gnu/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb_split_7_2/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true
  sidecars:
    - name: telegraf
      image: ${OCUDU_REGISTRY_URI}/telegraf:${OCUDU_TELEGRAF_VERSION}
      requirements:
        cpu:
          requests: 500m
          limits: 500m
        memory:
          requests: 256Mi
          limits: 256Mi
      environment:
        - WS_URL: "localhost:8001"
        - GNB_ID: ocudu-gnb
        - INFLUXDB3_EXTERNAL_URL: ${INFLUXDB3_EXTERNAL_URL}
        - INFLUXDB3_AUTH_TOKEN: ${INFLUXDB3_AUTH_TOKEN}
        - INFLUXDB3_BUCKET: ocudu
        - INFLUXDB3_TESTBED: s72
        - INFLUXDB3_RATE_LIMIT: "0"
        - INFLUXDB3_RATE_LIMIT_PERIOD: 0s
        - TELEGRAF_BUFFER_LIMIT: "5000"

- name: amarisoft-mme
  type: 5gc
  image: ${RETINA_REGISTRY_URI}/amarisoft5gc:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 2
      limits: 2
    memory:
      requests: 20%
      limits: 20%
    ephemeral-storage:
      requests: 6G
  ip_back_source: backhaul
  resources:
    - type: license
      model: amarisoft-mme.*
    - type: ru
      model: s72-ue
      dummy: true
  shared_files:
    - local_path: ${AMARISOFT_PATH}
      remote_path: /builds/amarisoft/bin
      is_executable: false
