- name: open5gs
  type: 5gc
  requirements:
    cpu:
      requests: 2
      limits: 2
    memory:
      requests: "8G"
      limits: "8G"
    ephemeral-storage:
      requests: "6G"
      limits: "6G"
  image: ${CI_REGISTRY_IMAGE}/retina/open5gs:${OPEN5GS_VERSION}_${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=fpga-virt-master
