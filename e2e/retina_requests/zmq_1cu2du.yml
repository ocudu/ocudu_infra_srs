- name: amarisoft-ue
  type: ue
  image: ${RETINA_REGISTRY_PREFIX}/amarisoftue:${AMARISOFT_VERSION}_${RETINA_VERSION}
  labels:
    - ${ZMQ_HOSTLABEL}
  nof_ports: 64
  requirements:
    cpu:
      requests: 6
      limits: 6
    memory:
      requests: "24G"
      limits: "24G"
    ephemeral-storage:
      requests: "6G"
      limits: "6G"
  resources:
    - type: zmq
    - type: license
      model: amarisoft-ue.*
  shared_files:
    - local_path: ${OCUDU_REL_BUILD_PATH}/utils/trx_srsran/libtrx_srsran.so
      remote_path: /opt/lteue/trx_srsran.so
      is_executable: true

- name: ocudu-cu
  type: cu
  image: ${RETINA_REGISTRY_PREFIX}/srscu:${RETINA_VERSION}
  labels:
    - ${ZMQ_HOSTLABEL}
  requirements:
    cpu:
      requests: 2
      limits: 2
    memory:
      requests: "8G"
      limits: "8G"
    ephemeral-storage:
      requests: "15G"
      limits: "15G"
  environment:
    - PATH: ${CONTAINER_PATH}:${OCUDU_ABS_BUILD_PATH}/apps/cu
  shared_files:
    - local_path: ${OCUDU_REL_BUILD_PATH}/apps/cu/srscu
      remote_path: /usr/local/bin/srscu
      is_executable: true

