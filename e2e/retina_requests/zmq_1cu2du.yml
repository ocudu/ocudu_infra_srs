- name: amarisoft-ue
  type: ue
  image: ${CI_REGISTRY_IMAGE}/retina/amarisoftue:${AMARISOFT_VERSION}_${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=fpga-virt-master
  nof_ports: 64
  requirements:
    cpu:
      requests: 6
      limits: 6
    memory:
      requests: "24G"
      limits: "24G"
    ephemeral-storage:
      requests: "6G"
      limits: "6G"
  resources:
    - type: zmq
    - type: license
      model: amarisoft-ue.*
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/utils/trx_ocudu/libtrx_ocudu.so
      remote_path: /opt/lteue/trx_ocudu.so
      is_executable: true

- name: ocudu-cu
  type: cu
  image: ${CI_REGISTRY_IMAGE}/retina/ocudu-cu:${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=fpga-virt-master
  requirements:
    cpu:
      requests: 2
      limits: 2
    memory:
      requests: "8G"
      limits: "8G"
    ephemeral-storage:
      requests: "15G"
      limits: "15G"
  environment:
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/cu
    - LD_LIBRARY_PATH: /opt/rohc/lib/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/cu/ocu
      remote_path: /usr/local/bin/ocu
      is_executable: true

- name: ocudu-du-1
  type: du
  image: ${CI_REGISTRY_IMAGE}/retina/ocudu-du:${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=fpga-virt-master
  requirements:
    cpu:
      requests: 2
      limits: 2
    memory:
      requests: "12G"
      limits: "12G"
    ephemeral-storage:
      requests: "15G"
      limits: "15G"
  resources:
    - type: zmq
  environment:
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/du
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/du/odu
      remote_path: /usr/local/bin/odu
      is_executable: true

