- name: amarisoft-ue
  type: ue
  image: ${RETINA_REGISTRY_URI}/amarisoftue:${AMARISOFT_VERSION}_${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=fpga-virt-master
  nof_ports: 64
  requirements:
    cpu:
      requests: 4
      limits: 4
    memory:
      requests: "16G"
      limits: "16G"
    ephemeral-storage:
      requests: "8G"
      limits: "8G"
  resources:
    - type: zmq
    - type: license
      model: amarisoft-ue-ntn
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/utils/trx_ocudu/libtrx_ocudu.so
      remote_path: /opt/lteue/trx_ocudu.so
      is_executable: true

- name: ocudu-gnb
  type: gnb
  image: ${RETINA_REGISTRY_URI}/ocudu-gnb:${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=fpga-virt-master
  requirements:
    cpu:
      requests: 4
      limits: 4
    memory:
      requests: "16G"
      limits: "16G"
    ephemeral-storage:
      requests: "8G"
      limits: "8G"
  resources:
    - type: zmq
  environment:
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb
    - LD_LIBRARY_PATH: /opt/rohc/lib/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true

- name: ntn-channel-emulator
  type: channel-emulator
  image: ${RETINA_REGISTRY_URI}/ntn-channel-emulator:${NTN_CHANNEL_EMULATOR_VERSION}_${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=fpga-virt-master
  requirements:
    cpu:
      requests: 2
      limits: 2
    memory:
      requests: "4G"
      limits: "4G"
    ephemeral-storage:
      requests: "4G"
      limits: "4G"
  resources:
    - type: zmq

- name: open5gs
  type: 5gc
  requirements:
    cpu:
      requests: 2
      limits: 2
    memory:
      requests: "4G"
      limits: "4G"
    ephemeral-storage:
      requests: "4G"
      limits: "4G"
  image: ${RETINA_REGISTRY_URI}/open5gs:${OPEN5GS_VERSION}_${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=fpga-virt-master
