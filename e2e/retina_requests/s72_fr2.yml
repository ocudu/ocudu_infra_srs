- name: amarisoft-ue
  type: ue
  image: ${RETINA_REGISTRY_URI}/amarisoftue:2025-12-19_${RETINA_VERSION}
  nof_ports: 16
  requirements:
    cpu:
      requests: 100%
      limits: 100%
    memory:
      requests: 100%
      limits: 100%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: license
      model: amarisoft-ue.*
    - type: ru
      model: fr2-ue-ru

- name: ocudu-gnb
  type: gnb
  image: ${RETINA_REGISTRY_URI}/ocudu-gnb:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 80%
      limits: 80%
    memory:
      requests: 80%
      limits: 80%
    hugepages-1Gi:
      requests: 2Gi
      limits: 2Gi
    ephemeral-storage:
      requests: 15G
  resources:
    - type: ru
      model: fr2-ru
  environment:
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb_split_7_2
    - LD_LIBRARY_PATH: /opt/rohc/lib/:/opt/dpdk/${DPDK_VERSION}/lib/x86_64-linux-gnu/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb_split_7_2/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true

- name: open5gs
  type: 5gc
  image: ${RETINA_REGISTRY_URI}/open5gs:${OPEN5GS_VERSION}_${RETINA_VERSION}
  requirements:
    cpu:
      requests: 20%
      limits: 20%
    memory:
      requests: 20%
      limits: 20%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: ru
      model: fr2-ru
      capacity: 0
