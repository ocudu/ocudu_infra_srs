- name: amarisoft-ue
  type: ue
  image: ${RETINA_REGISTRY_URI}/amarisoftue:${AMARISOFT_VERSION}_${RETINA_VERSION}
  nof_ports: 64
  requirements:
    cpu:
      requests: 20%
      limits: 20%
    memory:
      requests: 20%
      limits: 20%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: zmq
    - type: license
      model: amarisoft-ue.*
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/utils/trx_ocudu/libtrx_ocudu.so
      remote_path: /opt/lteue/trx_ocudu.so
      is_executable: true

- name: ocudu-gnb-1
  type: gnb
  image: ${RETINA_REGISTRY_URI}/ocudu-gnb:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 10%
      limits: 10%
    memory:
      requests: 10%
      limits: 10%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: zmq
      capacity: 0
  environment:
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb
    - LD_LIBRARY_PATH: /opt/rohc/lib/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true

