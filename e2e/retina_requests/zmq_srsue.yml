- name: srs-ue
  type: ue
  image: ${RETINA_REGISTRY_URI}/srsue:${SRSUE_VERSION}_${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=fpga-virt-master
  requirements:
    cpu:
      requests: 6
      limits: 6
    memory:
      requests: "26G"
      limits: "26G"
    ephemeral-storage:
      requests: "6G"
      limits: "6G"
  resources:
    - type: zmq

- name: ocudu-gnb
  type: gnb
  image: ${RETINA_REGISTRY_URI}/ocudu-gnb:${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=fpga-virt-master
  requirements:
    cpu:
      requests: 6
      limits: 6
    memory:
      requests: "26G"
      limits: "26G"
    ephemeral-storage:
      requests: "6G"
      limits: "6G"
  resources:
    - type: zmq
  environment:
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb
    - LD_LIBRARY_PATH: /opt/rohc/lib/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true

- name: open5gs
  type: 5gc
  requirements:
    cpu:
      requests: 2
      limits: 2
    memory:
      requests: "8G"
      limits: "8G"
    ephemeral-storage:
      requests: "6G"
      limits: "6G"
  image: ${RETINA_REGISTRY_URI}/open5gs:${OPEN5GS_VERSION}_${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=fpga-virt-master
