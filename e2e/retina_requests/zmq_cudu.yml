- name: amarisoft-ue
  type: ue
  image: ${RETINA_REGISTRY_URI}/amarisoftue:${AMARISOFT_VERSION}_${RETINA_VERSION}
  nof_ports: 64
  requirements:
    cpu:
      requests: 20%
    memory:
      requests: 20%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: zmq
    - type: license
      model: amarisoft-ue.*
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/utils/trx_ocudu/libtrx_ocudu.so
      remote_path: /opt/lteue/trx_ocudu.so
      is_executable: true

- name: ocudu-gnb
  type: gnb
  image: ${RETINA_REGISTRY_URI}/ocudu:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 20%
    memory:
      requests: 20%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: zmq
      dummy: true
  environment:
    - RETINA_AGENT: ocudu-cudu
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/cu:${OCUDU_PATH}/build_retina/apps/du
    - LD_LIBRARY_PATH: /opt/rohc/lib/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/cu/ocu
      remote_path: /usr/local/bin/ocu
      is_executable: true
    - local_path: ${OCUDU_PATH}/build_retina/apps/du/odu
      remote_path: /usr/local/bin/odu
      is_executable: true

- name: open5gs
  type: 5gc
  image: ${RETINA_REGISTRY_URI}/open5gs:${OPEN5GS_VERSION}_${RETINA_VERSION}
  requirements:
    cpu:
      requests: 10%
    memory:
      requests: 10%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: zmq
      dummy: true
