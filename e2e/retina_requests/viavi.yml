- name: ocudu-gnb
  type: gnb
  image: ${CI_REGISTRY_IMAGE}/retina/srsgnb:${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=dell-xr12
  requirements:
    cpu:
      requests: 10
      limits: 10
    memory:
      requests: "60G"
      limits: "60G"
    hugepages-1Gi:
      requests: 2Gi
      limits: 2Gi
    ephemeral-storage:
      requests: "150G"
      limits: "150G"
  resources:
    - type: emulator
      model: viavi
    - type: ru
      model: viavi-ru
  environment:
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb_split_7_2
    - LD_LIBRARY_PATH: /opt/rohc/lib/:/opt/dpdk/${E2E_DPDK_VERSION}/lib/x86_64-linux-gnu/
    - RTSAN_OPTIONS: halt_on_error=false:suppress_equal_stacks=true
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb_split_7_2/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true
