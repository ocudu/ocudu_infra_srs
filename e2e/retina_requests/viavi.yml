- name: ocudu-gnb
  type: gnb
  image: ${RETINA_REGISTRY_URI}/ocudu-gnb:${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=dell-xr12
  requirements:
    cpu:
      requests: 10
      limits: 10
    memory:
      requests: "60G"
      limits: "60G"
    hugepages-1Gi:
      requests: 2Gi
      limits: 2Gi
    ephemeral-storage:
      requests: "150G"
      limits: "150G"
  resources:
    - type: emulator
      model: viavi
    - type: ru
      model: viavi-ru
  environment:
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb_split_7_2
    - LD_LIBRARY_PATH: /opt/rohc/lib/:/opt/dpdk/${DPDK_VERSION}/lib/x86_64-linux-gnu/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb_split_7_2/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true
