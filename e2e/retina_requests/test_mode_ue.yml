- name: ocudu-gnb
  type: gnb
  image: ${RETINA_REGISTRY_URI}/ocudu-gnb:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 40%
      limits: 40%
    memory:
      requests: 40%
      limits: 40%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: zmq
  environment:
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb
    - LD_LIBRARY_PATH: /opt/rohc/lib/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true

- name: open5gs
  type: 5gc
  image: ${RETINA_REGISTRY_URI}/open5gs:${OPEN5GS_VERSION}_${RETINA_VERSION}
  requirements:
    cpu:
      requests: 10%
      limits: 10%
    memory:
      requests: 10%
      limits: 10%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: zmq
      dummy: true
