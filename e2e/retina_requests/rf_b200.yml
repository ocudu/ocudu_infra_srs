- name: amarisoft-ue
  type: ue
  image: ${RETINA_REGISTRY_URI}/amarisoftue:${RETINA_VERSION}
  nof_ports: 4
  requirements:
    cpu:
      requests: 4
    memory:
      requests: 8G
    ephemeral-storage:
      requests: 6G
  resources:
    - type: sdr
      model: b200
    - type: license
      model: amarisoft-ue.*
  shared_files:
    - local_path: ${AMARISOFT_PATH}
      remote_path: /builds/amarisoft/bin
      is_executable: false

- name: ocudu-gnb
  type: gnb
  image: ${RETINA_REGISTRY_URI}/ocudu:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 4
    memory:
      requests: 8G
    ephemeral-storage:
      requests: 6G
  resources:
    - type: sdr
      model: b200
  environment:
    - RETINA_AGENT: ocudu-gnb
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb
    - LD_LIBRARY_PATH: /opt/rohc/lib/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true

- name: open5gs
  type: 5gc
  image: ${RETINA_REGISTRY_URI}/open5gs:${OPEN5GS_VERSION}_${RETINA_VERSION}
  requirements:
    cpu:
      requests: 2
    memory:
      requests: 2G
    ephemeral-storage:
      requests: 6G
  resources:
    - type: sdr
      model: b200
      dummy: true
