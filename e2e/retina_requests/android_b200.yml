- name: android-ue
  type: ue
  image: ${CI_REGISTRY_IMAGE}/retina/android:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 1
      limits: 1
    memory:
      requests: "2G"
      limits: "2G"
    ephemeral-storage:
      requests: "6G"
      limits: "6G"
  resources:
    - type: android
      model: xiaomi-12-lite

- name: ocudu-gnb
  type: gnb
  image: ${CI_REGISTRY_IMAGE}/retina/ocudu-gnb:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 4
      limits: 4
    memory:
      requests: "8G"
      limits: "8G"
    ephemeral-storage:
      requests: "6G"
      limits: "6G"
  resources:
    - type: sdr
      model: b200
  environment:
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb
    - LD_LIBRARY_PATH: /opt/rohc/lib/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true

- name: open5gs
  type: 5gc
  image: ${CI_REGISTRY_IMAGE}/retina/open5gs:${OPEN5GS_VERSION}_${RETINA_VERSION}
  taints: ["purpose=retina"]
  requirements:
    cpu:
      requests: 2
      limits: 2
    memory:
      requests: "4G"
      limits: "4G"
    ephemeral-storage:
      requests: "6G"
      limits: "6G"
