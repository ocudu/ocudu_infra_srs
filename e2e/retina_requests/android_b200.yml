- name: android-ue
  type: ue
  image: ${RETINA_REGISTRY_URI}/android:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 500m
    memory:
      requests: 512Mi
    ephemeral-storage:
      requests: 6G
  resources:
    - type: android

- name: ocudu-gnb
  type: gnb
  image: ${RETINA_REGISTRY_URI}/ocudu:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 80%
      rounding: truncate
    memory:
      requests: 75%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: sdr
      model: b200
  environment:
    - RETINA_AGENT: ocudu-gnb
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb
    - LD_LIBRARY_PATH: /opt/rohc/lib/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true

- name: open5gs
  type: 5gc
  image: ${RETINA_REGISTRY_URI}/open5gs:${OPEN5GS_VERSION}_${RETINA_VERSION}
  requirements:
    cpu:
      requests: 20%
      rounding: truncate
    memory:
      requests: 20%
    ephemeral-storage:
      requests: 6G
  resources:
    - type: sdr
      model: b200
      dummy: true
