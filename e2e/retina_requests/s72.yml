- name: amarisoft-ue
  type: ue
  image: ${CI_REGISTRY_IMAGE}/retina/amarisoftue:${AMARISOFT_VERSION}_${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=srskit-rack1
  nof_ports: 16
  requirements:
    cpu:
      requests: 10
      limits: 10
    memory:
      requests: "8G"
      limits: "8G"
    ephemeral-storage:
      requests: "8G"
      limits: "8G"
  resources:
    - type: license
      model: amarisoft-ue.*
    - type: ru
      model: amariue-s72

- name: ocudu-gnb
  type: gnb
  image: ${CI_REGISTRY_IMAGE}/retina/ocudu-gnb:${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=dell-xr12
  requirements:
    cpu:
      requests: 8
      limits: 8
    memory:
      requests: "60G"
      limits: "60G"
    hugepages-1Gi:
      requests: 2Gi
      limits: 2Gi
    ephemeral-storage:
      requests: "6G"
      limits: "6G"
  resources:
    - type: ru
      model: s72-ru
  environment:
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb_split_7_2
    - LD_LIBRARY_PATH: /opt/rohc/lib/:/opt/dpdk/${DPDK_VERSION}/lib/x86_64-linux-gnu/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb_split_7_2/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true

- name: open5gs
  type: 5gc
  image: ${CI_REGISTRY_IMAGE}/retina/open5gs:${OPEN5GS_VERSION}_${RETINA_VERSION}
  labels:
    - kubernetes.io/hostname=dell-xr12
  requirements:
    cpu:
      requests: 2
      limits: 2
    memory:
      requests: "4G"
      limits: "4G"
    ephemeral-storage:
      requests: "6G"
      limits: "6G"
