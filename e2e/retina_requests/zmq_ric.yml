- name: srs-ue
  type: ue
  image: ${RETINA_REGISTRY_URI}/srsue:${SRSUE_VERSION}_${RETINA_VERSION}
  requirements:
    cpu:
      requests: 15%
    memory:
      requests: 15%
    ephemeral-storage:
      requests: "6G"
  resources:
    - type: zmq

- name: ocudu-gnb
  type: gnb
  image: ${RETINA_REGISTRY_URI}/ocudu-gnb:${RETINA_VERSION}
  requirements:
    cpu:
      requests: 15%
    memory:
      requests: 15%
    ephemeral-storage:
      requests: "6G"
  resources:
    - type: zmq
      dummy: true
  environment:
    - PATH: ${CONTAINER_PATH}:${OCUDU_PATH}/build_retina/apps/gnb
    - LD_LIBRARY_PATH: /opt/rohc/lib/
  shared_files:
    - local_path: ${OCUDU_PATH}/build_retina/apps/gnb/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true

- name: open5gs
  type: 5gc
  image: ${RETINA_REGISTRY_URI}/open5gs:${OPEN5GS_VERSION}_${RETINA_VERSION}
  requirements:
    cpu:
      requests: 10%
    memory:
      requests: 10%
    ephemeral-storage:
      requests: "6G"
  resources:
    - type: zmq
      dummy: true

- name: flexric-ric
  type: ric
  image: ${RETINA_REGISTRY_URI}/flexric:${FLEXRIC_VERSION}_${RETINA_VERSION}
  requirements:
    cpu:
      requests: 10%
    memory:
      requests: 10%
    ephemeral-storage:
      requests: "6G"
  resources:
    - type: zmq
      dummy: true
