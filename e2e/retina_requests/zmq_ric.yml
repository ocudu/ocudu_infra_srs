- name: srs-ue
  type: ue
  image: ${RETINA_REGISTRY_PREFIX}/srsue:${SRSUE_VERSION}_${RETINA_VERSION}
  labels:
    - ${ZMQ_HOSTLABEL}
  requirements:
    cpu:
      requests: 4
      limits: 4
    memory:
      requests: "22G"
      limits: "22G"
    ephemeral-storage:
      requests: "6G"
      limits: "6G"
  resources:
    - type: zmq

- name: ocudu-gnb
  type: gnb
  image: ${RETINA_REGISTRY_PREFIX}/srsgnb:${RETINA_VERSION}
  labels:
    - ${ZMQ_HOSTLABEL}
  requirements:
    cpu:
      requests: 4
      limits: 4
    memory:
      requests: "22G"
      limits: "22G"
    ephemeral-storage:
      requests: "15G"
      limits: "15G"
  resources:
    - type: zmq
  environment:
    - PATH: ${CONTAINER_PATH}:${OCUDU_ABS_BUILD_PATH}/apps/gnb
  shared_files:
    - local_path: ${OCUDU_REL_BUILD_PATH}/apps/gnb/gnb
      remote_path: /usr/local/bin/gnb
      is_executable: true

- name: open5gs
  type: 5gc
  requirements:
    cpu:
      requests: 2
      limits: 2
    memory:
      requests: "8G"
      limits: "8G"
    ephemeral-storage:
      requests: "6G"
      limits: "6G"
  image: ${RETINA_REGISTRY_PREFIX}/open5gs:${OPEN5GS_VERSION}_${RETINA_VERSION}
  labels:
    - ${ZMQ_HOSTLABEL}

- name: flexric-ric
  type: ric
  requirements:
    cpu:
      requests: 2
      limits: 2
    memory:
      requests: "8G"
      limits: "8G"
    ephemeral-storage:
      requests: "6G"
      limits: "6G"
  image: ${RETINA_REGISTRY_PREFIX}/flexric:${FLEXRIC_VERSION}_${RETINA_VERSION}
  labels:
    - ${ZMQ_HOSTLABEL}
