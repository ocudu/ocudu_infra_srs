# E2E CI/CD Pipeline

## MR
load retina env:
  extends: load retina variables
  rules:
    - &mr
      if: $ON_MR
      changes:
        - e2e/**/*

e2e tests tox:
  image: python:${PYTHON_VERSION}-alpine
  stage: static
  rules:
    - *mr
  variables:
    PY_DIR: e2e
  before_script:
    - apk add build-base
  script:
    - pip install 'tox<5'
    - cd $PY_DIR
    - tox -r
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]

e2e request and config validation:
  stage: static
  image:
    name: ${RETINA_REGISTRY_PREFIX}/launcher:${RETINA_VERSION}
    entrypoint: ["/bin/sh", "-c"]
  rules:
    - *mr
  script:
    - |
      cd ${CI_PROJECT_DIR}/e2e/retina_requests
      file_list=$(ls *.yml)
      for f in $file_list; do
          retina-request-checker --input $f
      done
      python3 ${CI_PROJECT_DIR}/e2e/tests/viavi/validate_test_declaration.py
  needs:
    - job: load retina env
      artifacts: true

## Build jobs for Scheduled Pipelines
load retina scheduled:
  extends: load retina variables
  stage: build # To simplify number of stages in scheduled pipelines
  rules:
    - &watchdog
      if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Watchdog/
    - &emulated_nightly
      if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Emulated Nightly/
    - &rf_nightly
      if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /RF Nightly/
    - &emulated_weekly
      if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Emulated Weekly/
  retry: 2

zmq driver:
  extends: build trx driver
  retry: 2
  rules:
    - *watchdog
    - *emulated_nightly
  needs:
    - load retina scheduled

release with deb info:
  extends: build
  retry: 2
  cache: []
  rules:
    - *watchdog
    - *emulated_nightly
    - *rf_nightly
  variables:
    OS: ubuntu-24.04
    SRS_TARGET: srscu srsdu gnb
    COMPILER: gcc
    BUILD_ARGS: >
      -DENABLE_WERROR=False -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMARCH=x86-64-v3
      -DASSERT_LEVEL=PARANOID
    TEST_MODE: none
    INFRASTRUCTURE_TAG: amd64-avx2

debug:
  extends: build
  retry: 2
  cache: []
  rules:
    - *emulated_nightly
  variables:
    OS: ubuntu-24.04
    SRS_TARGET: gnb
    COMPILER: gcc
    BUILD_ARGS: >
      -DENABLE_WERROR=False -DCMAKE_BUILD_TYPE=Debug -DMARCH=x86-64-v3
      -DASSERT_LEVEL=PARANOID -DEXIT_TIMEOUT=120
    TEST_MODE: none
    INFRASTRUCTURE_TAG: amd64-avx2

asan:
  extends: build
  retry: 2
  cache: []
  rules:
    - *emulated_nightly
    - *rf_nightly
  variables:
    OS: ubuntu-24.04
    SRS_TARGET: gnb
    COMPILER: clang
    BUILD_ARGS: >
      -DENABLE_WERROR=False -DCMAKE_BUILD_TYPE=Debug -DMARCH=x86-64-v3
      -DENABLE_ASAN=True -DASSERT_LEVEL=PARANOID -DEXIT_TIMEOUT=120
    TEST_MODE: none
    INFRASTRUCTURE_TAG: amd64-avx2

tsan:
  extends: build
  retry: 2
  cache: []
  rules:
    - *emulated_nightly
  variables:
    OS: ubuntu-24.04
    SRS_TARGET: gnb
    COMPILER: clang
    BUILD_ARGS: >
      -DENABLE_WERROR=False -DCMAKE_BUILD_TYPE=Debug -DMARCH=x86-64-v3
      -DENABLE_TSAN=True -DASSERT_LEVEL=PARANOID -DEXIT_TIMEOUT=120
    TEST_MODE: none
    INFRASTRUCTURE_TAG: amd64-avx2

dpdk rtsan avx2:
  extends: build
  retry: 2
  cache: []
  rules:
    - *emulated_nightly
  variables:
    OS: ubuntu-24.04-rtsan
    SRS_TARGET: gnb_split_7_2
    COMPILER: clang
    DPDK_VERSION: 24.11.2_avx2
    BUILD_ARGS: >
      -DENABLE_WERROR=False -DCMAKE_BUILD_TYPE=Release -DFORCE_DEBUG_INFO=True -DMARCH=x86-64-v3
      -DENABLE_RTSAN=True -DENABLE_ZEROMQ=False -DENABLE_UHD=False -DENABLE_DPDK=True
      -DASSERT_LEVEL=AUTO -DEXIT_TIMEOUT=30
    TEST_MODE: none
    INFRASTRUCTURE_TAG: amd64-avx2

dpdk rtsan avx512:
  extends: build
  retry: 2
  cache: []
  rules:
    - *emulated_nightly
    - *emulated_weekly
  variables:
    OS: ubuntu-24.04-rtsan
    SRS_TARGET: gnb_split_7_2 gnb
    COMPILER: clang
    DPDK_VERSION: 24.11.2_avx512
    BUILD_ARGS: >
      -DENABLE_WERROR=False -DCMAKE_BUILD_TYPE=Release -DFORCE_DEBUG_INFO=True -DMARCH=x86-64-v4
      -DENABLE_RTSAN=True -DENABLE_ZEROMQ=False -DENABLE_UHD=False -DENABLE_DPDK=True
      -DASSERT_LEVEL=AUTO -DEXIT_TIMEOUT=30
    TEST_MODE: none
    INFRASTRUCTURE_TAG: amd64-avx2-avx512

## Emulated Nightly
### Test mode
.test mode ue:
  extends: e2e
  stage: test mode
  rules:
    - *emulated_nightly
  variables:
    GROUP: zmq
    E2E_TAG: new-retina-e2e-amd64
    TESTBED: test_mode_ue
    MARKERS: test_mode
    KEYWORDS: test_ue
    RETINA_ARGS: ue.all.log_level=warning gnb.all.log_level=warning 5gc.all.log_level=warning

test ue:
  extends: .test mode ue
  needs:
    - load retina scheduled
    - release with deb info

test ue asan:
  extends: .test mode ue
  needs:
    - load retina scheduled
    - asan

.test mode ru:
  extends: e2e
  stage: test mode
  rules:
    - *emulated_nightly
  variables:
    GROUP: viavi
    E2E_TAG: new-retina-e2e-amd64
    TESTBED: test_mode_ru
    RETINA_ARGS: ue.all.log_level=warning gnb.all.log_level=warning 5gc.all.log_level=warning

ru dummy:
  extends: .test mode ru
  variables:
    MARKERS: test_mode
    KEYWORDS: test_ru
  needs:
    - load retina scheduled
    - dpdk rtsan avx512

ru dummy asan:
  extends: .test mode ru
  variables:
    MARKERS: test_mode_not_crash
    KEYWORDS: "test_ru"
  needs:
    - load retina scheduled
    - asan

ru dummy tsan:
  extends: .test mode ru
  variables:
    MARKERS: test_mode_not_crash
    KEYWORDS: "test_ru"
  needs:
    - load retina scheduled
    - tsan

ru dummy test many ues:
  extends: .test mode ru
  variables:
    MARKERS: test_mode_many_ues
    KEYWORDS: test_mode_many_ues
  needs:
    - load retina scheduled
    - dpdk rtsan avx512

### SRSUE
.srsue:
  extends: e2e
  stage: srsue
  rules:
    - *emulated_nightly
  variables:
    GROUP: zmq
    E2E_TAG: new-retina-e2e-amd64
    RETINA_ARGS: ue.all.log_level=info gnb.all.log_level=info 5gc.all.log_level=info
    LAUNCHER_ARGS: -n 2
  needs:
    - load retina scheduled
    - release with deb info

srsue basic:
  extends: .srsue
  variables:
    TESTBED: zmq_srsue
    MARKERS: zmq_srsue

ric:
  extends: .srsue
  variables:
    TESTBED: zmq_ric
    MARKERS: zmq_ric

### Amarisoft ZMQ
.amarisoft_zmq:
  extends: e2e
  stage: amarisoft zmq
  rules:
    - *emulated_nightly
  variables:
    GROUP: zmq
    E2E_TAG: new-retina-e2e-amd64
    TESTBED: zmq
    LAUNCHER_ARGS: -n 2
    RETINA_ARGS: >
      gnb.all.pcap=True gnb.all.mac_enable=True gnb.all.enable_integrity_protection=True
      ue.all.log_level=info gnb.all.log_level=info 5gc.all.log_level=info
  needs:
    - load retina scheduled
    - zmq driver
    - release with deb info

smoke zmq:
  extends: .amarisoft_zmq
  rules:
    - *watchdog
  variables:
    MARKERS: smoke
    LAUNCHER_ARGS: -x
    RETINA_ARGS: >
      ue.all.pdcch_decode_opt_threshold=0.1
      gnb.all.pcap=True gnb.all.mac_enable=True gnb.all.enable_integrity_protection=True
      ue.all.log_level=info gnb.all.log_level=info 5gc.all.log_level=info

gnb 1UE:
  extends: .amarisoft_zmq
  variables:
    MARKERS: zmq_single_ue

gnb 4UE:
  extends: .amarisoft_zmq
  variables:
    FILE_OR_DIR: tests/slicing.py

gnb 4UE asan:
  extends: .amarisoft_zmq
  variables:
    MARKERS: smoke
    KEYWORDS: iperf
  needs:
    - load retina scheduled
    - zmq driver
    - asan

gnb 4UE tsan:
  extends: .amarisoft_zmq
  variables:
    MARKERS: smoke
    KEYWORDS: iperf
  needs:
    - load retina scheduled
    - zmq driver
    - tsan

gnb 4UE memcheck:
  extends: .amarisoft_zmq
  variables:
    MARKERS: zmq_valgrind
    RETINA_ARGS: >
      gnb.all.pcap=True gnb.all.mac_enable=True gnb.all.rlc_enable=True gnb.all.enable_integrity_protection=True
      ue.all.log_level=info gnb.all.log_level=warning 5gc.all.log_level=info
  needs:
    - load retina scheduled
    - zmq driver
    - debug

gnb 8UE:
  extends: .amarisoft_zmq
  variables:
    MARKERS: zmq and not smoke
  timeout: 4h
  parallel:
    matrix:
      - FILE_OR_DIR: tests/attach_detach.py
      - FILE_OR_DIR: tests/reestablishment.py
        KEYWORDS: sequentially
      - FILE_OR_DIR: tests/reestablishment.py
        KEYWORDS: "not sequentially"
      - FILE_OR_DIR: tests/handover.py
        KEYWORDS: sequentially

gnb 32UE:
  extends: .amarisoft_zmq
  variables:
    MARKERS: "zmq and not smoke"
  parallel:
    matrix:
      - FILE_OR_DIR: tests/iperf.py
        KEYWORDS:
          [
            "udp and band:3",
            "udp and not band:3",
            "tcp and band:3",
            "tcp and not band:3 and not precoding",
            "tcp and not band:3 and precoding",
          ]
      - FILE_OR_DIR: tests/ping.py
        KEYWORDS: "32"
      - FILE_OR_DIR: tests/handover.py
        KEYWORDS: "not sequentially"
      - MARKERS: zmq_2x2_mimo

amari 32UE [tests/pucch.py]:
  extends: .amarisoft_zmq
  variables:
    MARKERS: "zmq and not smoke"
    FILE_OR_DIR: tests/pucch.py
    RETINA_ARGS: >
      ue.all.pdcch_decode_opt_threshold=0.1
      gnb.all.pcap=True gnb.all.mac_enable=True gnb.all.enable_integrity_protection=True
      ue.all.log_level=info gnb.all.log_level=info 5gc.all.log_level=info

gnb 64UE:
  extends: .amarisoft_zmq
  variables:
    FILE_OR_DIR: tests/iperf.py
    KEYWORDS: "64"

cudu 8UE:
  extends: .amarisoft_zmq
  timeout: 2h
  variables:
    TESTBED: zmq_cudu
    MARKERS: "zmq and not smoke"
    FILE_OR_DIR: tests/reestablishment.py
    KEYWORDS: sequentially

cudu 32UE:
  extends: .amarisoft_zmq
  timeout: 2h
  variables:
    TESTBED: zmq_cudu
    FILE_OR_DIR: tests/iperf.py
    KEYWORDS: "tcp and not band:3 and bandwidth:50 and not precoding"
    MARKERS: "zmq and not smoke"

cudu 64UE:
  extends: .amarisoft_zmq
  timeout: 3h
  variables:
    TESTBED: zmq_cudu
    FILE_OR_DIR: tests/ping.py
    KEYWORDS: "64"
    MARKERS: "zmq and not smoke"

1cu2du 8UE:
  extends: .amarisoft_zmq
  timeout: 2h
  variables:
    TESTBED: zmq_1cu2du
    MARKERS: "zmq and not smoke"
    FILE_OR_DIR: tests/inter_du_handover.py
    KEYWORDS: sequentially

2gnb:
  extends: .amarisoft_zmq
  timeout: 2h
  variables:
    TESTBED: zmq_2gnb
    MARKERS: "zmq and not smoke"
    FILE_OR_DIR: tests/inter_cu_handover.py

### Amarisoft s72
.amarisoft s72:
  extends: e2e
  stage: amarisoft s72
  rules:
    - *emulated_nightly
  variables:
    GROUP: viavi
    E2E_TAG: new-retina-e2e-amd64
    TESTBED: s72
    MARKERS: s72
