spec:
  inputs:
    ocudu_path:
      type: string
      default: ocudu/ocudu
      description: "OCUDU repository path."
    ocudu_ref:
      type: string
      default: dev
      description: "OCUDU reference branch or tag."
---
include:
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/python.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/static.yml
  - local: e2e/ci/e2e_template.yml
    inputs:
      ocudu_path: $[[ inputs.ocudu_path ]]
      ocudu_ref: $[[ inputs.ocudu_ref ]]

# E2E CI/CD Pipeline

## MR
e2e tests tox:
  extends: .tox
  stage: static
  rules:
    - if: $ON_MR
      changes:
        - e2e/tests/**/*
        - e2e/scripts/**/*
        - e2e/conftest.py
        - e2e/pyproject.toml
        - e2e/retina_requests/**/*
        - retina/**/*.py
  variables:
    PY_DIR: e2e
  before_script:
    - apk add build-base
  needs: []

e2e dynamic tests validation:
  image:
    name: ${RETINA_REGISTRY_URI}/launcher:${RETINA_VERSION}
    entrypoint: ["/bin/sh", "-c"]
  stage: static
  rules:
    - if: $ON_MR
      changes:
        - retina/launcher/**/*
        - e2e/tests/**/*
        - e2e/conftest.py
        - e2e/pyproject.toml
  script:
    - cd ${CI_PROJECT_DIR}/e2e
    - retina-launcher -W error --collect-only
  needs:
    - get retina version
    - job: retina containers [launcher]
      optional: true

e2e request validation:
  image:
    name: ${RETINA_REGISTRY_URI}/launcher:${RETINA_VERSION}
    entrypoint: ["/bin/sh", "-c"]
  stage: static
  rules:
    - if: $ON_MR
      changes:
        - retina/orchestrator/**/*
        - e2e/retina_requests/**/*
  script:
    - |
      cd ${CI_PROJECT_DIR}/e2e/retina_requests
      python3 ${CI_PROJECT_DIR}/retina/_scripts/generate_env.py
      file_list=$(ls *.yml)
      for f in $file_list; do
          retina-request-checker --input $f
      done
  needs:
    - get retina version
    - job: retina containers [launcher]
      optional: true

dynamically generated pipeline validation:
  extends: .static
  rules:
    - if: $ON_MR
      changes:
        - e2e/tests/**/*
        - e2e/scripts/generate_pipelines.py
        - e2e/*.yml
        - e2e/ci/*.yml
        - .gitlab-ci-stages.yml
  script:
    - |
      python3 e2e/scripts/generate_pipelines.py --input_path=e2e/tests/suites --pipelines_output_path=e2e/ci --stages_output_path=.
      is-pristine-repo.sh

## Child pipeline triggers
.trigger e2e:
  stage: e2e
  rules:
    - if: $ON_MR
    - if: $ON_WEB
  when: manual
  allow_failure: true
  variables:
    TRIGGERED_ON_MR: "true"
    # Runner tag for the build jobs of the child pipeline (see e2e/ci/child_template.yml).
    # Using ${OCUDU_RUNNER_TAG} directly there does not work: OCUDU_RUNNER_TAG is defined
    # in ocudu's .gitlab/ci-shared/workflow.yml, which the child pipeline does not include,
    # so the child only sees the copy forwarded from this pipeline (trigger:forward:
    # yaml_variables). Forwarded variables rank above any group/project overwrite.
    # Expanding it here instead, in the parent, allows a group/project overwrite correctly
    # and forwards a flat string the child just uses.
    OCUDU_AMD_RUNNER_TAG: ${OCUDU_RUNNER_TAG}-amd64
  needs:
    - get retina version

## Scheduled pipeline setup
retina demolition:
  stage: e2e
  tags:
    - retina
    - ${GROUP}
  image:
    name: ${RETINA_REGISTRY_URI}/launcher:${RETINA_VERSION}
    entrypoint: ["/bin/sh", "-c"]
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Prepare Nightly/
  script:
    - retina-garbage-collector --in-cluster --mode demolition
  parallel:
    matrix:
      - GROUP: rf
      - GROUP: viavi
      - GROUP: zmq
  retry: 2
  needs:
    - get retina version

## Scheduled pipelines promotion
.ocudu promotion:
  stage: .post
  image:
    name: alpine/git:v2.49.1
    entrypoint: ["/bin/sh", "-c"]
  variables:
    GIT_STRATEGY: none
    BRANCH: ""
  script:
    - |
      if [ -n "${GITLAB_TOKEN}" ]; then
        echo "OCUDU Infra SRS Promotion"
        cd $CI_PROJECT_DIR
        git clone https://gitlab_token:${GITLAB_TOKEN}@${CI_SERVER_SHELL_SSH_HOST}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}.git ocudu_infra_srs
        cd ocudu_infra_srs
        git fetch origin $BRANCH || echo "$BRANCH does not exist yet"
        git checkout -t origin/$BRANCH || git checkout -b $BRANCH
        git rebase ${CI_COMMIT_SHA}
        git push --set-upstream origin $BRANCH
      fi
    - |
      if [ -n "${OCUDU_PROMOTION_TOKEN}" ]; then
        echo "OCUDU Promotion"
        cd $CI_PROJECT_DIR
        git clone -b $[[ inputs.ocudu_ref ]] https://oauth2:${OCUDU_PROMOTION_TOKEN}@${CI_SERVER_HOST}/$[[ inputs.ocudu_path ]].git ocudu
        cd ocudu
        git fetch origin $BRANCH || echo "$BRANCH does not exist yet"
        git checkout -t origin/$BRANCH || git checkout -b $BRANCH
        git rebase $[[ inputs.ocudu_ref ]]
        git push --set-upstream origin $BRANCH
      fi
  dependencies: []

## Build jobs for Scheduled Pipelines
# In functional_base.yml - zmq driver, release with deb info
# In performance_base.yml - dpdk rtsan avx512

debug:
  extends: .build
  retry: 2
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Emulated Nightly/
  variables:
    OS: ubuntu-26.04
    OCUDU_TARGET: gnb
    COMPILER: gcc
    BUILD_ARGS: >
      -DENABLE_WERROR=False -DCMAKE_BUILD_TYPE=Debug -DMARCH=x86-64-v3
      -DASSERT_LEVEL=PARANOID -DEXIT_TIMEOUT=120
    TEST_MODE: none

asan:
  extends: .build
  retry: 2
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Emulated Nightly/
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /RF Nightly/
  variables:
    OS: ubuntu-26.04
    OCUDU_TARGET: gnb
    COMPILER: clang
    BUILD_ARGS: >
      -DENABLE_WERROR=False -DCMAKE_BUILD_TYPE=Debug -DMARCH=x86-64-v3
      -DENABLE_ASAN=True -DASSERT_LEVEL=PARANOID -DEXIT_TIMEOUT=120
    TEST_MODE: none

tsan:
  extends: .build
  retry: 2
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Emulated Nightly/
  variables:
    OS: ubuntu-26.04
    OCUDU_TARGET: gnb
    COMPILER: clang
    BUILD_ARGS: >
      -DENABLE_WERROR=False -DCMAKE_BUILD_TYPE=Debug -DMARCH=x86-64-v3
      -DENABLE_TSAN=True -DASSERT_LEVEL=PARANOID -DEXIT_TIMEOUT=120
    TEST_MODE: none

## Emulated Nightly
### Test mode
.test mode ue:
  extends: .e2e
  stage: test mode
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Emulated Nightly/
  variables:
    GROUP: zmq
    TESTBED: test_mode_ue
    MARKERS: test_mode
    KEYWORDS: test_ue
    RETINA_ARGS: ue.all.log_level=warning gnb.all.log_level=warning 5gc.all.log_level=warning

test ue:
  extends: .test mode ue
  needs:
    - get retina version
    - release with deb info

test ue asan:
  extends: .test mode ue
  needs:
    - get retina version
    - asan

.test mode ru:
  extends: .e2e
  stage: test mode
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Emulated Nightly/
  variables:
    GROUP: viavi
    TESTBED: test_mode_ru
    RETINA_ARGS: ue.all.log_level=warning gnb.all.log_level=warning 5gc.all.log_level=warning

ru dummy:
  extends: .test mode ru
  variables:
    MARKERS: test_mode
    KEYWORDS: test_ru
  needs:
    - get retina version
    - dpdk rtsan avx512

ru dummy tsan:
  extends: .test mode ru
  variables:
    MARKERS: test_mode_not_crash
    KEYWORDS: "test_ru"
  needs:
    - get retina version
    - tsan

ru dummy test many ues:
  extends: .test mode ru
  variables:
    MARKERS: test_mode_many_ues
    KEYWORDS: test_mode_many_ues
  needs:
    - get retina version
    - dpdk rtsan avx512

### SRSUE
.srsue:
  extends: .e2e
  stage: srsue
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Emulated Nightly/
  variables:
    GROUP: zmq
    RETINA_ARGS: ue.all.log_level=info gnb.all.log_level=info 5gc.all.log_level=info
  needs:
    - get retina version
    - release with deb info

srsue basic:
  extends: .srsue
  variables:
    TESTBED: zmq_srsue
    MARKERS: zmq_srsue

ric:
  extends: .srsue
  variables:
    TESTBED: zmq_ric
    MARKERS: zmq_ric

### Viavi
.viavi:
  extends: .e2e
  stage: viavi
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Emulated Nightly/
  timeout: 8h
  variables:
    GROUP: viavi
    TESTBED: viavi
    MARKERS: viavi
    RETINA_ARGS: >
      gnb.all.pcap=True gnb.all.rlc_enable=True gnb.all.rlc_rb_type=srb
      ue.all.log_level=warning gnb.all.log_level=warning 5gc.all.log_level=warning
  needs:
    - get retina version
    - dpdk rtsan avx512

1UE:
  extends: .viavi
  variables:
    KEYWORDS: "1UE and ideal and not MIMO"

1UE MIMO:
  extends: .viavi
  variables:
    KEYWORDS: "1UE and ideal and MIMO"

1UE birth-death:
  extends: .viavi
  variables:
    KEYWORDS: "1UE and birth-death"

1UE fading:
  extends: .viavi
  variables:
    KEYWORDS: "1UE and fading and not MIMO"

1UE fading MIMO:
  extends: .viavi
  variables:
    KEYWORDS: "1UE and fading and MIMO"

32UE ping:
  extends: .viavi
  variables:
    KEYWORDS: "32UE and ping"

32UE UDP:
  extends: .viavi
  variables:
    KEYWORDS: "32UE and ideal and not long and not tdd and not UM and udp"

32UE TCP:
  extends: .viavi
  variables:
    KEYWORDS: "32UE and ideal and not long and not tdd and not UM and tcp"

32UE fading:
  extends: .viavi
  variables:
    KEYWORDS: "32UE and fading"

32UE tdd:
  extends: .viavi
  variables:
    KEYWORDS: "32UE and tdd"

## RF Nightly
### SDR
.amarisoft sdr:
  extends: .e2e_amarisoft
  stage: amarisoft sdr
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /RF Nightly/
  variables:
    GROUP: rf
    TESTBED: rf_b200
    RETINA_ARGS: >
      ue.all.log_level=warning gnb.all.log_level=warning 5gc.all.log_level=warning
  needs:
    - get retina version
    - release with deb info

b200 asan:
  extends: .amarisoft sdr
  variables:
    MARKERS: rf_not_crash
  needs:
    - get retina version
    - asan

