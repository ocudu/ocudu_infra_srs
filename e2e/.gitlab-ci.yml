    - load retina scheduled
    - dpdk rtsan avx2

gnb 1UE s72:
  extends: .amarisoft s72
  variables:
    KEYWORDS: not handover

gnb 2UE s72:
  extends: .amarisoft s72
  variables:
    KEYWORDS: handover

### Viavi
.viavi:
