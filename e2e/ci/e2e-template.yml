spec:
  inputs:
    ocudu_path:
      type: string
      default: ocudu/ocudu
      description: "OCUDU repository path."
    ocudu_ref:
      type: string
      default: dev
      description: "OCUDU reference branch or tag."
---
include:
  - local: e2e/ci/functional-base.yml
  - local: e2e/ci/functional-config.yml
    rules:
      - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /functional/
  - local: e2e/ci/performance-base.yml
  - local: e2e/ci/performance-config.yml
    rules:
      - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /performance/

functional:
  extends: .trigger e2e
  trigger:
    include:
      - local: e2e/ci/child-template.yml
        inputs:
          ocudu_path: $[[ inputs.ocudu_path ]]
          ocudu_ref: $[[ inputs.ocudu_ref ]]
      - local: e2e/ci/functional-base.yml
      - local: e2e/ci/functional-config.yml
    strategy: mirror
    forward:
      pipeline_variables: true

functional promotion:
  extends: .ocudu promotion
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /functional/ && $OCUDU_PROMOTION_TOKEN
  variables:
    BRANCH: srs_functional

performance:
  extends: .trigger e2e
  trigger:
    include:
      - local: e2e/ci/child-template.yml
        inputs:
          ocudu_path: $[[ inputs.ocudu_path ]]
          ocudu_ref: $[[ inputs.ocudu_ref ]]
      - local: e2e/ci/performance-base.yml
      - local: e2e/ci/performance-config.yml
    strategy: mirror
    forward:
      pipeline_variables: true

performance promotion:
  extends: .ocudu promotion
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /performance/ && $OCUDU_PROMOTION_TOKEN
  variables:
    BRANCH: srs_performance
