zmq driver:
  extends: .build trx driver
  retry: 2
  rules:
    - if: $TRIGGERED_ON_MR == "true"
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /functional/
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Emulated Nightly/

release with deb info:
  extends: .build
  retry: 2
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /functional/
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Emulated Nightly/
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /RF Nightly/
  variables: &release_with_deb_info_vars
    OS: ubuntu-26.04
    COMPILER: gcc
    BUILD_ARGS: >
      -DENABLE_WERROR=False -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMARCH=x86-64-v3
      -DASSERT_LEVEL=PARANOID
    TEST_MODE: none
  parallel: &release_with_deb_info_parallel # Splitting it in different jobs because binaries size in relwithdeb was greater than 1 gb
    matrix:
      - OCUDU_TARGET: ocucp ocuup ocu odu
      - OCUDU_TARGET: gnb

release cached:
  extends: .build
  retry: 2
  rules:
    - if: $TRIGGERED_ON_MR == "true"
  variables: &release_with_deb_info_vars
    OS: ubuntu-24.04
    COMPILER: gcc
    BUILD_ARGS: >
      -DENABLE_WERROR=False -DCMAKE_BUILD_TYPE=Release -DMARCH=x86-64-v3 -DASSERT_LEVEL=PARANOID
    TEST_MODE: none
  cache:
    - key: release
      paths: [ocudu/ccache]
      policy: pull-push

.functional_e2e:
  extends: .e2e_amarisoft
  variables:
    GROUP: zmq
  needs:
    - job: get retina version
      artifacts: true
      optional: true
    - job: zmq driver
      artifacts: true
      optional: false
    - job: release with deb info
      artifacts: true
      optional: true
    - job: release cached
      artifacts: true
      optional: true
