inter_cu_ho:
  stage: mobility
  extends: .functional_e2e
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^functional/
    - when: manual
      allow_failure: true
  variables:
    KEYWORDS: "mobility.inter_cu_ho."
