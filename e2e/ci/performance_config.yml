coverage:
  stage: mobility
  extends: .performance_e2e
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^performance/
    - when: manual
      allow_failure: true
  variables:
    KEYWORDS: "mobility.coverage."
    TESTBED: dynamic
    MARKERS: "(s72 or test_mode_ru) and not weekly"

