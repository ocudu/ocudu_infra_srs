zmq driver:
  extends: .build trx driver
  retry: 2
  rules:
    - if: $TRIGGERED_ON_MR == "true"
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^functional/

release zmq:
  extends: .build
  retry: 2
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^functional/
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^interop/
  variables:
    OS: ubuntu-26.04
    OCUDU_TARGET: ocucp ocuup ocu odu gnb
    COMPILER: gcc
    BUILD_ARGS: >
      -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-ggdb1 -DENABLE_WERROR=False -DENABLE_UHD=False
      -DASSERT_LEVEL=PARANOID -DMARCH=x86-64-v3
    TEST_MODE: none

release zmq cached:
  extends: release zmq
  rules:
    - if: $TRIGGERED_ON_MR == "true"
  cache:
    - key: zmq release
      paths: [ocudu/ccache]
      policy: pull-push

.functional_e2e:
  extends: .e2e_amarisoft
  variables:
    GROUP: zmq
  needs:
    - job: get retina version
      artifacts: true
      optional: true
    - job: zmq driver
      artifacts: true
      optional: false
    - job: release zmq
      artifacts: true
      optional: true
    - job: release zmq cached
      artifacts: true
      optional: true

.interop_e2e:
  extends: .e2e
  variables:
    GROUP: zmq
  needs:
    - job: get retina version
      artifacts: true
      optional: true
    - job: release zmq
      artifacts: true
      optional: true
    - job: release zmq cached
      artifacts: true
      optional: true
