zmq driver:
  extends: .build trx driver
  retry: 2
  rules:
    - if: $TRIGGERED_ON_MR == "true"
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^functional/

release with deb info:
  extends: .build
  retry: 2
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^functional/
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^interop/
  variables:
    OS: ubuntu-26.04
    COMPILER: gcc
    BUILD_ARGS: >
      -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_WERROR=False -DENABLE_UHD=False
      -DASSERT_LEVEL=PARANOID -DMARCH=x86-64-v3
    TEST_MODE: none
  parallel: # Splitting it in different jobs because binaries size in relwithdeb was greater than 1 gb
    matrix:
      - OCUDU_TARGET: ocucp ocuup ocu odu
      - OCUDU_TARGET: gnb

release cached:
  extends: .build
  retry: 2
  rules:
    - if: $TRIGGERED_ON_MR == "true"
  variables:
    OS: ubuntu-26.04
    COMPILER: gcc
    BUILD_ARGS: >
      -DCMAKE_BUILD_TYPE=Release -DENABLE_WERROR=False -DENABLE_UHD=False
      -DASSERT_LEVEL=PARANOID -DMARCH=x86-64-v3
    TEST_MODE: none
  cache:
    - key: release
      paths: [ocudu/ccache]
      policy: pull-push

.functional_e2e:
  extends: .e2e_amarisoft
  variables:
    GROUP: zmq
  needs:
    - job: get retina version
      artifacts: true
      optional: true
    - job: zmq driver
      artifacts: true
      optional: false
    - job: release with deb info
      artifacts: true
      optional: true
    - job: release cached
      artifacts: true
      optional: true

.interop_e2e:
  extends: .e2e
  variables:
    GROUP: zmq
  needs:
    - job: get retina version
      artifacts: true
      optional: true
    - job: release with deb info
      artifacts: true
      optional: true
    - job: release cached
      artifacts: true
      optional: true
