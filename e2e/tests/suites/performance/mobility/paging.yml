# tid2.2.22: Paging test
paging: &base_config
  template: ue_simulator.test_gnb
  request: s72
  ue:
    config: [1cell.cfg, paging.cfg]
    parameters:
      dl_bitrate: 1.0e+3
      ul_bitrate: 1.0e+3
      nof_paging: &nof_paging 2
      log_level: warning
  gnb:
    config: [amf.yml, cell_cfg.yml, tdd_default.yml, mac_pcap.yml, inactivity_timer.yml]
    parameters: &s72_parameters
      log_level: warning
      warning_allowlist:
        - missed incoming User-Plane PRACH messages
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-MOB-11]
  criteria:
    dl_bitrate: 0
    ul_bitrate: 0
    nof_ko_dl: 0
    nof_ko_ul: 0
    nof_reestablishments_eq: 0
    nof_5gs_nas_service_accept_eq: *nof_paging
    nof_ng_paging_eq: *nof_paging
    nof_pdu_session_establishment_accept_eq: 1
    nof_error_indications: 0
    nof_paging_eq: 4 # the DU sends 2x Paging messages per NG paging
    errors: 0
    warnings: 0

# tid2.2.23: DRX test
drx:
  <<: *base_config
  gnb:
    config: [amf.yml, cell_cfg.yml, tdd_default.yml, drx.yml, mac_pcap.yml, inactivity_timer.yml]
    parameters:
      drx_long_cycle: 80
      <<: *s72_parameters
  feature_ids: [MVP-FUNC-SVCS-16-6]
  criteria:
    dl_bitrate: 0
    ul_bitrate: 0
    nof_ko_dl: 0
    nof_ko_ul: 0
    nof_reestablishments_eq: 0
    nof_pdu_session_establishment_accept_eq: 1
    nof_error_indications: 0
    errors: 0
    warnings: 0
    nof_ng_paging_eq: *nof_paging
    nof_paging_eq: 4  # the DU sends 2x Paging messages per NG paging
    drx_long_cycle_eq: 7 # this is the coded value that corresponds to 80 ms

# tid2.2.24: eDRX test
edrx:
  <<: *base_config
  gnb:
    config: [amf.yml, cell_cfg.yml, tdd_default.yml, edrx.yml, mac_pcap.yml, inactivity_timer.yml]
    parameters:
      <<: *s72_parameters
  feature_ids: [DU-GEN-10]

