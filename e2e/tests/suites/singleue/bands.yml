# Baseline band n66
band_n66:
  <<: *base_config
  ue:
    config: [1cell.cfg, udp_singleue.cfg]
    parameters:
      band: 66
      dl_nr_arfcn: 430000
      ssb_nr_arfcn: 428650
      bandwidth: 20
      common_scs: 15
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      traffic_duration: 2
  gnb:
    config: [cu_cp.yml, du.yml, pucch_config.yml, srs_periodic_wband.yml, mac_pcap.yml]
    parameters:
      band: 66
      dl_nr_arfcn: 430000
      bandwidth: 20
      common_scs: 15
      prach_config_index: 16
      pucch_format: "f1_and_f3"
      nof_cell_sr_res: 1
      nof_cell_csi_res: 1
      resource_set_size: 2
  feature_ids: [MVP-FUNC-PHY-16-1]

# 4T4R DL for mid bands authorized in North America (2.1GHz)
band_na_4t4r_dl:
  <<: *base_config
  request: zmq_1000
  ue:
    config: [1cell.cfg, udp_singleue.cfg]
    parameters:
      band: 66       # n66 (FDD) is available in the US and the DL carrier is on 2.11-2.2GHz
      dl_nr_arfcn: 430000
      ssb_nr_arfcn: 428650
      bandwidth: 20
      common_scs: 15
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      traffic_duration: 2
      nof_antennas_dl: 4
      nof_antennas_ul: 4
      pdcch_decode_threshold: 0
  gnb:
    config: [cu_cp.yml, du.yml]
    parameters:
      band: 66   # n66 (FDD) is available in the UE and the DL carrier is on 2.11-2.2GHz
      dl_nr_arfcn: 430000
      bandwidth: 20
      common_scs: 15
      nof_antennas_dl: 4
      nof_antennas_ul: 4
  feature_ids: [MVP-FUNC-PHY-16-8]

# 2T2R UL for mid bands authorized in North America (1.8GHz)
band_na_2t2r_ul:
  <<: *base_config
  ue:
    config: [1cell.cfg, udp_singleue.cfg]
    parameters:
      band: 25       # n25 (FDD) is available in the US and the UL carrier is on 1.85-1.915GHz.
      dl_nr_arfcn: 392000
      ssb_nr_arfcn: 390530
      bandwidth: 20
      common_scs: 15
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      traffic_duration: 2
      nof_antennas_dl: 2
      nof_antennas_ul: 2
      pdcch_decode_threshold: 0
  gnb:
    config: [cu_cp.yml, du.yml]
    parameters:
      band: 25    # n25 (FDD) is available in the US and the UL carrier is on 1.85-1.915GHz.
      dl_nr_arfcn: 392000
      bandwidth: 20
      common_scs: 15
      nof_antennas_dl: 2
      nof_antennas_ul: 2
  feature_ids: [MVP-FUNC-PHY-16-11]

####################
#### COTS Tests ####
####################

cots_band_3_udp_downlink: &cots_band_3_config
  template: iperf.test_gnb
  parameters:
    protocol: udp
    direction: downlink
    dl_bitrate: 35.0e+6
  request: android_b200
  gnb:
    config: [cu_cp.yml, du.yml]
    parameters:
      gnb_id_bit_length: 22
      cu_cp_report_period: 5000
      slice_sd: ""
      log_level: warning
      band: 3
      dl_nr_arfcn: 368500
      bandwidth: 10
      common_scs: 15
      sample_rate: 11520000
  ue:
    parameters:
      log_level: warning
  core:
    parameters:
      log_level: warning
  feature_ids: [MVP-FUNC-PHY-16-1]
  criteria:
    <<: &cots_criteria
      du.max_late_dl_harqs_le: 0
      du.max_late_ul_harqs_le: 0
      du.nof_error_indications_le: 0
      du.nof_reestablishments_request_eq: 0
      all.errors_le: 0
    du.dl_bitrate_gt: 17.5e+6
    du.ul_bitrate_gt: 0

cots_band_3_udp_uplink:
  <<: *cots_band_3_config
  template: iperf.test_gnb
  parameters:
    protocol: udp
    direction: uplink
    ul_bitrate: 32.0e+6
  criteria:
    <<: *cots_criteria
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 16.0e+6

cots_band_3_udp_bidirectional:
  <<: *cots_band_3_config
  template: iperf.test_gnb
  parameters:
    protocol: udp
    direction: bidirectional
    ul_bitrate: 32.0e+6
  criteria:
    <<: *cots_criteria
    du.dl_bitrate_gt: 16.0e+6
    du.ul_bitrate_gt: 16.0e+6

