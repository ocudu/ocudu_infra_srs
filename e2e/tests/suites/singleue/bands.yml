# Baseline band n30
band_n30: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, udp_singleue.cfg]
    parameters:
      band: 30
      bandwidth: 10
      dl_nr_arfcn: 471000
      ssb_nr_arfcn: 470430
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      traffic_duration: 2
      nof_antennas_dl: 4
      nof_antennas_ul: 4
      common_scs: 15
      pdcch_decode_threshold: 0
  gnb:
    config: [cu_cp.yml, du.yml, srs_periodic_wband.yml, prach_config.yml]
    parameters:
      band: 30
      dl_nr_arfcn: 471000
      bandwidth: 10
      common_scs: 15
      nof_antennas_dl: 4
      nof_antennas_ul: 4
      prach_config_index: 209
      zero_correlation_zone: 0
  core:
    config: [baseline.cfg]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    ue.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    ue.nof_ko_ul_le: 0
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0

# Baseline FR2
band_fr2:
  <<: *base_config
  ue:
    config: [1cell.cfg, udp_singleue.cfg]
    parameters:
      band: 261
      dl_nr_arfcn: 2077915
      ssb_nr_arfcn: 2077435
      common_scs: 120
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      traffic_duration: 2
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, prach_config.yml, mac_pcap.yml]
    parameters:
      band: 261
      dl_nr_arfcn: 2077915
      common_scs: 120
      prach_config_index: 121
      zero_correlation_zone: 1
  feature_ids: [MVP-FUNC-PHY-16-14, MVP-FUNC-TDD-16-3, MVP-FUNC-BW-16-1]

