baseline: &base_config
  template: ue_simulator.test_gnb
  request: s72
  ue:
    config: [1cell.cfg, udp_singleue.cfg]
    parameters:
      traffic_duration: 30
      dl_bitrate: 1400.0e+6
      ul_bitrate: 200.0e+6
      nof_antennas_dl: 4
      nof_antennas_ul: 2
      pdcch_decode_threshold: 0.0
      log_level: warning
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, srs_periodic_wband.yml, du_perf_ul.yml]
    parameters:
      nof_antennas_dl: 4
      nof_antennas_ul: 2
      log_level: warning
  core:
    config: [baseline.cfg]
    parameters:
      log_level: warning
  feature_ids: [MVP-PERF-THR-3a] # MVP-FUNC-MIMO-16-5 once we upgrade it to 4x4
  criteria:
    du.dl_bitrate_gt: 1200.0e+6
    du.ul_bitrate_gt: 180.0e+6
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.dl_avg_ri_ge: 3.5
    du.ul_avg_ri_ge: 1.5
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0
