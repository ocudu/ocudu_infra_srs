# Application level downlink throughput over TCP
# The purpose of this test is to measure the DL throughput a single UE reaches with TCP, where the
# uplink also carries the TCP acknowledgements. It is the TCP counterpart of singleue/udp_dl.

4T2R: &base_config
  template: ue_simulator.test_gnb
  request: s72
  ue:
    config: [1cell.cfg, tcp_singleue.cfg]
    parameters: &ue_params
      traffic_duration: 30
      nof_tcp_connections: 20 # Maximum, 10 were congestion window limited at ~32 kB each
      nof_antennas_dl: 4
      nof_antennas_ul: 2
      pdcch_decode_threshold: 0.0
      log_level: warning
      direction: "tx"
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, srs_periodic_wband.yml, du_perf_ul.yml, drb_triggered_ul_grant_qos.yml, schedtrace.yml]
    parameters: &gnb_params
      nof_antennas_dl: 4
      nof_antennas_ul: 2
      log_level: warning
  core:
    config: [baseline.cfg]
    parameters:
      log_level: warning
  feature_ids: [MVP-PERF-THR-2b]
  criteria: &base_criteria
    du.dl_bitrate_gt: 4.0e+6
    du.ul_bitrate_gt: 170.0e+6
    du.dl_avg_ri_ge: 1
    du.ul_avg_ri_ge: 1.5
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    du.nof_ues_at_stop_eq: 0
    all.errors_le: 0
    all.warnings_le: 0

4T4R:
  <<: *base_config
  markers: [xfail]
  ue:
    config: [1cell.cfg, tcp_singleue.cfg]
    parameters:
      <<: *ue_params
      nof_antennas_ul: 4
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, srs_periodic_wband.yml, du_perf_ul.yml, drb_triggered_ul_grant_qos.yml, schedtrace.yml]
    parameters:
      <<: *gnb_params
      nof_antennas_ul: 4
  feature_ids: []
  criteria:
    <<: *base_criteria
    du.ul_avg_ri_ge: 3.5
