##########################
#### Functional Tests ####
##########################

# Two-step (MsgA/MsgB) Random Access test
two_step_rach:
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, udp_singleue.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      traffic_duration: 2
  gnb:
    config: [cu_cp.yml, du.yml, tdd_63.yml, two_step_rach.yml, mac_pcap.yml]
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-RACH-16-2, skip]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_request_eq: 0
    du.total_prach_preambles_eq: 1
    du.two_step_prachs_detected_eq: 1
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0
