# Downlink coverage throughput
# TIFG E2E test v10.0, TC 6.7

# The purpose of the test is to measure the downlink user data throughput (i.e., data transmitted from application (traffic) server to
# UE) when radio conditions of UE change gradually. Test is verified by moving UE from center to edge of the isolated cell on
# the main lobe of SUT’s antenna until UE loses the coverage (call drop). Test assesses link adaptation and effect on scheduling,
# CQI, MCS, Number of layers (MIMO Rank) assignment etc. during the movement of UE from excellent radio conditions to poor
# radio conditions.

# TDD MIMO 4x4 coverage test
coverage_dl: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1500.0e+6
      ul_bitrate: 0
      nof_antennas_dl: 4
      nof_antennas_ul: 1
      test_duration: 20
      traffic_duration: 4000
      max_distance: 350
      pdcch_decode_threshold: 0
      ul_power_attenuation: -10
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, olla.yml]
    parameters:
      nof_antennas_dl: 4
      nof_antennas_ul: 1
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-PERF-THR-4a, MVP-PERF-THR-4b, MVP-PERF-THR-4c]
  criteria:
    du.dl_bitrate_gt: 250.0e+6
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1

# Uplink coverage throughput
# TIFG E2E test v10.0, TC 6.8

# The purpose of the test is to measure the uplink user data throughput (i.e., data transmitted from UE to application (traffic) server)
# when radio conditions of UE change gradually. Test is verified by moving UE from center to edge of the isolated cell on the
# main lobe of SUT’s antenna until UE loses the coverage (call drop). Test assesses link adaptation and effect on scheduling,
# uplink transmit power (power control), CQI, MCS, etc. during the movement of UE from excellent radio conditions to poor radio
# conditions.
coverage_ul:
  <<: *base_config
  ue:
    config: [1cell_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 0
      ul_bitrate: 300.0e+6
      nof_antennas_dl: 4
      nof_antennas_ul: 2
      test_duration: 20
      max_distance: 350
      pdcch_decode_threshold: 0
      ul_power_attenuation: -10
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, srs_periodic_wband.yml, olla.yml]
    parameters:
      nof_antennas_dl: 4
      nof_antennas_ul: 2
  feature_ids: [MVP-PERF-THR-5a, MVP-PERF-THR-5b, MVP-PERF-THR-5c]
  criteria:
    du.ul_bitrate_gt: 30.0e+6
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0

# Same as coverage_ul but with power control
coverage_ul_pc:
  <<: *base_config
  ue:
    config: [1cell_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 0
      ul_bitrate: 300.0e+6
      nof_antennas_dl: 4
      nof_antennas_ul: 2
      test_duration: 20
      max_distance: 350
      pdcch_decode_threshold: 0
      ul_power_attenuation: -10
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, srs_periodic_wband.yml, olla.yml, closed_loop_pc.yml]
    parameters:
      nof_antennas_dl: 4
      nof_antennas_ul: 2
  feature_ids: [MVP-PERF-THR-5a, MVP-PERF-THR-5b, MVP-PERF-THR-5c]
  criteria:
    du.ul_bitrate_gt: 30.0e+6
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
