##########################
#### Functional Tests ####
##########################

# Paging test, RRC IDLE MT
baseline: &baseline
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, paging.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      nof_paging: 1
  gnb:
    config: &baseline_gnb_config [cu_cp.yml, du.yml, tdd_default.yml, inactivity_timer.yml, mac_pcap.yml]
    parameters:
      time_multiplier: &time_multiplier 10
  core:
    config: &core_config [baseline.cfg]
    parameters:
      time_multiplier: *time_multiplier
  feature_ids: [MVP-FUNC-BAS-16-1, MVP-FUNC-MOB-11]
  criteria:
    <<: &base_criteria
      all.errors_le: 0
      all.warnings_le: 0
      du.dl_bitrate_gt: 0
      du.ul_bitrate_gt: 0
      du.nof_ko_dl_le: 0
      ue.nof_ko_dl_le: 0
      du.nof_ko_ul_le: 0
      ue.nof_ko_ul_le: 0
      du.nof_reestablishments_request_eq: 0
      core.nof_pdu_session_establishment_accept_eq: 1
      du.nof_error_indications_le: 0
    core.nof_ng_paging_eq: 1
    du.nof_paging_eq: 2 # 1 suspend/resume x 2 PCCH Paging messages
    core.nof_nas_service_accept_eq: 1

# DRX test
drx: &drx
  <<: *baseline
  gnb:
    config: &drx_gnb_config [cu_cp.yml, du.yml, tdd_default.yml, drx.yml, mac_pcap.yml, inactivity_timer.yml]
    parameters:
      time_multiplier: *time_multiplier
  feature_ids: [MVP-FUNC-BAS-16-1, MVP-FUNC-SVCS-16-6]
  criteria:
    <<: *base_criteria
    core.nof_ng_paging_eq: 1
    du.nof_paging_eq: 2  # 1 suspend/resume x 2 PCCH Paging messages
    du.drx_long_cycle_eq: 7 # this is the coded value that corresponds to 80 ms
    core.nof_nas_service_accept_eq: 1

# eDRX test
edrx: &edrx
  <<: *baseline
  gnb:
    config: &edrx_gnb_config [cu_cp.yml, du.yml, tdd_default.yml, edrx.yml, mac_pcap.yml, inactivity_timer.yml]
    parameters:
      time_multiplier: *time_multiplier
  feature_ids: [MVP-FUNC-BAS-16-1, MVP-FUNC-MOB-11, DU-GEN-10]
  criteria:
    <<: *base_criteria
    core.nof_ng_paging_eq: 1
    du.nof_paging_eq: 2  # 1 suspend/resume x 2 PCCH Paging messages
    core.nof_nas_service_accept_eq: 1

# RRC IDLE - MT multi
rrc_idle_mt_multi: &rrc_idle_mt_multi
  <<: *baseline
  ue: &multi_paging_ue_config
    config: [1cell.cfg, paging.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      nof_paging: 3
  criteria:
    <<: *base_criteria
    core.nof_ng_paging_eq: 3
    du.nof_paging_eq: 6  # 1 suspend/resume x 2 PCCH Paging messages
    core.nof_nas_service_accept_eq: 3


# RRC IDLE - MO reconnection
rrc_idle_mo: &rrc_idle_mo
  <<: *baseline
  ue: &mo_initiate_ue_config
    config: [1cell.cfg, mo_initiate.cfg]
    parameters:
      ul_bitrate: 10.0e+3
  feature_ids: [MVP-FUNC-MOB-11]
  criteria:
    <<: *base_criteria
    core.nof_ng_paging_eq: 0
    du.nof_paging_eq: 0
    core.nof_nas_service_accept_eq: 1

# RRC Inactive - MT
rrc_inactive_mt: &rrc_inactive_mt
  <<: *baseline
  ue:
    config: [1cell.cfg, paging.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      nof_paging: 1
  gnb:
    config: &rrc_inactive_gnb_config [cu_cp.yml, du.yml, tdd_default.yml, rrc_inactive.yml, mac_pcap.yml]
    parameters:
      time_multiplier: *time_multiplier
  feature_ids: [MVP-FUNC-BAS-16-1, MVP-FUNC-MOB-10]
  criteria:
    <<: *base_criteria
    core.nof_ng_paging_eq: 0 # RRC_INACTIVE keeps N2 up
    du.nof_rrc_suspend_eq: 1
    du.nof_paging_eq: 2 # 1 suspend/resume x 2 PCCH Paging messages
    du.nof_rrc_resume_complete_eq: 1

# RRC Inactive - MT multiple suspend/resume cycles
rrc_inactive_mt_multi: &rrc_inactive_mt_multi
  <<: *baseline
  ue: *multi_paging_ue_config
  gnb:
    config: *rrc_inactive_gnb_config
    parameters:
      time_multiplier: *time_multiplier
  feature_ids: [MVP-FUNC-BAS-16-1, MVP-FUNC-MOB-10]
  criteria:
    <<: *base_criteria
    core.nof_ng_paging_eq: 0 # RRC_INACTIVE keeps N2 up
    du.nof_rrc_suspend_eq: 3
    du.nof_paging_eq: 6 # 3 suspend/resume cycles x 2 PCCH Paging messages
    du.nof_rrc_resume_complete_eq: 3

# RRC Inactive - MO-data-triggered resume (no paging)
rrc_inactive_mo: &rrc_inactive_mo
  <<: *baseline
  ue: *mo_initiate_ue_config
  gnb:
    config: *rrc_inactive_gnb_config
    parameters:
      time_multiplier: *time_multiplier
  feature_ids: [MVP-FUNC-MOB-10]
  criteria:
    <<: *base_criteria
    core.nof_ng_paging_eq: 0 # RRC_INACTIVE keeps N2 up
    du.nof_rrc_suspend_eq: 1
    du.nof_paging_eq: 0
    du.nof_rrc_resume_complete_eq: 1

