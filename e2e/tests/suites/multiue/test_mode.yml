# The gNB creates the test UEs itself, so there is no UE (or simulator) and traffic is generated by the DU.

##########################
#### Functional Tests ####
##########################

siso_ri1: &base_config
  template: test_mode.test_gnb
  request: test_mode_ue
  parameters:
    duration: 300
  gnb:
    config: &gnb_config [cu_cp.yml, du.yml, tdd_72.yml, 2ue.yml, test_mode.yml]
    parameters: &gnb_parameters
      band: 78
      bandwidth: 20
      common_scs: 30
      dl_nr_arfcn: 625000
      min_k1_k2: 2
      slice_sd: ""
      cu_cp_report_period: 5000
      log_level: warning
      nof_antennas_dl: 1
      nof_antennas_ul: 1
      test_ue_ri: 1
  criteria:
    <<: &base_criteria
      du.dl_bitrate_gt: 60.0e+6
      du.ul_bitrate_gt: 10.0e+6
      du.nof_ko_dl_le: 0
      du.nof_ko_ul_le: 0
      du.dl_avg_ri_ge: 0.5
      du.ul_avg_ri_ge: 0.5
      du.nof_conres_issues_eq: 0
      du.nof_error_indications_le: 0
      du.dl_max_mcs_ge: 27
      du.ul_max_mcs_ge: 27
      all.errors_le: 0
      all.warnings_le: 0

mimo_2x2_ri1:
  <<: *base_config
  gnb:
    config: *gnb_config
    parameters:
      <<: *gnb_parameters
      nof_antennas_dl: 2
      nof_antennas_ul: 2
      test_ue_ri: 1

mimo_2x2_ri2:
  <<: *base_config
  gnb:
    config: *gnb_config
    parameters:
      <<: *gnb_parameters
      nof_antennas_dl: 2
      nof_antennas_ul: 2
      test_ue_ri: 2
  criteria:
    <<: *base_criteria
    du.dl_bitrate_gt: 120.0e+6
    du.dl_avg_ri_ge: 1.5

mimo_4x4_ri1:
  <<: *base_config
  gnb:
    config: *gnb_config
    parameters:
      <<: *gnb_parameters
      nof_antennas_dl: 4
      nof_antennas_ul: 4
      test_ue_ri: 1

mimo_4x4_ri2:
  <<: *base_config
  gnb:
    config: *gnb_config
    parameters:
      <<: *gnb_parameters
      nof_antennas_dl: 4
      nof_antennas_ul: 4
      test_ue_ri: 2
  criteria:
    <<: *base_criteria
    du.dl_bitrate_gt: 120.0e+6
    du.dl_avg_ri_ge: 1.5

mimo_4x4_ri3:
  <<: *base_config
  gnb:
    config: *gnb_config
    parameters:
      <<: *gnb_parameters
      nof_antennas_dl: 4
      nof_antennas_ul: 4
      test_ue_ri: 3
  criteria:
    <<: *base_criteria
    du.dl_bitrate_gt: 150.0e+6
