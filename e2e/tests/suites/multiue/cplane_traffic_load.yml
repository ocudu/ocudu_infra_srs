# TDD 7D1S2U, k1=k2=4, Long PRACH, 100 MHz 4T1R
# 1000 UEs total (800 static + 200 cycling), 50 UE/s attach rate per group
tdd_dl_heavy_rt:
  <<: *base_config
  request: s72_1000
  ue:
    config: [1cell_chsim.cfg, cplane_traffic_load.cfg]
    parameters:
      nof_ue_static: *nof_ue_static
      nof_ue_cycling: *nof_ue_cycling
      dl_bitrate: 4.0e+5
      ul_bitrate: 4.0e+4
      traffic_duration: 100
      cycle_traffic_duration: 4
      cycle_off_duration: 6
      power_on_stagger_delay: 0.02 # 50 UE/s per group
      pdcch_decode_threshold: 0
      nof_antennas_dl: 4
      nof_antennas_ul: 1
      log_level: warning
  gnb:
    config: [cu_cp.yml, vonr_qos.yml, du.yml, 1000ue.yml, tdd_72.yml, prach_config.yml, inactivity_timer.yml, du_perf.yml]
    parameters:
      <<: *common_gnb_params
      prach_config_index: 7
      zero_correlation_zone: 1
      nof_antennas_dl: 4
      nof_antennas_ul: 1
      log_level: warning
  core:
    config: [baseline.cfg]
    parameters:
      log_level: warning
  feature_ids: [MVP-PERF-ACC-2, MVP-PERF-RET-1]
  criteria:
    <<: *common_criteria
    core.nof_pdu_session_establishment_accept_eq: *nof_ue_attaches
    du.nof_ko_dl_le: 500
    all.warnings_le: 200
    du.dl_bitrate_gt: 250.0e+6
    du.ul_bitrate_gt: 25.0e+6
