# Multiple UEs doing random Handovers
inter_ru_ho: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [2cell_intrafreq_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      ul_bitrate: 10.0e+3
      nof_ue: &nof_ue 10
      num_cells: 2
  gnb:
    config: [cu_cp.yml, du.yml, 2cell_intrafreq.yml, mobility.yml, tdd_default.yml, 1000ue.yml]
    parameters:
      num_cells: 2
  core:
    config: [baseline.cfg]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: .inf
    du.nof_ko_ul_le: .inf
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0

# Multiple UEs doing Reestablishments
inter_ru_cfra_ho:
  <<: *base_config
  gnb:
    config: [cu_cp.yml, du.yml, 2cell_intrafreq.yml, mobility.yml, cfra_ho.yml, tdd_default.yml, 1000ue.yml]
    parameters:
      num_cells: 2
  feature_ids: [DU-GEN-2-b]

# Handover stability
inter_du_ho:
  template: ue_simulator.test_cu_2du
  request: zmq_1cu2du
  core:
    config: [baseline.cfg]
  ue:
    config: [2cell_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      traffic_duration: 100
      nof_ue: *nof_ue
      num_cells: 2
  cu:
    config: [cu_cp.yml, mobility.yml]
  du:
    items:
      - config: [du.yml, tdd_default.yml, 1000ue.yml]
        parameters:
          gnb_du_id: 0
          pci: 1
          sector_id: 0
      - config: [du.yml, tdd_default.yml, 1000ue.yml]
        parameters:
          gnb_du_id: 1
          pci: 2
          sector_id: 1
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: .inf
    du.nof_ko_ul_le: .inf
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    du.nof_handovers_ge: 200 # calculated based on the duration
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0

# Handover stability
inter_cu_ho:
  template: ue_simulator.test_2gnb
  request: zmq_2gnb
  core:
    config: [baseline.cfg]
    parameters:
      log_level: "debug"
  ue:
    config: [2cell_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      traffic_duration: 100
      nof_ue: *nof_ue
      num_cells: 2
  gnb:
    items:
      - config: [cu_cp.yml, inter_cu_mobility_1.yml, du.yml, tdd_default.yml, sib2345.yml]
        parameters:
          gnb_id: 411
          ran_node_name: "ocudu01"
          pci: 1
          cell_offset: 0
      - config: [cu_cp.yml, inter_cu_mobility_2.yml, du.yml, tdd_default.yml, sib2345.yml]
        parameters:
          gnb_id: 412
          ran_node_name: "ocudu02"
          pci: 2
          cell_offset: 1
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: .inf
    du.nof_ko_ul_le: .inf
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    ue.nof_handovers_ge: 200 # calculated based on the duration
    du.nof_error_indications_le: 0
    du.errors_le: 0
    du.warnings_le: 0

# Multiple UEs doing Reestablishments
reestablishment:
  <<: *base_config
  ue:
    config: [1cell_chsim.cfg, reestablishment.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      ul_bitrate: 10.0e+3
      nof_ue: *nof_ue
      nof_reestablishments: 5
      num_cells: 1
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, 1000ue.yml]
    parameters:
      num_cells: 1
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_reestablishments_request_eq: 50 # nof_ue * nof_reestablishments
    du.nof_reestablishments_complete_eq: 50 # nof_ue * nof_reestablishments
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0
