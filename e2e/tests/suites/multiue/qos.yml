# GBR bearer, QoS Scheduler 2UEs different 5QI
baseline:
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell_chsim.cfg, 2ues_qos_gbr_ngbr.cfg]
    parameters:
      non_gbr_bitrate: 50.0e+6
      dl_nr_arfcn: 368500
      ssb_nr_arfcn: 367930
      band: 3
      bandwidth: 10
      common_scs: 15
      traffic_duration: 20
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, vonr_qos.yml]
    parameters:
      dl_nr_arfcn: 368500
      bandwidth: 10
      band: 3
      common_scs: 15
      time_multiplier: 2
  core:
    config: [baseline.cfg]
    parameters:
      time_multiplier: 2
  feature_ids: [MVP-FUNC-SVCS-16-8-b, MVP-FUNC-SVCS-16-8-c, DU-QOS-1]
  criteria:
    du.dl_bitrate_gt: 39.0e+6
    du.ul_bitrate_gt: 39.0e+6
    du.dl_ue_mid10_bitrate:
      - id: 1
        value: 38.0e+6
      - id: 2
        value: 1.0e+6
    du.ul_ue_mid10_bitrate:
      - id: 1
        value: 38.0e+6
      - id: 2
        value: 1.0e+6
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_request_eq: 0
    du.nof_error_indications_le: 0
    core.nof_pdu_session_establishment_accept_eq: 2
    core.nof_pdu_session_modification_complete_ge: 1
    cu_cp.nof_rohc_profile_1_configured_eq: 0
    cu_cp.nof_rohc_profile_2_configured_ge: 1
    cu_cp.nof_5qi_1_drb_configured_eq: 0
    cu_cp.nof_5qi_2_drb_configured_ge: 1
    all.errors_le: 0
    all.warnings_le: 3
