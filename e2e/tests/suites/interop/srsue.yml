# Interoperability with srsUE: an independent UE implementation attaching to the gNB and passing
# traffic, so the cell is the simplest one that both ends support rather than a tuned one

udp_downlink: &base_config
  template: iperf.test_gnb
  request: interop_srsue
  parameters:
    protocol: udp
    direction: downlink
    dl_bitrate: 15.0e+6
  gnb:
    config: &gnb_config [cu_cp.yml, du.yml, common_search_space.yml, prach_config.yml]
    parameters: &gnb_parameters
      gnb_id_bit_length: 22
      cu_cp_report_period: 5000
      slice_sd: ""
      log_level: info
      band: 3
      dl_nr_arfcn: 368500
      bandwidth: 10
      common_scs: 15
      sample_rate: 11520000
      prach_config_index: 1
      mcs_table: qam64
  ue:
    parameters:
      band: 3
      sample_rate: 11520000
      log_level: info
  core:
    parameters:
      log_level: info
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_error_indications_le: 0
    du.nof_reestablishments_request_eq: 0
    all.warnings_le: 0
    all.errors_le: 0

udp_uplink:
  <<: *base_config
  parameters:
    protocol: udp
    direction: uplink
    ul_bitrate: 15.0e+6

udp_bidirectional:
  <<: *base_config
  parameters:
    protocol: udp
    direction: bidirectional
    ul_bitrate: 15.0e+6

tcp_downlink:
  <<: *base_config
  parameters:
    protocol: tcp
    direction: downlink
    dl_bitrate: 15.0e+6

tcp_uplink:
  <<: *base_config
  parameters:
    protocol: tcp
    direction: uplink
    ul_bitrate: 15.0e+6

tcp_bidirectional:
  <<: *base_config
  parameters:
    protocol: tcp
    direction: bidirectional
    ul_bitrate: 15.0e+6
