baseline:
  template: ue_simulator.test_gnb
  testbed: zmq_1000
  ue:
    config: [1cell_1t1r_bw100_band78.cfg.jinja, multiue_udp_bi.cfg.jinja]
    parameters:
      nof_sim_ues: 512
      traffic_type: "udp_bi"
      staggered_traffic_start: false
      brate_dl: 800000
      brate_ul: 350000
      traffic_duration_sec: 180
      log_com_level: "debug"
      log_prod_level: "debug"
      pdcch_decode_opt_threshold: 0.7
  gnb:
    config: [1t1r_bw100_band78.yml, base_slice.yml, pcaps.yml, 512ue.yml]
    parameters:
      log_level: warning
  core:
    config: [baseline.cfg]
  criteria:
    dl_bitrate: 10.0e+6
    ul_bitrate: 10.0e+6
    nof_ko_dl: 0
    nof_ko_ul: 0
    nof_reestablishments_eq: 0
    nof_handovers_eq: 0
    max_late_dl_harqs: 0
    max_late_ul_harqs: 0
    nof_error_indications: 0
    errors: 0
    warnings: 3
