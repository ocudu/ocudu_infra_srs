baseline: &base_config
  template: ue_simulator.test_gnb
  request: zmq_1000
  ue:
    config: [1cell_chsim.cfg, multiue_udp_bi.cfg.jinja]
    parameters:
      nof_sim_ues: 512
      traffic_type: "udp_bi"
      staggered_traffic_start: false
      brate_dl: 800000
      brate_ul: 350000
      traffic_duration_sec: 180
      log_level: "error"
  gnb:
    config: [cell_cfg.yml, 512ue.yml, tdd_default.yml]
    parameters:
      log_level: warning
  core:
    config: [baseline.cfg]
  criteria:
    dl_bitrate: 10.0e+6
    ul_bitrate: 10.0e+6
    nof_ko_dl: 0
    nof_ko_ul: 0
    nof_reestablishments_eq: 0
    nof_handovers_eq: 0
    max_late_dl_harqs: 0
    max_late_ul_harqs: 0
    nof_error_indications: 0
    errors: 0
    warnings: 3

tdd_dl_heavy:
  <<: *base_config
  gnb:
    config: [cell_cfg.yml, 512ue.yml, tdd_63.yml]
    parameters:
      log_level: warning

tdd_ul_heavy:
  <<: *base_config
  gnb:
    config: [cell_cfg.yml, 512ue.yml, tdd_27.yml]
    parameters:
      log_level: warning
