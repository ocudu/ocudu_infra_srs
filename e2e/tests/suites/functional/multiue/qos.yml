# GBR bearer, QoS Scheduler 2UEs different 5QI
baseline: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, 2ues_qos_gbr_ngbr.cfg]
    parameters:
      nof_ue: 2
      non_gbr_bitrate: 50.0e+6
      gbr_bitrate: 1.0e+6
      dl_nr_arfcn: 368500
      ssb_nr_arfcn: 367930
      common_scs: 15
      band: 3
      bandwidth: 10
      test_duration: 20
  gnb:
    config: [cu.yml, du.yml, tdd_default.yml, vonr_qos.yml]
    parameters:
      log_level: warning
      parameters:
      cfg_earfcn: 368500
      cfg_bandwidth: 10
      cfg_band: 3
      cfg_common_scs: 15
      time_multiplier: 2
  core:
    config: [baseline.cfg]
    parameters:
      time_multiplier: 2
  feature_ids: [MVP-FUNC-SVCS-16-8-b, MVP-FUNC-SVCS-16-8-c, DU-QOS-1]
  criteria:
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    core.nof_pdu_session_establishment_accept_eq: 2
    core.nof_pdu_session_resource_modify_request_eq: 1
    du.nof_reestablishments_eq: 0
    du.max_late_dl_harqs_le: 0
    du.max_late_ul_harqs_le: 0
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 3
    du.dl_bitrate_gt: 40.0e+6
    du.ul_bitrate_gt: 40.0e+6
    du.dl_ue_avg_bitrate:
      - id: 1
        value: 38.0e+6
      - id: 2
        value: 1.0e+6
    du.ul_ue_avg_bitrate:
      - id: 1
        value: 38.0e+6
      - id: 2
        value: 1.0e+6
