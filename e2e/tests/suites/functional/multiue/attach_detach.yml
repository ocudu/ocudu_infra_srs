# Attach/dettach stability, management of fallback scheduler, correct addition and removal of UEs
baseline: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell_chsim.cfg, attach_cycle.cfg]
    parameters:
      nof_ue: 10
      nof_cycles: 5
  gnb:
    config: [cu_cp.yml, du.yml, 512ue.yml, tdd_default.yml]
  core:
    config: [baseline.cfg]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 50 # nof_ue * nof_cycles
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0

# Attach/dettach stability, management of fallback scheduler, correct addition and removal of UEs
dl_heavy_tdd:
  <<: *base_config
  gnb:
    config: [cu_cp.yml, du.yml, 512ue.yml, tdd_72.yml]

# Attach/dettach stability, management of fallback scheduler, correct addition and removal of UEs
ul_heavy_tdd:
  <<: *base_config
  gnb:
    config: [cu_cp.yml, du.yml, 512ue.yml, tdd_27.yml]
