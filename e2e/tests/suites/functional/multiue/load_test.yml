# 512 UEs baseline
baseline: &base_config
  template: ue_simulator.test_gnb
  request: zmq_1000
  ue:
    config: [1cell_chsim.cfg, udp_bi_chsim.cfg]
    parameters:
      nof_ue: &nof_ue 512
      staggered_traffic_start: false
      dl_bitrate: 800000
      ul_bitrate: 150000
      test_duration: 180
      log_level: "error"
      pdcch_decode_threshold: 0.5
  gnb:
    config: [cu_cp.yml, du.yml, 512ue.yml, tdd_default.yml]
    parameters:
      log_level: warning
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-TDD-16-2]
  criteria:
    du.dl_bitrate_gt: 20.0e+6
    du.ul_bitrate_gt: 10.0e+6
    du.nof_ko_dl_le: 50
    du.nof_ko_ul_le: 50
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    du.nof_handovers_eq: 0
    du.max_late_dl_harqs_le: 0
    du.max_late_ul_harqs_le: 0
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 3

