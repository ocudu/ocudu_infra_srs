baseline:
  template: ue_simulator.test_gnb
  request: zmq_1000
  ue:
    config: [1cell_chsim.cfg, multiue_ping.cfg.jinja]
    parameters:
      nof_sim_ues: &nof_ue 512
      traffic_duration_sec: 180
      staggered_traffic_start: false
      log_com_level: "debug"
      log_prod_level: "debug"
      pdcch_decode_opt_threshold: 0.7
  gnb:
    config: [cell_cfg.yml, 512ue.yml, tdd_default.yml]
    parameters:
      log_level: warning
  core:
    config: [baseline.cfg]
  criteria:
    dl_bitrate: 10.0e+3
    ul_bitrate: 10.0e+3
    nof_ko_dl: 0
    nof_ko_ul: 0
    nof_pdu_session_establishment_accept_eq: *nof_ue
    nof_reestablishments_eq: 0
    nof_handovers_eq: 0
    max_late_dl_harqs: 0
    max_late_ul_harqs: 0
    nof_error_indications: 0
    errors: 0
    warnings: 3
