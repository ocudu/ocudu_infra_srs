baseline:
  template: ue_simulator.test_gnb
  request: zmq_1000
  ue:
    config: [1cell_chsim.cfg, multiue_ping.cfg.jinja]
    parameters:
      nof_sim_ues: &nof_ue 512
      traffic_duration_sec: 180
      staggered_traffic_start: false
      log_com_level: "debug"
      log_prod_level: "debug"
      pdcch_decode_opt_threshold: 0.7
  gnb:
    config: [cu_cp.yml, du.yml, 512ue.yml, tdd_default.yml]
    parameters:
      log_level: warning
  core:
    config: [baseline.cfg]
  criteria:
    du.dl_bitrate_gt: 10.0e+3
    du.ul_bitrate_gt: 10.0e+3
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 5 # allow some UL KOs in this TDD pattern
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    du.nof_reestablishments_eq: 0
    du.nof_handovers_eq: 0
    du.max_late_dl_harqs_le: 0
    du.max_late_ul_harqs_le: 0
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 3
