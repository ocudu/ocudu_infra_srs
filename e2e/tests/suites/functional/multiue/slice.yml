# Slicing resource sharing and partitioning
dedicated_prb: &base_config
  template: ue_simulator.test_gnb
  feature_ids: [MVP-FUNC-SVCS-17-3-c, MVP-FUNC-SVCS-17-3-e]
  # tc2.7	rc1
  request: zmq_mme
  ue:
    config: [1cell.cfg, 2ues_slicing.cfg]
    parameters:
      nof_ue: 2
      dl_bitrate: 60.0e+6
      ul_bitrate_sst1: 10.0e+6
      ul_bitrate_sst2: 3.0e+6
      ssb_nr_arfcn: 626304
      bandwidth: 20
      test_duration: 15
  gnb:
    config: [du.yml, tdd_default.yml, slicing_dedicated.yml, dual_slice.yml]
    parameters:
      cfg_bandwidth: 20
  core:
    config: [baseline.cfg]
  criteria:
    du.pdsch_prbs_mid10_per_tdd_slot_mean: 30
    du.pusch_prbs_mid10_per_tdd_slot_mean: 5
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    core.nof_pdu_session_establishment_accept_eq: 2
    du.nof_reestablishments_eq: 0
    du.max_late_dl_harqs_le: 0
    du.max_late_ul_harqs_le: 0
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 3
    du.dl_ue_mid10_bitrate:
      - id: 1
        value: 41.5e+6
      - id: 2
        value: 13.5e+6
    du.ul_ue_mid10_bitrate:
      - id: 1
        value: 8.0e+6
      - id: 2
        value: 2.6e+6

# Slicing resource sharing and partitioning
reserved_prb:
  <<: *base_config
  feature_ids: [MVP-FUNC-SVCS-17-3-c, MVP-FUNC-SVCS-17-3-e]
  gnb:
    config: [du.yml, tdd_default.yml, slicing_reserved.yml, dual_slice.yml]
    parameters:
      cfg_bandwidth: 20
  criteria:
    du.pdsch_prbs_mid10_per_tdd_slot_mean: 25
    du.pusch_prbs_mid10_per_tdd_slot_mean: 5
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    core.nof_pdu_session_establishment_accept_eq: 2
    du.nof_reestablishments_eq: 0
    du.max_late_dl_harqs_le: 0
    du.max_late_ul_harqs_le: 0
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 3
    du.dl_ue_mid10_bitrate:
      - id: 1
        value: 34.0e+6
      - id: 2
        value: 11.0e+6
    du.ul_ue_mid10_bitrate:
      - id: 1
        value: 8.0e+6
      - id: 2
        value: 2.6e+6
