# Multiple UEs doing random Handovers
inter_ru_ho: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [2cell_intrafreq_chsim.cfg, handover_random.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      ul_bitrate: 10.0e+3
      nof_ue: &nof_ue 10
  gnb:
    config: [cu_cp_log.yml, amf.yml, cell_cfg.yml, 2cell_intrafreq.yml, mobility.yml, tdd_default.yml, 512ue.yml]
  core:
    config: [baseline.cfg]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 500 # allow some KOs due to potential PRACH contention
    du.nof_ko_ul_le: 500 # allow some KOs during HO transition
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0

# Multiple UEs doing Reestablishments
inter_ru_cfra_ho:
  <<: *base_config
  gnb:
    config: [cu_cp_log.yml, amf.yml, cell_cfg.yml, 2cell_intrafreq.yml, mobility.yml, cfra_ho.yml, tdd_default.yml, 512ue.yml]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0 # do not allow KOs since there is no contention
    du.nof_ko_ul_le: 500 # allow some KOs during HO transition
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0


# tid1.3.4: Handover stability
inter_du_ho:
  template: ue_simulator.test_cu_2du
  request: zmq_1cu2du
  core:
    config: [baseline.cfg]
  ue:
    config: [2cell_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      test_duration: 100
      nof_ue: *nof_ue
      num_cells: 2
      nof_antennas_dl: 1
      nof_antennas_ul: 1
  cu:
    config: [cu_cp_log.yml, amf.yml, mobility.yml]
  du:
    items:
      - config: [cell_cfg.yml, tdd_default.yml, 512ue.yml]
        parameters:
          gnb_du_id_cfg: 0
          pci_cfg: 1
          sector_id_cfg: 0
          nof_antennas_dl: 1
          nof_antennas_ul: 1
      - config: [cell_cfg.yml, tdd_default.yml, 512ue.yml]
        parameters:
          gnb_du_id_cfg: 1
          pci_cfg: 2
          sector_id_cfg: 1
          nof_antennas_dl: 1
          nof_antennas_ul: 1
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 500 # allow some KOs due to potential PRACH contention
    du.nof_ko_ul_le: 500 # allow some KOs during HO transition
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    du.nof_handovers_ge: 200 # calculated based on the test_duration
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0

# Handover stability
inter_cu_ho:
  template: ue_simulator.test_2gnb
  request: zmq_2gnb
  core:
    config: [baseline.cfg]
    parameters:
      log_level: "debug"
  ue:
    config: [2cell_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      test_duration: 100
      nof_ue: *nof_ue
      num_cells: 2
      nof_antennas_dl: 1
      nof_antennas_ul: 1
  gnb:
    items:
      - config: [cu_cp_log.yml, amf.yml, gnb_base.yml, inter_cu_mobility_1.yml, cell_cfg.yml, tdd_default.yml, sib2345.yml]
        parameters:
          gnb_id: 411
          ran_node_name_cfg: "ocudu01"
          pci_cfg: 1
          nof_antennas_dl: 1
          nof_antennas_ul: 1
          cell_offset: 0
      - config: [cu_cp_log.yml, amf.yml, gnb_base.yml, inter_cu_mobility_2.yml, cell_cfg.yml, tdd_default.yml, sib2345.yml]
        parameters:
          gnb_id: 412
          ran_node_name_cfg: "ocudu02"
          pci_cfg: 2
          nof_antennas_dl: 1
          nof_antennas_ul: 1
          cell_offset: 1
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 500 # allow some KOs due to potential PRACH contention
    du.nof_ko_ul_le: 500 # allow some KOs during HO transition
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    ue.nof_handovers_ge: 200 # calculated based on the test_duration
    du.nof_error_indications_le: 0
    du.errors_le: 0
    du.warnings_le: 0

# Multiple UEs doing Reestablishments
reestablishment:
  <<: *base_config
  ue:
    config: [1cell_chsim.cfg, reestablishment.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      ul_bitrate: 10.0e+3
      nof_ue: *nof_ue
  gnb:
    config: [cu_cp_log.yml, amf.yml, cell_cfg.yml, tdd_default.yml, 512ue.yml]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_reestablishments_ge: 50
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0
