baseline:
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell_chsim.cfg, ping.cfg]
    parameters:
      traffic_duration: 10
      log_com_level: "debug"
      log_prod_level: "debug"
      pdcch_decode_opt_threshold: 0.7
  gnb:
    config: [cu_cp.yml, security.yml, du.yml, tdd_default.yml]
    parameters:
      log_level: warning
  core:
    config: [baseline.cfg]
    parameters:
      integrity_protection: "required"
      confidentiality_protection: "required"
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_reestablishments_request_eq: 0
    du.nof_handovers_eq: 0
    du.max_late_dl_harqs_le: 0
    du.max_late_ul_harqs_le: 0
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 3
  feature_ids: [MVP-SEC-O-CU-12, MVP-SEC-O-CU-13]
