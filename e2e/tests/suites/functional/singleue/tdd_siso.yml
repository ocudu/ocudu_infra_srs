# Baseline gNB configuration test. Test basic functionality,: TDD DDDSU, PRACH format B4, periodic SRS, periodic CSI-RS, SIB1-5 and SIB8, SSB and CSI-RS based link monitoring, RAN slicing
baseline_gnb: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, udp_bi.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      test_duration: 6
  gnb:
    config: [cu.yml, du.yml, tdd_default.yml, sib12.yml, rlm_ssb_csi.yml, mac_pcap.yml]
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-ARCH-INTF-4, MVP-FUNC-ARCH-16-1, MVP-FUNC-PHY-16-3, MVP-FUNC-PHY-16-13, MVP-FUNC-PHY-16-15, MVP-FUNC-BAS-16-2, MVP-FUNC-TDD-16-1, MVP-FUNC-TDD-16-2, MVP-FUNC-RLM-16-1, MVP-FUNC-RACH-16-1, MVP-FUNC-MOB-9, MVP-FUNC-RLM-16-1, MVP-ARCH-GEN-1, MVP-ARCH-GEN-2, DU-GEN-1, DU-PHY-2, DU-GEN-5, DU-PHY-5, DU-PHY-6, DU-PHY-4, MVP-FUNC-SVCS-17-1, MVP-FUNC-BW-16-1]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    du.nof_sib1_ge: 1
    du.nof_sib2_ge: 1
    du.dl_max_mcs_ge: 27
    du.ul_max_mcs_ge: 27
    all.errors_le: 0
    all.warnings_le: 0

# E1 and F1 interfaces. Separated CU-UP, CU-CP and DU
baseline_cu_du:
  template: ue_simulator.test_cucp_cuup
  request: zmq_cucp_cuup
  ue:
    config: [1cell.cfg, udp_bi.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      test_duration: 6
  cu_cp:
    config: [cu.yml]
    parameters:
      gnb_id_bit_length_cfg: 22
  cu_up:
    config: []
  du:
    config: [du.yml, tdd_default.yml, sib12.yml, rlm_ssb_csi.yml, mac_pcap.yml]
    parameters:
      gnb_id_bit_length_cfg: 22
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-ARCH-INTF-6, MVP-ARCH-INTF-7, MVP-ARCH-INTF-9, MVP-ARCH-INTF-10, MVP-ARCH-INTF-11]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    du.nof_sib1_ge: 1
    du.nof_sib2_ge: 1
    du.dl_max_mcs_ge: 27
    du.ul_max_mcs_ge: 27
    all.errors_le: 0
    all.warnings_le: 0

# Mixed TDD pattern 6:4 DDDSUUUUDD
tdd_mixed:
  <<: *base_config
  gnb:
    config: [cu.yml, du.yml, prach_config.yml, tdd_mixed.yml, mac_pcap.yml]
    parameters:
      prach_config_index: 156
  feature_ids: [MVP-FUNC-TDD-16-4]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    du.dl_max_mcs_ge: 26
    du.ul_max_mcs_ge: 27
    all.errors_le: 0
    all.warnings_le: 0

