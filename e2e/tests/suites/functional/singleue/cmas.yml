# tid1.1.20: ETWS and CMAS test
etws_cmas:
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, udp_bi.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      test_duration: 2
  gnb:
    config: [amf.yml, cell_cfg.yml, tdd_default.yml, etws_cmas.yml, mac_pcap.yml]
  core:
    config: [baseline.cfg]
  feature_ids: [CU-GEN-1, MVP-FUNC-SVCS-16-5]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    du.errors_le: 0
    du.warnings_le: 0
    du.nof_sib8_ge: 1
