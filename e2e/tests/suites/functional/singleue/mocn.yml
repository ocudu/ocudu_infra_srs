# MOCN test
mocn: &base_config
  template: mocn.test
  request: zmq_2mme
  ue:
    config: [1cell.cfg, mocn.cfg]
  gnb:
    config: [mocn.yml, cu_cp.yml, du.yml]
  core:
    items:
      - parameters:
          mcc: "001"
          mnc: "01"
          slices:
            - 1
      - parameters:
          mcc: "001"
          mnc: "02"
          slices:
            - 1
  feature_ids: [MVP-FUNC-RANS-16-1]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_request_eq: 0
    ue.nof_pdu_session_establishment_accept_eq: 2 # there are 2 UEs, one per PLMN
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0

# MORAN test
moran:
  <<: *base_config
  ue:
    config: [2cell_intrafreq.cfg, mocn.cfg]
    parameters:
      num_cells: 2
  gnb:
    config: [mocn.yml, cu_cp.yml, du.yml, 2cell_moran.yml]
    parameters:
      num_cells: 2
  feature_ids: [MVP-FUNC-RANS-16-2]
