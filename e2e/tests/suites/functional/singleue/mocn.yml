# MOCN test
mocn: &base_config
  template: ue_simulator.test_gnb_2core
  request: zmq_mme
  ue:
    config: [1cell.cfg, mocn.cfg]
  gnb:
    config: [amf.yml, cell_cfg.yml, mocn.yml]
  core:
    items:
      - config: [baseline.cfg]
        parameters:
          plmn: "00101"
          first_ip: "192.168.3.2"
          last_ip: "192.168.3.254"
      - config: [baseline.cfg]
        parameters:
          plmn: "00102"
          first_ip: "192.168.4.2"
          last_ip: "192.168.4.254"
  feature_ids: [MVP-FUNC-RANS-16-1]
  criteria:
    dl_bitrate: 0
    ul_bitrate: 0
    nof_ko_dl: 0
    nof_ko_ul: 0
    nof_reestablishments_eq: 0
    nof_pdu_session_establishment_accept_eq: 2 # there are 2 UEs, one per PLMN
    nof_error_indications: 0
    errors: 0
    warnings: 0

# MORAN test
moran:
  <<: *base_config
  ue:
    config: [2cell_intrafreq.cfg, mocn.cfg]
  gnb:
    config: [amf.yml, cell_cfg.yml, mocn.yml, 2cell_moran.yml]
  feature_ids: [MVP-FUNC-RANS-16-2]
