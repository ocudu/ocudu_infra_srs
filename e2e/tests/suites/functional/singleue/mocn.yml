# MOCN test
mocn: &base_config
  template: ue_simulator.test_gnb_2core
  request: zmq_2mme
  ue:
    config: [1cell.cfg, mocn.cfg]
  gnb:
    config: [amf.yml, cell_cfg.yml, mocn.yml]
  core:
    items:
      - config: [baseline.cfg]
        parameters:
          plmn: "00101"
          first_ip: "192.168.3.2"
          last_ip: "192.168.3.254"
      - config: [baseline.cfg]
        parameters:
          plmn: "00102"
          first_ip: "192.168.4.2"
          last_ip: "192.168.4.254"
  feature_ids: [MVP-FUNC-RANS-16-1]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 2 # there are 2 UEs, one per PLMN
    du.nof_error_indications_le: 0
    du.errors_le: 0
    du.warnings_le: 0

# MORAN test
moran:
  <<: *base_config
  ue:
    config: [2cell_intrafreq.cfg, mocn.cfg]
  gnb:
    config: [amf.yml, cell_cfg.yml, mocn.yml, 2cell_moran.yml]
  feature_ids: [MVP-FUNC-RANS-16-2]
