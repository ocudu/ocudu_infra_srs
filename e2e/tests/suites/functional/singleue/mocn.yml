# MOCN test
mocn: &base_config
  template: ue_simulator.test_gnb_2core
  request: zmq_mme
  ue:
    config: [2cell_intrafreq_chsim.cfg, udp_bi.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      ul_bitrate: 10.0e+3
      test_duration: 2
  gnb:
    config: [amf.yml, cell_cfg.yml, mocn.yml]
  core:
    items:
      - config: [baseline.cfg]
        parameters:
          plmn: "00101"
          first_ip: "192.168.3.2"
          last_ip: "192.168.3.254"
      - config: [baseline.cfg]
        parameters:
          plmn: "00102"
          first_ip: "192.168.4.2"
          last_ip: "192.168.4.254"
  feature_ids: [MVP-FUNC-RANS-16-1]
  criteria:
    dl_bitrate: 0
    ul_bitrate: 0
    nof_ko_dl: 0
    nof_ko_ul: 0
    nof_reestablishments_eq: 0
    nof_pdu_session_establishment_accept_eq: 1
    nof_error_indications: 0
    errors: 0
    warnings: 0

