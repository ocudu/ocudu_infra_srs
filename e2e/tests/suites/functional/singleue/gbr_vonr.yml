# GBR bearer, VoNR 5QI and ROHC test
baseline:
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, gbr_vonr.cfg]
    parameters:
      dl_bitrate: 10.0e+6
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, vonr_qos.yml]
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-SVCS-16-8-a, MVP-FUNC-SVCS-16-8-b, MVP-FUNC-SVCS-16-8-c, DU-QOS-1]
  criteria:
    du.dl_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_request_eq: 0
    du.nof_error_indications_le: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    core.nof_pdu_session_modification_complete_ge: 1
    core.nof_pdu_session_modification_command_reject_eq: 0
    cu_cp.nof_rohc_profile_1_configured_ge: 1
    cu_cp.nof_rohc_profile_2_configured_ge: 1
    cu_cp.nof_5qi_1_drb_configured_ge: 1
    cu_cp.nof_5qi_2_drb_configured_ge: 1
    all.errors_le: 0
    all.warnings_le: 0

# IMS test
ims:
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, ims.cfg]
    parameters:
      dl_bitrate: 10.0e+6
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, vonr_qos.yml]
  core:
    config: [baseline.cfg]
    parameters:
      ims_mode: enabled
  feature_ids: [MVP-FUNC-SVCS-16-8]
  criteria:
    du.dl_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_request_eq: 0
    du.nof_error_indications_le: 0
    core.nof_pdu_session_establishment_accept_eq: 2
    core.nof_ims_nas_registered_ue_eq: 1
    cu_cp.nof_5qi_5_drb_configured_ge: 1
    all.errors_le: 0
    all.warnings_le: 0
