# GBR bearer, VoNR 5QI and ROHC test
baseline: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, gbr_vonr.cfg]
    parameters:
      dl_bitrate: 10.0e+6
  gnb:
    config: [cu_cp_log.yml, amf.yml, cell_cfg.yml, tdd_default.yml, vonr_qos.yml]
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-SVCS-16-8-a, MVP-FUNC-SVCS-16-8-b, MVP-FUNC-SVCS-16-8-c, DU-QOS-1]
  criteria:
    du.dl_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    du.errors_le: 0
    du.warnings_le: 0
