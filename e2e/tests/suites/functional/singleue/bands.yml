# 4T4R DL for mid bands authorized in North America (2.1GHz)
band_na_4t4r_dl:
  <<: *base_config
  request: zmq_1000
  ue:
    config: [1cell.cfg, udp_bi.cfg]
    parameters:
      band: 66       # n66 (FDD) is available in the US and the DL carrier is on 2.11-2.2GHz
      dl_nr_arfcn: 430000
      ssb_nr_arfcn: 428650
      bandwidth: 20
      common_scs: 15
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      test_duration: 2
      nof_antennas_dl: 4
      nof_antennas_ul: 4
      pdcch_decode_threshold: 0
  gnb:
    config: [cu_cp.yml, du.yml]
    parameters:
      band: 66   # n66 (FDD) is available in the UE and the DL carrier is on 2.11-2.2GHz
      dl_nr_arfcn: 430000
      bandwidth: 20
      common_scs: 15
      nof_antennas_dl: 4
      nof_antennas_ul: 4
  feature_ids: [MVP-FUNC-PHY-16-8]

# 2T2R UL for mid bands authorized in North America (1.8GHz)
band_na_2t2r_ul:
  <<: *base_config
  ue:
    config: [1cell.cfg, udp_bi.cfg]
    parameters:
      band: 25       # n25 (FDD) is available in the US and the UL carrier is on 1.85-1.915GHz.
      dl_nr_arfcn: 392000
      ssb_nr_arfcn: 390530
      bandwidth: 20
      common_scs: 15
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      test_duration: 2
      nof_antennas_dl: 2
      nof_antennas_ul: 2
      pdcch_decode_threshold: 0
  gnb:
    config: [cu_cp.yml, du.yml]
    parameters:
      band: 25    # n25 (FDD) is available in the US and the UL carrier is on 1.85-1.915GHz.
      dl_nr_arfcn: 392000
      bandwidth: 20
      common_scs: 15
      nof_antennas_dl: 2
      nof_antennas_ul: 2
  feature_ids: [MVP-FUNC-PHY-16-11]
