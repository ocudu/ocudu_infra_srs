# Slicing test
slicing: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, slicing.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      ul_bitrate: 10.0e+3
      test_duration: 1
  gnb:
    config: [dual_slice.yml, cu.yml, du.yml, mac_pcap.yml, tdd_default.yml, sib16.yml, slice_rach.yml]
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-SVCS-17-3-a, MVP-FUNC-SVCS-17-3-b]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 2
    du.nof_error_indications_le: 0
    du.nof_sib16_ge: 1
    du.sib1_has_rach_prioritization_slice_eq: true
    all.errors_le: 0
    all.warnings_le: 0
