# Slicing test
slicing: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, slicing.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
  gnb:
    config: [cu_cp_log.yml, cell_cfg.yml, tdd_default.yml, dual_slice.yml]
  core:
    config: [baseline.cfg]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 2
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0
