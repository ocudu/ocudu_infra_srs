# UL pre-scheduling, triggered UL grant
baseline:
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, udp_singleue.cfg]
    parameters:
      dl_bitrate: 5.0e+6
      ul_bitrate: 0
      traffic_duration: 20
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, drb_triggered_ul_grant_qos.yml]
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-BW-16-2]
  criteria:
    du.dl_bitrate_gt: 0
    # DL traffic triggers UL grants.
    du.ul_bitrate_gt: 7.0e+5
    # UE doesn't report any real BSR.
    du.ue_bsr_max_le: 10
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_request_eq: 0
    du.nof_error_indications_le: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    all.errors_le: 0
    all.warnings_le: 0
