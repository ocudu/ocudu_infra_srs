# TDD MIMO 2x2 configuration test
mimo_2x2: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, udp_bi.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      nof_antennas: 2
      pdcch_decode_threshold: 0
  gnb:
    config: [cu.yml, du.yml, tdd_default.yml, srs_wideband.yml, mimo_rx.yml]
    parameters:
      nof_antennas: 2
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-MIMO-16-3, MVP-FUNC-MIMO-16-4, MVP-FUNC-PHY-16-10, MVP-FUNC-PHY-16-11]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.dl_avg_ri_ge: 1.5
    du.ul_avg_ri_ge: 1.5
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0

# TDD MIMO 4x4 configuration test
mimo_4x4:
  <<: *base_config
  ue:
    config: [1cell.cfg, udp_bi.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      nof_antennas: 4
      pdcch_decode_threshold: 0
  gnb:
    config: [cu.yml, du.yml, tdd_default.yml, srs_wideband.yml, mimo_rx.yml]
    parameters:
      nof_antennas: 4
  feature_ids: [MVP-FUNC-MIMO-16-5, MVP-FUNC-PHY-16-7, MVP-FUNC-PHY-16-8]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.dl_avg_ri_ge: 3.5
    du.ul_avg_ri_ge: 3.5
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0
