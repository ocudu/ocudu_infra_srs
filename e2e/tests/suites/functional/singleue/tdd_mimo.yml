# TDD MIMO 2x2 configuration test
mimo_2x2: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, udp_bi.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      nof_antennas_dl: 2
      nof_antennas_ul: 2
      pdcch_decode_threshold: 0
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, srs_periodic_wband.yml, mimo_rx.yml]
    parameters:
      nof_antennas_dl: 2
      nof_antennas_ul: 2
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-MIMO-16-1, MVP-FUNC-MIMO-16-3, MVP-FUNC-MIMO-16-4, MVP-FUNC-PHY-16-10, MVP-FUNC-PHY-16-11]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.dl_avg_ri_ge: 1.5
    du.ul_avg_ri_ge: 1.5
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    du.nof_pucch_f0f1_invalid_harqs_le: 0
    du.nof_pucch_f2f3f4_invalid_harqs_le: 0
    du.nof_pucch_f2f3f4_invalid_csis_le: 0 # To validate periodic CSI (enabled by default)
    du.nof_pusch_invalid_harqs_le: 0
    du.nof_pusch_invalid_csis_le: 0
    all.errors_le: 0
    all.warnings_le: 0

mimo_2x2_aperiodic_csi:
  <<: *base_config
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, aperiodic_csi.yml, srs_periodic_wband.yml, mimo_rx.yml]
    parameters:
      nof_antennas_dl: 2
      nof_antennas_ul: 2
  feature_ids: [MVP-FUNC-MIMO-16-1]

# TDD MIMO 4x4 configuration test
mimo_4x4:
  <<: *base_config
  ue:
    config: [1cell.cfg, udp_bi.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      nof_antennas_dl: 4
      nof_antennas_ul: 4
      pdcch_decode_threshold: 0
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, srs_periodic_wband.yml, mimo_rx.yml]
    parameters:
      nof_antennas_dl: 4
      nof_antennas_ul: 4
  feature_ids: [MVP-FUNC-MIMO-16-5, MVP-FUNC-PHY-16-7, MVP-FUNC-PHY-16-8]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.dl_avg_ri_ge: 3.5
    du.ul_avg_ri_ge: 3.5
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0
