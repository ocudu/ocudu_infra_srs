# Closed loop PC with PUCCH f0/f2 format pair
closed_loop_pc: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, udp_singleue.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, closed_loop_pc.yml, pucch_config.yml]
    parameters:
      prach_config_index: 159
      pucch_format: "f0_and_f2"
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-BAS-16-3]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    du.nof_pucch_f0f1_invalid_harqs_le: 0
    all.errors_le: 0
    all.warnings_le: 0

# Closed loop PC with PUCCH f1/f3 format pair
closed_loop_pc_f1f3:
  <<: *base_config
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml, closed_loop_pc.yml, pucch_config.yml]
    parameters:
      prach_config_index: 159
      pucch_format: "f1_and_f3"

# Closed loop PC under FDD (band 3, 50 MHz)
closed_loop_pc_fdd:
  <<: *base_config
  ue:
    config: [1cell.cfg, udp_singleue.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      dl_nr_arfcn: 368500
      ssb_nr_arfcn: 364090
      band: 3
      bandwidth: 50
      common_scs: 15
  gnb:
    config: [cu_cp.yml, du.yml, closed_loop_pc.yml, pucch_config.yml]
    parameters:
      dl_nr_arfcn: 368500
      bandwidth: 50
      band: 3
      common_scs: 15
      pucch_format: "f0_and_f2"
