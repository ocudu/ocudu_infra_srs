# tid1.1.13: Closed loop PC configuration test
closed_loop_pc:
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, udp_bi.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
  gnb:
    config: [amf.yml, cell_cfg.yml, tdd_default.yml, closed_loop_pc.yml, pucch_config.yml]
    parameters:
      prach_config_index: 159
      pucch_format: "f0_and_f2"
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-BAS-16-3]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0
