# Closed loop PC configuration test
closed_loop_pc:
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, udp_bi.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
  gnb:
    config: [cell_cfg.yml, tdd_default.yml, closed_loop_pc.yml, pucch_config.yml]
    parameters:
      prach_config_index: 159
      pucch_format: "f0_and_f2"
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-BAS-16-3]
  criteria:
    dl_bitrate: 0
    ul_bitrate: 0
    nof_ko_dl: 0
    nof_ko_ul: 0
    nof_reestablishments_eq: 0
    nof_pdu_session_establishment_accept_eq: 1
    nof_error_indications: 0
    errors: 0
    warnings: 0
