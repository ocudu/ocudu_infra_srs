# PRACH format 0 configuration test
prach_config_0: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, udp_bi.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      test_duration: 2
  gnb:
    config: [cell_cfg.yml, tdd_default.yml, prach_config.yml, mac_pcap.yml]
    parameters:
      prach_config_index: 159
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-PHY-16-2]
  criteria:
    dl_bitrate: 0
    ul_bitrate: 0
    nof_ko_dl: 0
    nof_ko_ul: 0
    nof_reestablishments_eq: 0
    nof_pdu_session_establishment_accept_eq: 1
    nof_error_indications: 0
    errors: 0
    warnings: 0
    prach_configuration_index_eq: 159

