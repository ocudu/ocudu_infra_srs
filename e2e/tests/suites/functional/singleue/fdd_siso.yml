# tc1.4: Baseline gNB configuration test for FDD 50 MHz configuration in band 3
band3_bw50: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, udp_bi.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      dl_nr_arfcn: 368500
      ssb_nr_arfcn: 364090
      common_scs: 15
      band: 3
      bandwidth: 50
  gnb:
    config: [amf.yml, cell_cfg.yml]
    parameters:
      cfg_earfcn: 368500
      cfg_bandwidth: 50
      cfg_band: 3
      cfg_common_scs: 15
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-PHY-16-12, MVP-FUNC-BW-16-1]
  criteria:
    dl_bitrate: 0
    ul_bitrate: 0
    nof_ko_dl: 0
    nof_ko_ul: 0
    nof_reestablishments_eq: 0
    nof_pdu_session_establishment_accept_eq: 1
    nof_error_indications: 0
    errors: 0
    warnings: 0

# tid1.1.26: FDD 50 MHz with PRACH config 1
prach_config_1_fdd:
  <<: *base_config
  gnb:
    config: [amf.yml, cell_cfg.yml, prach_config.yml]
    parameters:
      cfg_earfcn: 368500
      cfg_bandwidth: 50
      cfg_band: 3
      cfg_common_scs: 15
      prach_config_index: 16
  ue:
    config: [1cell.cfg, udp_bi.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      ul_bitrate: 10.0e+3
      dl_nr_arfcn: 368500
      ssb_nr_arfcn: 364090
      common_scs: 15
      band: 3
      bandwidth: 50
      test_duration: 3
  criteria:
    dl_bitrate: 0
    ul_bitrate: 0
    nof_ko_dl: 0
    nof_ko_ul: 0
    nof_reestablishments_eq: 0
    nof_pdu_session_establishment_accept_eq: 1
    nof_error_indications: 0
    errors: 0
    warnings: 0
  feature_ids: [MVP-FUNC-PHY-16-2]

# tc1.4: FDD 5 MHz in band 3
band3_bw5:
