# Baseline gNB configuration test for FDD 50 MHz configuration in band 3
band3_bw50: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, udp_singleue.cfg]
    parameters:
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      dl_nr_arfcn: 368500
      ssb_nr_arfcn: 364090
      band: 3
      bandwidth: 50
      common_scs: 15
  gnb:
    config: [cu_cp.yml, du.yml]
    parameters:
      dl_nr_arfcn: 368500
      bandwidth: 50
      band: 3
      common_scs: 15
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-PHY-16-12, MVP-FUNC-BW-16-1]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    ue.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    ue.nof_ko_ul_le: 0
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0

# FDD 50 MHz with PRACH format 0
prach_config_0_fdd:
  <<: *base_config
  gnb:
    config: [cu_cp.yml, du.yml, prach_config.yml, mac_pcap.yml]
    parameters:
      dl_nr_arfcn: 368500
      bandwidth: 50
      band: 3
      common_scs: 15
      prach_config_index: 12
      zero_correlation_zone: 0
  ue:
    config: [1cell.cfg, udp_singleue.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      ul_bitrate: 10.0e+3
      dl_nr_arfcn: 368500
      ssb_nr_arfcn: 364090
      band: 3
      bandwidth: 50
      common_scs: 15
      traffic_duration: 3
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    ue.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    ue.nof_ko_ul_le: 0
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0
    du.prach_configuration_index_eq: 12
  feature_ids: [MVP-FUNC-PHY-16-2]

