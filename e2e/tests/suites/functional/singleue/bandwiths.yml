# Baseline band n41 at 10 MHz
bw_tdd_10: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, udp_singleue.cfg]
    parameters:
      band: 41
      bandwidth: 10
      dl_nr_arfcn: 520002
      ssb_nr_arfcn: 519870
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      test_duration: 2
      pdcch_decode_threshold: 0
  gnb:
    config: [cu_cp.yml, du.yml, mac_pcap.yml]
    parameters:
      band: 41
      dl_nr_arfcn: 520002
      bandwidth: 10
  core:
    config: [baseline.cfg]
  feature_ids: []
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    du.errors_le: 0
    du.warnings_le: 0

# Baseline band n41 at 50 MHz
bw_tdd_50:
  <<: *base_config
  ue:
    config: [1cell.cfg, udp_singleue.cfg]
    parameters:
      band: 41
      bandwidth: 50
      dl_nr_arfcn: 520002
      ssb_nr_arfcn: 516030
      dl_bitrate: 10.0e+6
      ul_bitrate: 10.0e+6
      test_duration: 2
      pdcch_decode_threshold: 0
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml]
    parameters:
      band: 41
      dl_nr_arfcn: 520002
      bandwidth: 50
  feature_ids: []
