geo_fl_false_harq_enabled_iperf:
  <<: *base_config
  ue:
    config: [1cell_ntn.cfg, multiue_udp_bi.cfg.jinja]
    parameters:
      <<: *base_ue_parameters
      log_level: warning
      traffic_type: "udp_bi"
      brate_dl: 50.0e+6
      brate_ul: 50.0e+6
      staggered_traffic_start: true
      traffic_duration_sec: 50
      traffic_stop_to_dereg_delay_time: 1
      dereg_to_pw_off_delay_time: 1
      quit_delay_time: 1
  gnb:
    config: [cu_cp.yml, du.yml, cu_cp_ntn.yml, du_ntn.yml]
    parameters:
      <<: *base_gnb_parameters
      log_level: warning
      time_multiplier: 0.99
  core:
    config: [baseline.cfg]
  criteria:
    du.dl_bitrate_gt: 1.0e+6
    du.ul_bitrate_gt: 1.0e+6
    du.nof_reestablishments_eq: 0
    du.nof_error_indications_le: 0
    du.errors_le: 0
    core.nof_pdu_session_establishment_accept_eq: 1

