geo_band_256_bw_5_fl_false_ping: &base_config
  template: ue_simulator.test_gnb
  request: zmq_ntn
  ue:
    config: [1cell_ntn.cfg, multiue_ping.cfg.jinja]
    parameters: &base_ue_parameters
      ntn_enable: true
      band: 256
      bandwidth: 5
      dl_nr_arfcn: 437000
      common_scs: 15
      sample_rate: 5760000
      ssb_nr_arfcn: 437090
      as_release: 17
      nof_sim_ues: 1
      traffic_duration_sec: 100
      base_power_on_time: 1

      feeder_link: false
      satellite: geo

      ephemeris_format: orbital
      gp_latitude: -2.32724563
      gp_longitude: -151.397854351
      gp_altitude: 1.0
  gnb:
    config: [cu_cp.yml, du.yml, cu_cp_ntn.yml, du_ntn.yml]
    parameters: &base_gnb_parameters
      log_ntn_level: debug
      cfg_band: 256
      cfg_bandwidth: 5
      cfg_earfcn: 437000
      cfg_common_scs: 15
      sample_rate: 5760000
      dl_freq: 2185000000.0
      ul_freq: 1995000000.0
      time_alignment_calibration: -576
      zero_correlation_zone: 0
      rrc_procedure_guard_time_ms: 12800
      dl_harq_disabled: false
      ul_harq_disabled: false
      warning_allowlist:
        - Slot point to time point mapping not available.

      feeder_link: false
      cell_specific_koffset: 240
      ta_meas_slot_prohibit_period: 250

      ephemeris_format: orbital
      eccentricity: 0.0002596053925158607
      inclination: 0.1319312264847397
      longitude: 0.18827186416253533
      mean_anomaly: 5.108532741837221
      periapsis: 4.630205380656405
      semi_major_axis: 42265116.30346734
  core:
    config: [baseline.cfg]
  feature_ids: [SRS]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_reestablishments_eq: 0
    du.nof_error_indications_le: 0
    du.errors_le: 0
    du.nof_ko_dl_le: 10
    du.nof_ko_ul_le: 10
    core.nof_pdu_session_establishment_accept_eq: 1

