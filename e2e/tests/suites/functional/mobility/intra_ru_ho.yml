# Intra-cell HO for key regeneration in FR1
key_regen: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, key_regen.cfg]
  gnb:
    config: [cu_cp.yml, du.yml, tdd_default.yml]
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-MOB-1-a]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    # Key regeneration involves the UE PRACHing, which can leave old HARQ processes unfinished
    du.nof_ko_dl_le: 20
    du.nof_ko_ul_le: 20
    ue.nof_handovers_eq: 1
    du.nof_reestablishments_request_eq: 0
    du.nof_error_indications_le: 0
    core.nof_pdu_session_establishment_accept_ge: 25
    all.errors_le: 0
    all.warnings_le: 0

# Intra-cell HO for key regeneration in FR2
fr2_key_regen:
  <<: *base_config
  ue:
    config: [1cell.cfg, key_regen.cfg]
    parameters:
      band: 261
      dl_nr_arfcn: 2074171
      ssb_nr_arfcn: 2073691
      common_scs: 120
  gnb:
    config: [cu_cp.yml, du.yml, prach_config.yml, tdd_default.yml]
    parameters:
      zero_correlation_zone: 0
      band: 261
      dl_nr_arfcn: 2074171
      common_scs: 120
      prach_config_index: 121
  feature_ids: [MVP-FUNC-MOB-1-a]

# TAU request test
# TODO: verify that the TAU request has been actually sent
tau_request:
  <<: *base_config
  ue:
    config: [1cell.cfg, tau_request.cfg]
  feature_ids: [CU-GEN-7]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    ue.nof_handovers_eq: 0
    du.nof_reestablishments_request_eq: 0
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0
