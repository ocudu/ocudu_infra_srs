# Intra-cell handover for key regeneration
key_regen: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, key_regen.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
  gnb:
    config: [cu.yml, du.yml, tdd_default.yml]
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-MOB-1-a]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_handovers_eq: 1
    du.nof_reestablishments_eq: 0
    du.nof_error_indications_le: 0
    core.nof_pdu_session_establishment_accept_ge: 25
    all.errors_le: 0
    all.warnings_le: 0

# TAU request test
# TODO: verify that the TAU request has been actually sent
tau_request:
  <<: *base_config
  ue:
    config: [1cell.cfg, tau_request.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
  feature_ids: [CU-GEN-7]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_handovers_eq: 0
    du.nof_reestablishments_eq: 0
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0
