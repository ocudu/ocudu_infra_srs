# inter-DU HO intra-frequency
baseline: &base_config
  template: ue_simulator.test_cu_2du
  request: zmq_1cu2du
  core:
    config: [baseline.cfg]
  ue:
    config: [2cell_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      test_duration: 100
      nof_ue: &nof_ue 1
      num_cells: 2
  cu:
    config: [cu_cp.yml, mobility.yml]
  du:
    items:
      - config: [du.yml, tdd_default.yml, sib2345.yml]
        parameters:
          gnb_du_id: 0
          pci: 1
          sector_id: 0
      - config: [du.yml, tdd_default.yml, sib2345.yml]
        parameters:
          gnb_du_id: 1
          pci: 2
          sector_id: 1
  feature_ids: [MVP-FUNC-MOB-1-c]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 300 # allow some KOs during HO transitions
    du.nof_ko_ul_le: 300 # allow some KOs during HO transitions
    du.nof_reestablishments_request_eq: 0
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    ue.nof_handovers_ge: 20 # calculated based on the test_duration
    du.nof_error_indications_le: 0
    all.errors_le: 0
    all.warnings_le: 0

# inter-RU, inter-DU intra-band HO in FR2
fr2:
  <<: *base_config
  ue:
    config: [2cell_intrafreq_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      test_duration: 100
      nof_ue: *nof_ue
      num_cells: 2
      band: 261
      dl_nr_arfcn: 2074171
      ssb_nr_arfcn: 2073691
      common_scs: 120
  du:
    items:
      - config: [du.yml, prach_config.yml, tdd_default.yml, sib2345.yml]
        parameters:
          zero_correlation_zone: 0
          gnb_du_id: 0
          band: 261
          pci: 1
          sector_id: 0
          dl_nr_arfcn: 2074171
          common_scs: 120
          prach_config_index: 121
      - config: [du.yml, prach_config.yml, tdd_default.yml, sib2345.yml]
        parameters:
          zero_correlation_zone: 0
          gnb_du_id: 1
          pci: 2
          sector_id: 1
          band: 261
          dl_nr_arfcn: 2074171
          common_scs: 120
          prach_config_index: 121
  feature_ids: [MVP-FUNC-MOB-1-c]

# inter-RU, inter-DU HO FR1 to FR2 inter-frequency with measurement gap
fr1_fr2:
  <<: *base_config
  ue:
    # Inter-frequency UE config:
    # Cell 2 is FR2 (n261, 120 kHz SCS), matching DU-2 below.
    config: [2cell_interfreq_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      test_duration: 100
      nof_ue: *nof_ue
      num_cells: 2
      # FR2 cell-2 parameters (must match DU-2 below)
      band_2: 261
      bandwidth_2: 100
      dl_nr_arfcn_2: 2074171
      ssb_nr_arfcn_2: 2073691
      common_scs_2: 120
  du:
    items:
      - config: [du.yml, tdd_default.yml, sib2345.yml]
        parameters:
          gnb_du_id: 0
          pci: 1
          sector_id: 0
      - config: [du.yml, prach_config.yml, tdd_default.yml, sib2345.yml]
        parameters: # FR2 config parameters
          zero_correlation_zone: 0
          gnb_du_id: 1
          pci: 2
          dl_nr_arfcn: 2074171
          band: 261
          common_scs: 120
          prach_config_index: 121
          sector_id: 1
  feature_ids: [MVP-FUNC-MOB-2-a, MVP-FUNC-MOB-2-b, MVP-FUNC-MOB-2-c, DU-GEN-9]
