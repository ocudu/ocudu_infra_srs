# Intra-RU Reestablishment test (same cell)
intra_ru: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell_chsim.cfg, reestablishment.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      ul_bitrate: 10.0e+3
      nof_reestablishments: &nof_reestablishments 5
  gnb:
    config: [amf.yml, cell_cfg.yml, tdd_default.yml]
  core:
    config: [baseline.cfg]
  feature_ids: [CU-GEN-3]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_eq: *nof_reestablishments
    core.nof_pdu_session_establishment_accept_eq: 1
    du.nof_error_indications_le: 0
    du.errors_le: 0
    du.warnings_le: 0

# Reestablishment
inter_du:
  <<: *base_config
  feature_ids: [skip, CU-GEN-3] # tc1.11 rc8.1

# Reestablishment
inter_cu:
  <<: *base_config
  feature_ids: [skip, CU-GEN-3] # tc1.11 rc9.1
