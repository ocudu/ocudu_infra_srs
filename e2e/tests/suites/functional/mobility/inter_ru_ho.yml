# inter-RU, intra-DU, intra-freq HO
baseline: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [2cell_intrafreq_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      test_duration: 100
      nof_ue: &nof_ue 1
  gnb:
    config: [cell_cfg.yml, 2cell_intrafreq.yml, mobility.yml, tdd_default.yml, sib2345.yml, mac_pcap.yml]
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-MOB-1-b, MVP-FUNC-MOB-1-c, MVP-FUNC-MOB-14, MVP-FUNC-BAS-16-2]
  criteria:
    dl_bitrate: 0
    ul_bitrate: 0
    nof_ko_dl: 0
    nof_ko_ul: 0
    nof_reestablishments_eq: 0
    nof_pdu_session_establishment_accept_eq: *nof_ue
    nof_handovers_ge: 20 # calculated based on the test_duration
    nof_error_indications: 0
    errors: 0
    warnings: 0
    t312_eq: 1
    nof_sib3_geq: 1
    nof_sib4_geq: 1

# inter-RU conditional HO
conditional_ho:
  <<: *base_config
  ue:
    config: [2cell_intrafreq_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      test_duration: 100
      nof_ue: *nof_ue
  gnb:
    config: [cell_cfg.yml, 2cell_intrafreq.yml, mobility.yml, tdd_default.yml, conditional_ho.yml, mac_pcap.yml]
    parameters:
      trigger_handover: false
  feature_ids: [MVP-FUNC-MOB-15]
  criteria:
    dl_bitrate: 0
    ul_bitrate: 0
    nof_ko_dl: 0
    nof_ko_ul: 0
    nof_reestablishments_eq: 0
    nof_pdu_session_establishment_accept_eq: *nof_ue
    nof_handovers_ge: 20 # calculated based on the test_duration
    nof_error_indications: 0
    errors: 0
    warnings: 0
