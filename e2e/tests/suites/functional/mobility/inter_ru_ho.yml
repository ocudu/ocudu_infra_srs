# inter-RU, intra-DU, intra-freq HO
baseline: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [2cell_intrafreq_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      test_duration: 100
      nof_ue: &nof_ue 1
  gnb:
    config: [cu_cp_log.yml, amf.yml, cell_cfg.yml, 2cell_intrafreq.yml, mobility.yml, tdd_default.yml, sib2345.yml, mac_pcap.yml]
  core:
    config: [baseline.cfg]
  feature_ids: [MVP-FUNC-MOB-1-b, MVP-FUNC-MOB-1-c, MVP-FUNC-MOB-14, MVP-FUNC-BAS-16-2, DU-GEN-2-a, CU-GEN-5]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 5 # allow some KOs due to SR false alarms during UE reconfiguration
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    du.nof_handovers_ge: 20 # calculated based on the test_duration
    du.nof_error_indications_le: 0
    du.errors_le: 0
    du.warnings_le: 0
    du.t312_eq: 1
    du.nof_sib3_ge: 1
    du.nof_sib4_ge: 1

# inter-RU conditional HO
conditional_ho:
  <<: *base_config
  ue:
    config: [2cell_intrafreq_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      test_duration: 100
      nof_ue: *nof_ue
  gnb:
    config: [cu_cp_log.yml, amf.yml, cell_cfg.yml, 2cell_intrafreq.yml, conditional_ho.yml, tdd_default.yml, mac_pcap.yml]
    parameters:
      trigger_handover: false
  feature_ids: [MVP-FUNC-MOB-15]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    du.nof_handovers_ge: 20 # calculated based on the test_duration
    du.nof_error_indications_le: 0
    du.errors_le: 0
    du.warnings_le: 0

# cfra_ho
cfra_ho:
  <<: *base_config
  ue:
    config: [2cell_intrafreq_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      test_duration: 100
      nof_ue: *nof_ue
  gnb:
    config: [cu_cp_log.yml, amf.yml, cell_cfg.yml, 2cell_intrafreq.yml, mobility.yml, cfra_ho.yml, tdd_default.yml, mac_pcap.yml]
    parameters:
      trigger_handover: false
  feature_ids: [DU-GEN-2-b]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 0
    du.nof_ko_ul_le: 0
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    du.nof_handovers_ge: 20 # calculated based on the test_duration
    du.nof_error_indications_le: 0
    du.errors_le: 0
    du.warnings_le: 0
