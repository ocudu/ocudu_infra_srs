# inter-RU, intra-DU, intra-freq HO
# test_id: tid1.2.6
# test_case_id: tc1.9 (handover.cfg)
# test_case_desc: 1 UE attaches to cell A, starts bidirectional UDP and moves to cell B, doing Handover
baseline:
  template: ue_simulator
  testbed: zmq_mme
  ue:
    config: [2cell_2t2r_bw100_band78_chsim.cfg, handover.cfg]
  gnb:
    config:
      [2t2r_bw100_band78.yml, base_slice.yml, pcaps.yml, 2cell_intradu_ho.yml]
  core:
    config: [baseline.cfg]
  criteria:
    dl_bitrate: 10.0e+6
    ul_bitrate: 10.0e+6
    nof_ko_dl: 100
    nof_ko_ul: 10
    nof_reestablishments_eq: 0
    nof_handovers_ge: 45
    max_late_dl_harqs: 0
    max_late_ul_harqs: 0
    nof_error_indications: 0
    errors: 0
    warnings: 0
