# tid1.2.10: inter-CU HO, changing the CU-UP
baseline: &base_config
  template: ue_simulator.test_2gnb
  request: zmq_2gnb
  core:
    config: [baseline.cfg]
    parameters:
      log_level: "debug"
  ue:
    config: [2cell_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      test_duration: 100
      nof_ue: &nof_ue 1
      num_cells: 2
      nof_antennas_dl: 1
      nof_antennas_ul: 1
  gnb:
    items:
      - config: [cu_cp.yml, inter_cu_mobility_1.yml, du.yml, tdd_default.yml, sib2345.yml]
        parameters:
          gnb_id: 411
          ran_node_name_cfg: "ocudu01"
          pci_cfg: 1
          nof_antennas_dl: 1
          nof_antennas_ul: 1
          cell_offset: 0
      - config: [cu_cp.yml, inter_cu_mobility_2.yml, du.yml, tdd_default.yml, sib2345.yml]
        parameters:
          gnb_id: 412
          ran_node_name_cfg: "ocudu02"
          pci_cfg: 2
          nof_antennas_dl: 1
          nof_antennas_ul: 1
          cell_offset: 1
  feature_ids: [MVP-FUNC-MOB-1-e, MVP-FUNC-MOB-4]
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 500 # allow some KOs during HO transitions
    du.nof_ko_ul_le: 100 # allow some KOs during HO transitions
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    ue.nof_handovers_ge: 20 # calculated based on the test_duration
    du.nof_error_indications_le: 0
    du.errors_le: 0
    du.warnings_le: 0

# tid1.2.11: inter-CU HO, same CU-UP
same_cu_up: &base_same_cu_up
  template: ue_simulator.test_2cucp_1cuup_2du
  request: zmq_2cucp_1cuup_2du
  core:
    config: [baseline.cfg]
    parameters:
      log_level: "debug"
  ue:
    config: [2cell_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      test_duration: 100
      nof_ue: *nof_ue
      num_cells: 2
      nof_antennas_dl: 1
      nof_antennas_ul: 1
  cu_cp:
    items:
      - config: [cu_cp.yml, inter_cu_mobility_1.yml]
        parameters:
          gnb_id: 411
          ran_node_name_cfg: "ocudu01"
          log_level: "debug"
      - config: [cu_cp.yml, inter_cu_mobility_2.yml]
        parameters:
          gnb_id: 412
          ran_node_name_cfg: "ocudu02"
          log_level: "debug"
  cu_up:
    config: [cu_up.yml]
  du:
    items:
      - config: [du.yml, tdd_default.yml, sib2345.yml]
        parameters:
          gnb_id: 411
          pci_cfg: 1
          nof_antennas_dl: 1
          nof_antennas_ul: 1
          cell_offset: 0
      - config: [du.yml, tdd_default.yml, sib2345.yml]
        parameters:
          gnb_id: 412
          pci_cfg: 2
          nof_antennas_dl: 1
          nof_antennas_ul: 1
          cell_offset: 1
  criteria:
    du.dl_bitrate_gt: 0
    du.ul_bitrate_gt: 0
    du.nof_ko_dl_le: 500 # allow some KOs during HO transitions
    du.nof_ko_ul_le: 100 # allow some KOs during HO transitions
    du.nof_reestablishments_eq: 0
    core.nof_pdu_session_establishment_accept_eq: *nof_ue
    ue.nof_handovers_ge: 20 # calculated based on the test_duration
    du.nof_error_indications_le: 0
    du.errors_le: 0
    du.warnings_le: 0
  feature_ids: [MVP-FUNC-MOB-1-d]

# tid1.2.12: inter-CU HO, changing the CU-UP between FR1 and FR2
fr1_fr2:
  <<: *base_config
  ue:
    # Inter-frequency UE config:
    # Cell 2 is FR2 (n261, 120 kHz SCS), matching gNB-2 below.
    config: [2cell_interfreq_chsim.cfg, handover.cfg]
    parameters:
      dl_bitrate: 1.0e+6
      ul_bitrate: 1.0e+6
      test_duration: 100
      nof_ue: *nof_ue
      num_cells: 2
      nof_antennas_dl: 1
      nof_antennas_ul: 1
      # FR2 cell-2 parameters (must match gNB-2 below)
      band_2: 261
      bandwidth_2: 100
      dl_nr_arfcn_2: 2074171
      ssb_nr_arfcn_2: 2073691
      common_scs_2: 120
  gnb:
    items:
      - config: [cu_cp.yml, inter_cu_mobility_1.yml, du.yml, tdd_default.yml, sib2345.yml]
        parameters:
          gnb_id: 411
          ran_node_name_cfg: "ocudu01"
          ext_ssb_arfcn: 2073691
          ext_band: 261
          ext_ssb_scs: 120
          pci_cfg: 1
          nof_antennas_dl: 1
          nof_antennas_ul: 1
          cell_offset: 0
      - config: [cu_cp.yml, inter_cu_mobility_2.yml, du.yml, prach_config.yml, tdd_default.yml, sib2345.yml]
        parameters:
          gnb_id: 412
          ran_node_name_cfg: "ocudu02"
          pci_cfg: 2
          cfg_earfcn: 2074171
          cfg_band: 261
          cfg_common_scs: 120
          cfg_bandwidth: 100
          prach_config_index: 121
          nof_antennas_dl: 1
          nof_antennas_ul: 1
          cell_offset: 1
  feature_ids: [MVP-FUNC-MOB-2-d]

