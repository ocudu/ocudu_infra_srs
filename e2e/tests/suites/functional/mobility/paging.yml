# tid2.2.22: Paging test
paging: &base_config
  template: ue_simulator.test_gnb
  request: zmq_mme
  ue:
    config: [1cell.cfg, paging.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      ul_bitrate: 10.0e+3
      nof_paging: 1
  gnb:
    config: [cu.yml, du.yml, tdd_default.yml, inactivity_timer.yml, mac_pcap.yml]
    parameters:
      time_multiplier: &time_multiplier 10
  core:
    config: [baseline.cfg]
    parameters:
      time_multiplier: *time_multiplier
  feature_ids: [MVP-FUNC-BAS-16-1, MVP-FUNC-MOB-11]
  criteria:
    <<: &base_criteria
      all.errors_le: 0
      all.warnings_le: 0
      du.dl_bitrate_gt: 0
      du.ul_bitrate_gt: 0
      du.nof_ko_dl_le: 0
      du.nof_ko_ul_le: 0
      du.nof_reestablishments_eq: 0
      core.nof_pdu_session_establishment_accept_eq: 1
      du.nof_error_indications_le: 0
    core.nof_ng_paging_eq: 1
    du.nof_rrc_suspend_ge: 0 # Release, no suspend
    du.nof_paging_eq: 2 # the DU sends 2x Paging messages per NG paging

# tid2.2.23: DRX test
drx:
  <<: *base_config
  gnb:
    config: [cu.yml, du.yml, tdd_default.yml, drx.yml, mac_pcap.yml, inactivity_timer.yml]
    parameters:
      drx_long_cycle: 80
      time_multiplier: *time_multiplier
  feature_ids: [MVP-FUNC-SVCS-16-6]
  criteria:
    <<: *base_criteria
    core.nof_ng_paging_eq: 1
    du.nof_paging_eq: 2  # the DU sends 2x Paging messages per NG paging
    du.drx_long_cycle_eq: 7 # this is the coded value that corresponds to 80 ms

# tid2.2.24: eDRX test
edrx:
  <<: *base_config
  gnb:
    config: [cu.yml, du.yml, tdd_default.yml, edrx.yml, mac_pcap.yml, inactivity_timer.yml]
    parameters:
      time_multiplier: *time_multiplier
  feature_ids: [DU-GEN-10]

# tid2.2.25: MT-Initiated Access
mt_initiate:
  <<: *base_config
  ue:
    config: [1cell.cfg, mt_initiate.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      ul_bitrate: 10.0e+3
      nof_paging: 1
  feature_ids: [MVP-FUNC-MOB-11]
  criteria:
    <<: *base_criteria
    core.nof_ng_paging_eq: 0
    du.nof_paging_eq: 0

# RRC Inactive - MT
rrc_inactive_mt:
  <<: *base_config
  ue:
    config: [1cell.cfg, paging.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      ul_bitrate: 10.0e+3
      nof_paging: 1
  gnb:
    config: [cu.yml, du.yml, tdd_default.yml, rrc_inactive.yml, mac_pcap.yml]
    parameters:
      time_multiplier: *time_multiplier
  feature_ids: [MVP-FUNC-BAS-16-1, MVP-FUNC-MOB-10]
  criteria:
    <<: *base_criteria
    core.nof_ng_paging_eq: 0 # RRC_INACTIVE keeps N2 up
    du.nof_rrc_suspend_eq: 1
    du.nof_paging_eq: 2 # 1 suspend/resume x 2 PCCH Paging messages
    du.nof_rrc_resume_complete_eq: 1

# RRC Inactive - MT multiple suspend/resume cycles
rrc_inactive_mt_multi:
  <<: *base_config
  ue:
    config: [1cell.cfg, paging.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      ul_bitrate: 10.0e+3
      nof_paging: 3
  gnb:
    config: [cu.yml, du.yml, tdd_default.yml, rrc_inactive.yml, mac_pcap.yml]
    parameters:
      time_multiplier: *time_multiplier
  feature_ids: [MVP-FUNC-BAS-16-1, MVP-FUNC-MOB-10]
  criteria:
    <<: *base_criteria
    core.nof_ng_paging_eq: 0 # RRC_INACTIVE keeps N2 up
    du.nof_rrc_suspend_eq: 3
    du.nof_paging_eq: 6 # 3 suspend/resume cycles x 2 PCCH Paging messages
    du.nof_rrc_resume_complete_eq: 3

# RRC Inactive - MO-data-triggered resume (no paging)
rrc_inactive_mo:
  <<: *base_config
  ue:
    config: [1cell.cfg, mo_initiate.cfg]
    parameters:
      dl_bitrate: 10.0e+3
      ul_bitrate: 10.0e+3
  gnb:
    config: [cu.yml, du.yml, tdd_default.yml, rrc_inactive.yml, mac_pcap.yml]
    parameters:
      time_multiplier: *time_multiplier
  feature_ids: [MVP-FUNC-MOB-10]
  criteria:
    <<: *base_criteria
    core.nof_ng_paging_eq: 0 # RRC_INACTIVE keeps N2 up
    du.nof_rrc_suspend_eq: 1
    du.nof_paging_eq: 0
    du.nof_rrc_resume_complete_eq: 1
