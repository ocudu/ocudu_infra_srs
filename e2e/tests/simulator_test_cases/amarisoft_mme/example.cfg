  plmn: "00101",

  /* Control Plane Cellular IoT EPS optimization support */
  cp_ciot_opt: true,
  /* DCNR support */
  dcnr_support: true,
  eps_5gs_interworking: "with_n26",
  /* 15 bearers support */
  fifteen_bearers: false,

  /* AMF slices configuration */
  nssai: [
   {
    sst: 1,
   },
  ],

  /* Public Data Networks. The first one is the default. */
  pdn_list: [
    {
      pdn_type: "ipv4",
      access_point_name: "{{apn}}",
      first_ip_addr: "{{subnet_prefix}}.32.2",
      last_ip_addr: "{{subnet_prefix}}.255.2",
      ip_addr_shift: 8, /* difference between allocated IP addresses is 4 */
      dns_addr: "8.8.8.8", /* Google DNS address */

      erabs: [
        {
          qci: 9,
          priority_level: 15,
        },
      ],

      slices: [
      {
       snssai: {
        sst: 1,
       },
       qos_flows: [
        {
         "5qi": 9,
          priority_level: 15,
        },
       ],
      },
     ],
    },
  ],


  /* NAS ciphering algorithm preference. EEA0 is always the last. */
  nas_cipher_algo_pref: [ ],
  /* NAS integrity algorithm preference. EIA0 is always the last. */
  nas_integ_algo_pref: [ 2, 1 ],

  /* user data base */
  ue_db: [
    { 
      sim_algo: "milenage",
      imsi: "001010123456790",
      amf: 0x9001,
      K: "00112233445566778899aabbccddeeff",
      opc: "63bfa50ee6523365ff14c1f45f88737d",
      count: 4,
    },
  ],
