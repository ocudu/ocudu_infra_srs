# id: name of test in Pytest
# campaign_filename: path to Viavi campaign file
# test_name: name of test in Viavi campaign file
# test_timeout: timeout for test in seconds
# gnb_extra_config: extra GNB configuration
# retina_params: extra Retina parameters [Optional]
# criteria: pass/fail criteria

campaign_filename: &campaign_filename "C:/ci/CI 4x4 ORAN-FH-complete.xml"
test_timeout: &test_timeout 1500 # 25 minutes

tests:
  - id: "1UE ideal UDP bidirectional"
    campaign_filename: *campaign_filename
    test_name: "1UE ideal UDP bidirectional"
    test_timeout: *test_timeout
    # Configuration
    gnb_extra_config: &base_config
      ru_ofh:
        t1a_max_up: 400
        t1a_min_up: 120
      cell_cfg: &base_cell_cfg
        sib:
          t301: 2000
          t311: 3000
        prach:
          prach_root_sequence_index: 1
          zero_correlation_zone: 0
          prach_frequency_start: 12
        pucch: &base_cell_cfg_pucch
          min_k1: 4
          nof_cell_sr_res: 30
        csi:
          csi_rs_period: 40
        pdsch:
          max_pdschs_per_slot: 4
          max_alloc_attempts: 8
          olla_target_bler: 0.1
          olla_cqi_inc_step: 0.05
          olla_max_cqi_offset: 10
        ul_common:
          max_ul_grants_per_slot: 12
          max_pucchs_per_slot: 10
        pusch:
          max_puschs_per_slot: 2
          min_k2: 2
          olla_target_bler: 0.1
          olla_snr_inc_step: 0.05
          olla_max_snr_offset: 20
        ta:
          ta_target: 0
        tdd_ul_dl_cfg:
          nof_dl_symbols: 8
          nof_dl_slots: 7
          nof_ul_slots: 2
        ssb:
          ssb_period: 20
      metrics: &base_metrics
        enable_log: true
        layers: &base_metrics_layers
          enable_executor: true
          enable_rlc: true
          enable_ru: true
      trace:
        layers:
          du_high_enable: true
          phy_enable: true
      cu_cp:
        rrc:
          rrc_procedure_guard_time_ms: 2000
      expert_execution: &base_expert_execution
        queues:
          du_ue_data_executor_queue_size: 16384
        threads: &base_expert_execution_threads
          main_pool:
            task_queue_size: 8192
          upper_phy:
            max_pucch_concurrency: 1
            max_pusch_and_srs_concurrency: 3
    # Pass / Fail Criteria
    criteria:
      du.dl_bitrate_gt: 1.2e+9
      du.ul_bitrate_gt: 75.0e+6
      du.max_late_dl_harqs_le: 4
      du.max_late_ul_harqs_le: 4
      du.nof_ko_dl_le: 0
      viavi.nof_ko_dl_le: 0
      du.nof_ko_ul_le: 0
      viavi.nof_ko_ul_le: 0
      du.nof_error_indications_le: 0
      du.errors_le: 0
      du.warnings_le: 0
      viavi.warnings_lt: .inf
      viavi.procedure_table_eq: 0
    warning_allowlist: &base_warning_allowlist
      - missed incoming User-Plane PRACH messages
      - Tracing thread cannot keep up

