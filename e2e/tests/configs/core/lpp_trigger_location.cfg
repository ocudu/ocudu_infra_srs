  // Times are relative to the core start.
  // The UE must be connected when the LMF receives the location request.
  sim_events: [
    // Log the full content of the positioning messages.
    {
      start_time: 1.0,
      event: "config_set",
      logs: {
        layers: {
          lpp: {max_size: 16384},
          nrppa: {max_size: 16384},
          nl1: {max_size: 16384},
        },
      },
    },
    // The AMF forwards the TRP Information Response to the LMF only after this subscription.
    {
      start_time: 23.5,
      event: "lmf_non_ue_n2_subscribe",
      notify_cbk_uri: "http://{{ip}}:5559/namf-comm/v1/non_ue_n2_notif_cbk"
    },
    {
      start_time: 24.0,
      event: "trp_information_req",
    },
    // The AMF forwards the UL LPP messages of the UE to the LMF only after this subscription.
    {
      start_time: 24.5,
      event: "lmf_ue_n1_n2_subscribe",
      supi: "imsi-001010123456789",
      imei: "4279070000000201",
      n1_notify_cbk_uri: "http://{{ip}}:5559/namf-comm/v1/N1/imsi-001010123456789/notify/imei=4279070000000201",
      n2_notify_cbk_uri: "http://{{ip}}:5559/namf-comm/v1/N2/imsi-001010123456789/notify/imei=4279070000000201"
    },
    {
      start_time: 25.0,
      event: "nr_location_req",
      supi: "imsi-001010123456789",
      pei: "imeisv-4279070000000201"
    },
    {
      start_time: 26.0,
      event: "lpp_request_location",
      is_5gs: true,
      supi: "imsi-001010123456789",
      imei: "4279070000000201",
      // The LMF gives the ID 0 to the location context of the first nr_location_req.
      correlation_id: 0,
      lpp_methods: ["nr_tdoa",],
      report_type: "once"
    },
  ],
