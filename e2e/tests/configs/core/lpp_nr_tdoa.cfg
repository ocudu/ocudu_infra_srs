  // UE-assisted NR DL-TDOA over LPP.
  // The sim events start the NRPPa TRP Information Exchange and the LPP procedures.
  lmf_cfg: {
    lpp_test: true,
    autonomous_mode: false,
    // The gNB ID is the Retina default, 411.
    ran_node_id_list: [{gnb: {plmn: "00101", gnb_id_bits: 32, gnb_id: 0x19b}}],
    lpp_methods: ["nr_tdoa",],
  },
