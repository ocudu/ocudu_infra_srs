/* ETWS/CMAS message that can be triggered live at runtime with the pws_write
   remote API. Explicitly scoped to the gNB's own tracking area (see cu_cp.yml's supported_tracking_areas) rather than left area-less.

   warning_message uses the maximum of 15 pages, each padded to the maximum
   93 GSM 7-bit characters per page (3GPP TS 23.041), to exercise the largest
   possible number of CB segments the gNB has to broadcast/reassemble.
*/
pws_msgs: [
  {
    local_identifier: 2,
    message_identifier: 0x1104, /* ETWS CBS ID for other emergency types */
    serial_number: 0x3001,
    warning_type: 0x0980, /* Other warning type, user alert, popup */
    warning_message: [
      "PAGE 01/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
      "PAGE 02/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
      "PAGE 03/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
      "PAGE 04/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
      "PAGE 05/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
      "PAGE 06/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
      "PAGE 07/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
      "PAGE 08/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
      "PAGE 09/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
      "PAGE 10/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
      "PAGE 11/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
      "PAGE 12/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
      "PAGE 13/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
      "PAGE 14/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
      "PAGE 15/15: This is a maximum-length ETWS warning message segment used for CBS segmentation t",
    ],
    warning_area_list_5gs: {
      tai_list: [{ plmn: "00101", tac: 7 }],
    },
  },
],

/* Trigger the broadcast over NGAP (Write-Replace Warning Request) mid-session,
   as a Cell Broadcast Centre would - instead of a static gNB SIB config.
*/
sim_events: [
  {
    start_time: 13.0,
    event: "pws_write",
    local_id: 2,
  },
],
