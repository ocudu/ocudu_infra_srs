{%- set integrity_protection = integrity_protection | default("disabled") %}
{%- set confidentiality_protection = confidentiality_protection | default("disabled") %}
{%- set subnet_prefix = subnet_prefix | default("10.45") %}


  plmn: "00101",

  ims_vops_eps: true, /* IMS supported */
  ims_vops_5gs_3gpp: true, /* IMS supported */
  ims_vops_5gs_n3gpp: true, /* IMS supported */
  emc: 3, /* Emergency service supported for 3GPP and non-3GPP access (5GS network feature support IE) */
  emergency_number_list: [
      /* Category bits: (Table 10.5.135d/3GPP TS 24.008)
         Bit 1 Police
         Bit 2 Ambulance
         Bit 3 Fire Brigade
         Bit 4 Marine Guard
         Bit 5 Mountain Rescue
      */
    { category: 0x1f, digits: "911" },
    { category: 0x1f, digits: "112" },
  ],

  /* Control Plane Cellular IoT EPS optimization support */
  cp_ciot_opt: true,

  /* DCNR support */
  dcnr_support: true,

  eps_5gs_interworking: "with_n26",

  /* 15 bearers support */
  fifteen_bearers: false,

  /* Enable RRC Inactive */
  cn_assistance_info_support: true,

  /* UE capabilities */
  edrx: true,

  /* AMF slices configuration */
  nssai: [
   {
    sst: 1,
    sd: 1,
   },
   {
    sst: 2,
    sd: 42,
   }
  ],

  /* Public Data Networks. The first one is the default. */
  pdn_list: [
    {
      pdn_type: "ipv4",
      access_point_name: "{{apn}}",
      first_ip_addr: "192.168.3.2",
      last_ip_addr: "192.168.10.254",
      dns_addr: "8.8.8.8", /* Google DNS address */

      integrity_protection: "{{integrity_protection}}",
      confidentiality_protection: "{{confidentiality_protection}}",

      erabs: [
        {
          qci: 9,
          priority_level: 15,
          pre_emption_capability: "shall_not_trigger_pre_emption",
          pre_emption_vulnerability: "not_pre_emptable",
        },
        {
          qci: 1,
          gbr: {
             maximum_bitrate_dl: 10000000,
            guaranteed_bitrate_dl: 1000000,
             maximum_bitrate_ul: 10000000,
            guaranteed_bitrate_ul: 1000000,
          },
          filters: [{
            direction: "both",
            id: 1,
            precedence: 1,
            components: [{"remote_port": 3001}],
          }],
          priority_level: 10,
          pre_emption_capability: "shall_not_trigger_pre_emption",
          pre_emption_vulnerability: "not_pre_emptable",
          setup_type: "on_demand",
          on_demand_timeout: 100,
        },
        {
          qci: 2,
          gbr: {
            maximum_bitrate_dl: 10000000,
            guaranteed_bitrate_dl: 1000000,
            maximum_bitrate_ul: 10000000,
            guaranteed_bitrate_ul: 1000000,
          },
          filters: [{
            direction: "both",
            id: 2,
            precedence: 2,
            components: [{"remote_port": 3002}],
          }],
          priority_level: 10,
          pre_emption_capability: "shall_not_trigger_pre_emption",
          pre_emption_vulnerability: "not_pre_emptable",
          setup_type: "on_demand",
          on_demand_timeout: 100,
        },
      ],
    },
    {
      pdn_type: "ipv4",
      access_point_name: "ntn-{{apn}}",
      ip_addr_config: "{{apn}}",
      dns_addr: "8.8.8.8", /* Google DNS address */
      erabs: [
        {
          qci: 10,
          priority_level: 15,
          pre_emption_capability: "shall_not_trigger_pre_emption",
          pre_emption_vulnerability: "not_pre_emptable",
        },
      ],
    },
    {
      access_point_name: "ims",
      pdn_type: "ipv4",
      first_ip_addr: "{{subnet_prefix}}.4.2",
      last_ip_addr: "{{subnet_prefix}}.4.254",
      p_cscf_addr: "{{subnet_prefix}}.4.1",
      dns_addr: "8.8.8.8", /* Google DNS address */
      erabs: [
        {
          qci: 5,
          priority_level: 15,
          pre_emption_capability: "shall_not_trigger_pre_emption",
          pre_emption_vulnerability: "not_pre_emptable",
        },
      ], /* erabs */
    },
    {
      access_point_name: "sos",
      emergency: true, /* Identifies this PDN as the one used for emergency calls */
      pdn_type: "ipv4",
      first_ip_addr: "{{subnet_prefix}}.5.2",
      last_ip_addr: "{{subnet_prefix}}.5.254",
      p_cscf_addr: "{{subnet_prefix}}.4.1",
      dns_addr: "8.8.8.8", /* Google DNS address */
      erabs: [
        {
          qci: 5,
          priority_level: 1, /* Highest ARP priority so emergency bearers pre-empt regular traffic */
          pre_emption_capability: "may_trigger_pre_emption",
          pre_emption_vulnerability: "not_pre_emptable",
        },
      ], /* erabs */
    },
  ],

  /* NAS ciphering algorithm preference. EEA0 is always the last. */
  nas_cipher_algo_pref: [ ],
  /* NAS integrity algorithm preference. EIA0 is always the last. */
  nas_integ_algo_pref: [ 2, 1 ],

  /* user data base */
  ue_db: [
    {
      sim_algo: "xor", /* USIM authentication algorithm: xor, milenage or tuak */
      imsi: "001010123456789", /* Amarisoft or Anritsu Test USIM */
      amf: 0x9001, /* Authentication Management Field */
      sqn: "000000000000", /* Sequence Number */
      K: "00112233445566778899aabbccddeeff", /* Amarisoft or Anritsu Test USIM */
      multi_sim: true,
      count: 1000,
    },
  ],
