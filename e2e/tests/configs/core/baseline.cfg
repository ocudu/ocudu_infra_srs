  plmn: "00101",

  /* Control Plane Cellular IoT EPS optimization support */
  cp_ciot_opt: true,

  /* DCNR support */
  dcnr_support: true,

  eps_5gs_interworking: "with_n26",

  /* 15 bearers support */
  fifteen_bearers: false,

  /* Enable RRC Inactive */
//  cn_assistance_info_support: true,

  /* AMF slices configuration */
  nssai: [
   {
    sst: 1,
    sd: 1,
   },
   {
    sst: 2,
    sd: 42,
   }
  ],

  /* Public Data Networks. The first one is the default. */
  pdn_list: [
    {
      pdn_type: "ipv4",
      access_point_name: "srsapn",
      first_ip_addr: "192.168.3.2",
      last_ip_addr: "192.168.3.254",
      ip_addr_shift: 2, /* difference between allocated IP addresses is 4 */
      dns_addr: "8.8.8.8", /* Google DNS address */

      erabs: [
        {
          qci: 9,
          priority_level: 15,
          pre_emption_capability: "shall_not_trigger_pre_emption",
          pre_emption_vulnerability: "not_pre_emptable",
        },
        {
          qci: 1,
	        gbr: {
 	  	      maximum_bitrate_dl: 10000000,
	          guaranteed_bitrate_dl: 1000000,
 	  	      maximum_bitrate_ul: 10000000,
	          guaranteed_bitrate_ul: 1000000,
	        },
          filters: [{
            direction: "both",
            id: 1,
            precedence: 1,
            components: [{"remote_port": 3001}],
          }],
          priority_level: 10,
          pre_emption_capability: "shall_not_trigger_pre_emption",
          pre_emption_vulnerability: "not_pre_emptable",
          setup_type: "on_demand",
          on_demand_timeout: 100,
        },
        {
          qci: 2,
	        gbr: {
            maximum_bitrate_dl: 10000000,
            guaranteed_bitrate_dl: 1000000,
            maximum_bitrate_ul: 10000000,
            guaranteed_bitrate_ul: 1000000,
	        },
          filters: [{
            direction: "both",
            id: 1,
            precedence: 1,
            components: [{"remote_port": 3002}],
          }],
          priority_level: 10,
          pre_emption_capability: "shall_not_trigger_pre_emption",
          pre_emption_vulnerability: "not_pre_emptable",
          setup_type: "on_demand",
          on_demand_timeout: 100,
        },
      ],
    },
    {
      /* Some UE requires a specific PDN for data access */
      pdn_type: "ipv4",
      access_point_name: "internet",
      first_ip_addr: "192.168.4.2",
      last_ip_addr: "192.168.4.254",
      ip_addr_shift: 2,
      dns_addr: "8.8.8.8", /* Google DNS address */
      erabs: [
        {
          qci: 9,
          priority_level: 15,
          pre_emption_capability: "shall_not_trigger_pre_emption",
          pre_emption_vulnerability: "not_pre_emptable",
        },
      ],
      slices: [
      {
       snssai: {
        sst: 1,
        sd: 1,
       },
       qos_flows: [
        {
         "5qi": 9,
          priority_level: 9,
          pre_emption_capability: "shall_not_trigger_pre_emption",
          pre_emption_vulnerability: "not_pre_emptable",
        },
       ],
      },
      {
       snssai: {
        sst: 2,
        sd: 42,
       },
       qos_flows: [
        {
         "5qi": 9,
          priority_level: 8,
          pre_emption_capability: "shall_not_trigger_pre_emption",
          pre_emption_vulnerability: "not_pre_emptable",
        },
       ],
      }
     ],
    },
    {
      pdn_type: "ipv4",
      access_point_name: "ntn-internet",
      ip_addr_config: "internet",
      dns_addr: "8.8.8.8", /* Google DNS address */
      erabs: [
        {
          qci: 10,
          priority_level: 15,
          pre_emption_capability: "shall_not_trigger_pre_emption",
          pre_emption_vulnerability: "not_pre_emptable",
        },
      ],
    },
  ],

  /* NAS ciphering algorithm preference. EEA0 is always the last. */
  nas_cipher_algo_pref: [ ],
  /* NAS integrity algorithm preference. EIA0 is always the last. */
  nas_integ_algo_pref: [ 2, 1 ],

  /* user data base */
  ue_db: [
    { 
      sim_algo: "xor", /* USIM authentication algorithm: xor, milenage or tuak */
      imsi: "001010123456789", /* Amarisoft or Anritsu Test USIM */
      amf: 0x9001, /* Authentication Management Field */
      sqn: "000000000000", /* Sequence Number */
      K: "00112233445566778899aabbccddeeff", /* Amarisoft or Anritsu Test USIM */
      multi_sim: true,
      count: 1000,
    },
  ],

