/* CMAS message that can be triggered live at runtime with the pws_write
   remote API. Explicitly scoped to the gNB's own tracking area (see cu_cp.yml's supported_tracking_areas) rather than left area-less.
*/
pws_msgs: [
  {
    local_identifier: 1,
    message_identifier: 0x1112, /* CMAS Presidential Level Alert (3GPP TS 23.041 table 9.4.1.2.2-1) */
    serial_number: 0x3005,
    warning_message: ["CMAS message triggered from MME"], /* mandatory for CMAS, unlike ETWS */
    warning_area_list_5gs: {
      tai_list: [{ plmn: "00101", tac: 7 }],
    },
  },
],

/* Trigger the broadcast over NGAP (Write-Replace Warning Request) mid-session,
   as a Cell Broadcast Centre would - instead of a static gNB SIB config.
*/
sim_events: [
  {
    start_time: 13.0,
    event: "pws_write",
    local_id: 1,
  },
],
