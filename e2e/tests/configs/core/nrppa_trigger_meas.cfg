  // These times are relative to the core process start, while the network is brought up as
  // 5GC -> gNB -> UE. trp_information_req only needs the NG connection, but nr_location_req needs
  // the UE registered: fired earlier the LMF has no UE context, drops it silently and never sends
  // the E-CID Measurement Initiation Request. Keep it well inside the UE's connected window, which
  // ends at UE-time traffic_duration+1 (see handover.cfg) and is dilated by the runner's real-time
  // factor.
  sim_events: [
    {
      start_time: 15.0,
      event: "trp_information_req",
    },
    {
      start_time: 25.0,
      event: "nr_location_req",
      supi: "imsi-001010123456789",
      pei: "imeisv-4279070000000201"
    },
  ],
