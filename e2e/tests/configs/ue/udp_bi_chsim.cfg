{%- set base_power_on_time = base_power_on_time | default(0) %}
{%- set staggered_traffic_start = staggered_traffic_start | default(false) %}
{%- set traffic_stop_to_dereg_delay = traffic_stop_to_dereg_delay | default(20) %}
{%- set dereg_to_pw_off_delay = dereg_to_pw_off_delay | default(5) %}
{%- set quit_delay = quit_delay | default(5) %}
{%- set as_release = as_release | default(15) %}
{%- set nof_ue = nof_ue | default(1) %}
{%- set test_duration = test_duration | default(10) %}
{%- set dl_bitrate = dl_bitrate | default(1.0e+6) %}
{%- set ul_bitrate = ul_bitrate | default(1.0e+6) %}
{%- set power_on_to_traffic_delay = 1 if staggered_traffic_start else 10 %}

  ue_list: [
{%- for i in range(nof_ue) %}
    /* UEs idx {{ i + 1 }} */
    {
      sim_algo: "xor",
      imsi: "00{{ 1010123456789 + i }}",
      K: "{{ "%032x" | format(("00112233445566778899aabbccddeeff" | int(base=16)) + i) }}",
      apn: "{{apn}}",
      as_release: {{as_release}},
      ue_category: "nr",
      power_control_enabled: false,
      position: [100, 0],
      speed: 0,
      channel: {
        type: "awgn",
      },

      attach_pdn_type: "ipv4",
      ue_count: 1,
      sim_events: [
        {
          event: "power_on",
          start_time: {{ base_power_on_time + i * 0.1 }},
        },
        {
            start_time: {{ base_power_on_time + i * 0.1 + power_on_to_traffic_delay if staggered_traffic_start else base_power_on_time + nof_ue * 0.1 + power_on_to_traffic_delay }},
            end_time: {{ base_power_on_time + nof_ue * 0.1 + power_on_to_traffic_delay + test_duration }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ dl_bitrate }},
            event: "cbr_recv"
        },
        {
            start_time: {{ base_power_on_time + i * 0.1 + power_on_to_traffic_delay if staggered_traffic_start else base_power_on_time + nof_ue * 0.1 + power_on_to_traffic_delay }},
            end_time: {{ base_power_on_time + nof_ue * 0.1 + power_on_to_traffic_delay + test_duration }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ ul_bitrate }},
            event: "cbr_send"
        },
        {
          event: "deregister",
          start_time: {{ base_power_on_time + nof_ue * 0.1 + power_on_to_traffic_delay + test_duration + traffic_stop_to_dereg_delay + i * 0.1 }},
        },
        {
          event: "power_off",
          start_time: {{ base_power_on_time + nof_ue * 0.1 + power_on_to_traffic_delay + test_duration + traffic_stop_to_dereg_delay + i * 0.1 + dereg_to_pw_off_delay }},
        },
{%- if i == nof_ue - 1 %}
        {
          event: "quit",
          start_time: {{ base_power_on_time + nof_ue * 0.1 + power_on_to_traffic_delay + test_duration + traffic_stop_to_dereg_delay + i * 0.1 + dereg_to_pw_off_delay + quit_delay }},
        },
{%- endif %}
      ]
    },
{%- endfor %}

  ]
