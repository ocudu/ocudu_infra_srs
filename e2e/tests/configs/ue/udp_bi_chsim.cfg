{%- set caps = caps | default(20) %}
{%- set nof_ue = nof_ue | default(1) %}
{%- set test_duration = test_duration | default(10) %}

caps: {{caps}},

ue_list: [
  {
    ue_count: {{nof_ue}},
    imsi: "001010123456789",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    attach_pdn_type: "ipv4",
    apn: "{{apn}}",
    as_release: 15,
    ue_category: "nr",
    power_control_enabled: false,
    position: [100, 0],
    speed: 0,
    channel: {
      type: "awgn",
    },
    sim_events: [
      {% if nof_ue == 1 %}
      {
        start_time: 0,
        event: "power_on"
      },
      {% endif %}
      {
        start_time: {{nof_ue/caps}},
        end_time: {{nof_ue/caps+test_duration}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate: {{dl_bitrate}},
        event: "cbr_recv"
      },
      {
        start_time: {{nof_ue/caps}},
        end_time: {{nof_ue/caps+test_duration}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate:  {{ul_bitrate}},
        event: "cbr_send"
      },
      {
        start_time: {{nof_ue/caps+test_duration+1}},
        event: "deregister"
      },
      {
        start_time: {{nof_ue/caps+test_duration+2}},
        event: "power_off"
      },
      {
        start_time: {{nof_ue/caps+test_duration+3}},
        event: "quit"
      }
    ],
  },
],
