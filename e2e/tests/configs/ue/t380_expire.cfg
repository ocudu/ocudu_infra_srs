{%- set caps = caps | default(20) %}
{%- set nof_ue = nof_ue | default(1) %}

  ue_list: [
  {
    "ue_count": 1,
    "imsi": "001010123456789",
    "imeisv": "4279070000000101",
    "sim_algo": "xor",
    "channel_sim": false,
    "K": "00112233445566778899aabbccddeeff",
    "apn": "{{apn}}",
    "attach_pdn_type": "ipv4",
    "spec_tolerance": false,
    "as_release": 15,
    "ue_category": "nr",
    "sim_events": [


			{% if quit_on_start %}
			{
			"start_time": 1,
			"event": "quit"
			},
			{% endif %}

      {
        "start_time": 0,
        "event": "power_on"
      },
       {
         "start_time": 0.5,
         "start_delay": 4,
         "end_time": 5,
         dst_addr: "192.168.3.1",
         payload_len: 1000,
         delay: 1,
         event: "ping"
       },
       //wait for t380
      {
        "start_time": 6,
        "event": "power_off"
      },
      {
        "start_time": 7,
        "event": "quit"
      },
    ]
  },
],