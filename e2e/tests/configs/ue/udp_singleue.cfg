{%- set traffic_duration = traffic_duration | default(10) %}
{%- set dl_bitrate = dl_bitrate | default(1.0e+6) %}
{%- set ul_bitrate = ul_bitrate | default(1.0e+6) %}
{%- set nr_max_mimo_layers_dl = nr_max_mimo_layers_dl | default(0) %}
{%- set nr_max_mimo_layers_ul = nr_max_mimo_layers_ul | default(0) %}

ue_list: [
  {
    ue_count: 1,
    imsi: "001010123456789",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    attach_pdn_type: "ipv4",
    apn: "{{apn}}",
    as_release: 15,
    ue_category: "nr",
    {%- if nr_max_mimo_layers_dl != 0 %}
    nr_max_mimo_layers_dl: {{nr_max_mimo_layers_dl}},
    {%- endif %}
    {%- if nr_max_mimo_layers_ul != 0 %}
    nr_max_mimo_layers_ul: {{nr_max_mimo_layers_ul}},
    {%- endif %}
    sim_events: [
      {
        start_time: 0.25,
        event: "power_on"
      },
{%- if dl_bitrate > 0 %}
      {
        start_time: 0.5,
        end_time: {{0.5 + traffic_duration}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate: {{dl_bitrate}},
        event: "cbr_recv"
      },
{%- endif %}
{%- if ul_bitrate > 0 %}
      {
        start_time: 0.5,
        end_time: {{0.5 + traffic_duration}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate:  {{ul_bitrate}},
        event: "cbr_send"
      },
{%- endif %}
      {
        start_time: {{0.5 + traffic_duration + 1}},
        event: "deregister"
      },
      {
        start_time: {{0.5 + traffic_duration + 2}},
        event: "power_off"
      },
      {
        start_time: {{0.5 + traffic_duration + 3}},
        event: "quit"
      }
    ],
  },
],
