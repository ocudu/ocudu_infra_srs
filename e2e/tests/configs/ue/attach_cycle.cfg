{%- set caps = caps | default(20) %}
{%- set nof_ue = nof_ue | default(1) %}
{%- set nof_cycles = nof_cycles | default(5) %}

caps: {{caps}},

ue_list: [
  {
    ue_count: {{nof_ue}},
    imsi: "001010123456789",
    imeisv: "4279070000000101",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    as_release: 15,
    ue_category: "nr",
    power_control_enabled: false,
    channel: {
      type: "awgn",
    },
    position: [50, 0],
    speed: 0,
    sim_events_loop_count: {{nof_cycles-1}},
    sim_events_loop_delay: 6,
    sim_events: [
      {
        start_time: 0,
        event: "power_on"
      },
      {
        start_time: 0.5,
        end_time: 3,
        dst_addr: "192.168.3.1",
        payload_len: 1000,
        delay: 1,
        event: "ping"
      },
      {
        start_time: 4,
        event: "deregister"
      },
      {
        start_time: 5,
        event: "power_off"
      },
      {
        start_time: {{nof_cycles*6+1}},
        event: "quit"
      }
    ]
  },
]
