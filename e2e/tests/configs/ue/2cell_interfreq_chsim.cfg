{%- set band = band | default(78) %}
{%- set bandwidth = bandwidth | default(100) %}
{%- set dl_nr_arfcn = dl_nr_arfcn | default(626668) %}
{%- set ssb_nr_arfcn = ssb_nr_arfcn | default(624000) %}
{%- set common_scs = 30 %} # no default
{%- set band_2 = band_2 | default(band) %}
{%- set bandwidth_2 = bandwidth_2 | default(bandwidth) %}
{%- set dl_nr_arfcn_2 = dl_nr_arfcn_2 | default(dl_nr_arfcn) %}
{%- set ssb_nr_arfcn_2 = ssb_nr_arfcn_2 | default(ssb_nr_arfcn) %}
{%- set common_scs_2 = common_scs_2 | default(common_scs) %}

cell_groups: [
  {
    group_type: "nr",
    multi_ue: true,
    channel_sim: true,
    delay_sim: true,

    cells: [
      {
        rf_port: 0,
        {{cell_ru_cfg}},
        bandwidth: 100,
        global_timing_advance: -1,
        band: {{band}},
        bandwidth: {{bandwidth}},
        dl_nr_arfcn: {{dl_nr_arfcn}},
        ssb_nr_arfcn: {{ssb_nr_arfcn}},
        subcarrier_spacing: {{common_scs}},
        ssb_subcarrier_spacing: {{common_scs}},
        n_antenna_dl: {{nof_antennas_dl}},
        n_antenna_ul: {{nof_antennas_ul}},
        ref_signal_power: -16,
        position: [-50, 0],
        ul_power_attenuation: 40,
        antenna: {
          type: "isotropic",
        }
      },
      {
        rf_port: 1,
        {{cell_ru_cfg}},
        bandwidth: 100,
        global_timing_advance: -1,
        band: {{band_2}},
        bandwidth: {{bandwidth_2}},
        dl_nr_arfcn: {{dl_nr_arfcn_2}},
        ssb_nr_arfcn: {{ssb_nr_arfcn_2}},
        subcarrier_spacing: {{common_scs_2}},
        ssb_subcarrier_spacing: {{common_scs_2}},
        n_antenna_dl: {{nof_antennas_dl}},
        n_antenna_ul: {{nof_antennas_ul}},
        position: [50, 0],
        ref_signal_power: -16,
        ul_power_attenuation: 40,
        antenna: {
          type: "isotropic",
        },
      }
    ],

    /* In case your system has a high SNR and you are running high number of
    * UEs, enable this option to optimize PDCCH decoding and save CPU
    */
    pdcch_decode_opt: false,
    pdcch_decode_opt_threshold: 0.7,
  }
],
