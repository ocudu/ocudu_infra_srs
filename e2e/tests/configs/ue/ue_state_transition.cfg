// -----------------------------------------------------------------------------
// UE state transition (attach/detach) UE simulator config.
//
// A number of UEs ("nof_ue") attach one after another, every
// "power_on_stagger_delay" seconds. Immediately after powering on, each UE
// runs bidirectional UDP traffic for "attach_dettach_delay" seconds,
// deregisters and powers off.
// Each UE repeats this power on -> traffic -> deregister -> power off cycle
// "nof_attach_dettach_cycles" times, using the "sim_events_loop_*" fields.
// Used to stress-test the attach/detach rate of the SUT.
// -----------------------------------------------------------------------------

{%- set nof_ue = nof_ue | default(1) %}
{%- set dl_bitrate = dl_bitrate | default(1.0e+6) %}
{%- set ul_bitrate = ul_bitrate | default(1.0e+6) %}
{%- set nof_attach_dettach_cycles = nof_attach_dettach_cycles | default(1) %}
{%- set attach_dettach_delay = attach_dettach_delay | default(1) %}
{%- set power_on_stagger_delay = power_on_stagger_delay | default(0.1) %}

// One full attach/detach cycle takes this many seconds: traffic, then
// deregister, then power off, then a short pause before powering back on.
{%- set cycle_delay = attach_dettach_delay + 0.5 + 0.5 + 1 %}

// Time at which the whole simulation is done and the simulator can quit:
// last UE powers on, then runs all its attach/detach cycles, plus a final
// grace delay.
{%- set quit_time = nof_ue * power_on_stagger_delay + nof_attach_dettach_cycles * cycle_delay + 5 %}

  ue_list: [

{%- for i in range(nof_ue) %}
{%- set power_on_time = i * power_on_stagger_delay %}
{%- set traffic_end_time = power_on_time + attach_dettach_delay %}
{%- set dereg_time = traffic_end_time + 0.5 %}
{%- set poweroff_time = dereg_time + 0.5 %}

    /* UE idx {{ i + 1 }} (repeats {{ nof_attach_dettach_cycles }} cycles) */
    {
      sim_algo: "xor",
      imsi: "00{{ 1010123456789 + i }}",
      K: "{{ "%032x" | format(("00112233445566778899aabbccddeeff" | int(base=16)) + i) }}",
      apn: "{{apn}}",
      as_release: 17,
      ue_category: "nr",
      power_control_enabled: false,
      position: [100, 0],
      speed: 0,
      channel: {
        type: "awgn",
      },
      sim_events_loop_count: {{nof_attach_dettach_cycles - 1}},
      sim_events_loop_delay: {{cycle_delay}},
      attach_pdn_type: "ipv4",
      ue_count: 1,
      sim_events: [
        {
          event: "power_on",
          start_time: {{ power_on_time }},
        },
        {
            start_time: {{ power_on_time }},
            end_time:   {{ traffic_end_time }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ dl_bitrate }},
            event: "cbr_recv"
        },
        {
            start_time: {{ power_on_time }},
            end_time:   {{ traffic_end_time }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ ul_bitrate }},
            event: "cbr_send"
        },
        {
          event: "deregister",
          start_time: {{ dereg_time }},
        },
        {
          event: "power_off",
          start_time: {{ poweroff_time }},
        },
{%- if i == nof_ue - 1 %}
        {
          event: "quit",
          start_time: {{ quit_time }},
        },
{%- endif %}
      ]
    },
{%- endfor %}

  ]
