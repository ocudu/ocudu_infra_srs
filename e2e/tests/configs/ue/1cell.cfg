{%- set band = band | default(78) %}
{%- set bandwidth = bandwidth | default(100) %}
{%- set dl_nr_arfcn = dl_nr_arfcn | default(626668) %}
{%- set ssb_nr_arfcn = ssb_nr_arfcn | default(624000) %}
{%- set common_scs = common_scs | default(30) %}
{%- set pdcch_decode_threshold = pdcch_decode_threshold | default(0.7) %}

cell_groups: [
  {
    group_type: "nr",
    multi_ue: true,
    cells: [
      {
        rf_port: 0,
        {{cell_ru_cfg}},
        band: {{band}},
        bandwidth: {{bandwidth}},
        dl_nr_arfcn: {{dl_nr_arfcn}},
        ssb_nr_arfcn: {{ssb_nr_arfcn}},
        subcarrier_spacing: {{common_scs}},
        ssb_subcarrier_spacing: {{common_scs}},
        n_antenna_dl: {{nof_antennas_dl}},
        n_antenna_ul: {{nof_antennas_ul}},
        global_timing_advance: -1,
      },
    ],

    // PDCCH fine tuning: Ignore candidates with less power than threshold (relative to SSB) to avoid false-positive phantoms and save CPU power.
    pdcch_decode_opt: true,
    pdcch_decode_opt_threshold: {{pdcch_decode_threshold}},
  },
],
