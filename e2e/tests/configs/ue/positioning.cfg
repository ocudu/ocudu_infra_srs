// One UE at a fixed position.
// The UE stays connected for 40 s.

caps: 20,

ue_list: [
  {
    ue_count: 1,
    imsi: "001010123456789",
    imeisv: "4279070000000201",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    // NR positioning over LPP requires Rel-16.
    as_release: 16,
    ue_category: "nr",
    channel: {
      type: "awgn",
    },
    position: [20, 0],
    speed: 0,
    sim_events: [
      {
        start_time: 0,
        event: "power_on"
      },
      {
        start_time: 0.1,
        end_time: 40,
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate: 1.0e+6,
        event: "cbr_recv"
      },
      {
        start_time: 0.1,
        end_time: 40,
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate: 1.0e+6,
        event: "cbr_send"
      },
      {
        start_time: 41,
        event: "deregister"
      },
      {
        start_time: 42,
        event: "power_off"
      },
      {
        start_time: 43,
        event: "quit"
      }
    ]
  }
]
