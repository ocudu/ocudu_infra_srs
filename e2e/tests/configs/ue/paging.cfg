{%- set dl_bitrate = dl_bitrate | default(1.0e+6) %}
{%- set nof_paging = nof_paging | default(1) %}

ue_list: [
  {
    ue_count: 1,
    imsi: "001010123456789",
    imeisv: "4279070000000101",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    rrc_inactive_support: true,
    as_release: 15,
    ue_category: "nr",
    sim_events_loop_count: {{nof_paging-1}},
    sim_events_loop_delay: 5,
    sim_events: [
      {
        start_time: {{start_time}},
        event: "power_on"
      },
      {
        start_time: {{start_time + 0.5}},
        start_delay: 2,
        end_time: {{start_time + 3}},
        dst_addr: "192.168.3.1",
        event: "cbr_recv",
        type: "udp",
        bit_rate: {{dl_bitrate}},
        payload_len: 1400,
      },
      {
        start_time: {{start_time + nof_paging*5 + 2}},
        event: "deregister"
      },
      {
        start_time: {{start_time + nof_paging*5 + 3}},
        event: "power_off"
      },
      {
        start_time: {{start_time + nof_paging*5 + 4}},
        event: "quit"
      },
    ]
  },
],
