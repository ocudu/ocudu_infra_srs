ue_list: [
  {
    ue_count: 1,
    imsi: "001010123456789",
    imeisv: "4279070000000201",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    as_release: 15,
    ue_category: "nr",
    sim_events: [
      {
        event: "power_on",
        start_time: 0,
      },
      // Regular non-emergency background traffic, representing an ongoing session
      // on the cell while the emergency call below is placed.
      {
        start_time: 1,
        end_time: 10,
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate: 10.0e+6,
        event: "cbr_recv"
      },
      // Place the emergency call: request the network-identified emergency PDN
      // (e.g. dialing 911/112), independently of the default APN already in use.
      {
        start_time: 2,
        event: "pdn_connect",
        emergency: true,
      },
      {
        start_time: 8,
        event: "pdn_disconnect",
        emergency: true,
      },
      {
        start_time: 11,
        event: "deregister"
      },
      {
        start_time: 12,
        event: "power_off"
      },
      {
        start_time: 13,
        event: "quit"
      }
    ]
  },
],
