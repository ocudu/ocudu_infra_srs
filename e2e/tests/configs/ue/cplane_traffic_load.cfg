// -----------------------------------------------------------------------------
// Control plane traffic load UE simulator config.
//
// Two groups of UEs power on one after another (each UE staggered every
// "power_on_stagger_delay" seconds within its own group; the cycling group
// only starts powering on once the whole static group has powered on) and
// start bidirectional UDP traffic:
//
// - "static" group ("nof_ue_static" UEs): stays attached and keeps running
//   traffic for the whole test, exactly like udp_multiue.cfg. This group
//   anchors the test's overall duration ("traffic_duration").
// - "cycling" group ("nof_ue_cycling" UEs): once connected, repeatedly runs
//   traffic for "cycle_traffic_duration" seconds, deregisters, powers off,
//   waits "cycle_off_duration" seconds and powers back on (using
//   "sim_events_loop_*"), stressing the control plane while the static group
//   keeps the u-plane busy. The number of cycles isn't a direct input - it's
//   derived from how much of "traffic_duration" is left once the cycling
//   group's last UE powers on, so it finishes at or before the static group
//   (floored to 1 cycle if the population is too large to fit even that).
// -----------------------------------------------------------------------------

{%- set nof_ue_static = nof_ue_static | default(1) %}
{%- set nof_ue_cycling = nof_ue_cycling | default(1) %}
{%- set traffic_duration = traffic_duration | default(60) %}
{%- set dl_bitrate = dl_bitrate | default(1.0e+6) %}
{%- set ul_bitrate = ul_bitrate | default(1.0e+6) %}
{%- set power_on_stagger_delay = power_on_stagger_delay | default(0.1) %}
{%- set cycle_traffic_duration = cycle_traffic_duration | default(10) %}
{%- set cycle_off_duration = cycle_off_duration | default(10) %}

// One full attach/detach cycle takes this many seconds: traffic, then
// deregister, then power off, then the requested off/wait time before the
// next power on.
{%- set cycle_delay = cycle_traffic_duration + 0.5 + 0.5 + cycle_off_duration %}

// Group start times: the cycling group only starts powering on once the
// whole static group has powered on (sequential group startup).
{%- set static_group_start = 0.5 %}
{%- set cycling_group_start = static_group_start + nof_ue_static * power_on_stagger_delay %}

// Time at which the static group finishes: last UE of the group powers on,
// then runs traffic for "traffic_duration". Every other group's own
// duration/cycle count is derived against this point.
{%- set static_end_time = static_group_start + (nof_ue_static - 1) * power_on_stagger_delay + traffic_duration %}

// Number of attach/detach cycles per cycling UE: as many as fit in the
// static group's remaining window by the time the cycling group's last UE
// powers on, floored to 1.
{%- set cycling_last_ue_start = cycling_group_start + (nof_ue_cycling - 1) * power_on_stagger_delay %}
{%- set nof_cycles = ([((static_end_time - cycling_last_ue_start) / cycle_delay) | int, 1]) | max %}

// Time at which the cycling group finishes: last UE of the group powers on,
// then repeats its attach/detach cycle "nof_cycles" times.
{%- set cycling_end_time = cycling_last_ue_start + nof_cycles * cycle_delay if nof_ue_cycling > 0 else 0 %}

// The whole simulation is done and the simulator can quit once both groups
// have finished, plus a final grace delay.
{%- set quit_time = ([static_end_time, cycling_end_time] | max) + 10 %}

// The "quit" event is only emitted once, on the last UE of the last group.
// The static group is expected to finish last (see above), so it's the
// primary pick; cycling is only a fallback for when it's empty.
{%- set last_group = 'static' if nof_ue_static > 0 else 'cycling' %}

  ue_list: [

{%- for i in range(nof_ue_static) %}

{%- set power_on_time = static_group_start + i * power_on_stagger_delay %}
{%- set traffic_end_time = power_on_time + traffic_duration %}

    /* static UE idx {{ i + 1 }} (stays attached for the whole test) */
    {
      sim_algo: "xor",
      imsi: "00{{ 1010123456789 + i }}",
      K: "{{ "%032x" | format(("00112233445566778899aabbccddeeff" | int(base=16)) + i) }}",
      apn: "{{apn}}",
      as_release: 15,
      ue_category: "nr",
      power_control_enabled: false,
      position: [100, 0],
      speed: 0,
      channel: {
        type: "awgn",
      },
      attach_pdn_type: "ipv4",
      ue_count: 1,
      sim_events: [
        {
          event: "power_on",
          start_time: {{ power_on_time }},
        },
        {
            start_time: {{ power_on_time }},
            end_time:   {{ traffic_end_time }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ dl_bitrate }},
            event: "cbr_recv"
        },
        {
            start_time: {{ power_on_time }},
            end_time:   {{ traffic_end_time }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ ul_bitrate }},
            event: "cbr_send"
        },
{%- if last_group == 'static' and i == nof_ue_static - 1 %}
        {
          event: "quit",
          start_time: {{ quit_time }},
        },
{%- endif %}
      ]
    },
{%- endfor %}

{%- for j in range(nof_ue_cycling) %}

{%- set idx = nof_ue_static + j %}
{%- set power_on_time = cycling_group_start + j * power_on_stagger_delay %}
{%- set traffic_end_time = power_on_time + cycle_traffic_duration %}
{%- set dereg_time = traffic_end_time + 0.5 %}
{%- set poweroff_time = dereg_time + 0.5 %}

    /* cycling UE idx {{ j + 1 }} (repeats {{ nof_cycles }} attach/detach cycles) */
    {
      sim_algo: "xor",
      imsi: "00{{ 1010123456789 + idx }}",
      K: "{{ "%032x" | format(("00112233445566778899aabbccddeeff" | int(base=16)) + idx) }}",
      apn: "{{apn}}",
      as_release: 15,
      ue_category: "nr",
      power_control_enabled: false,
      position: [100, 0],
      speed: 0,
      channel: {
        type: "awgn",
      },
      sim_events_loop_count: {{ nof_cycles - 1 }},
      sim_events_loop_delay: {{ cycle_delay }},
      attach_pdn_type: "ipv4",
      ue_count: 1,
      sim_events: [
        {
          event: "power_on",
          start_time: {{ power_on_time }},
        },
        {
            start_time: {{ power_on_time }},
            end_time:   {{ traffic_end_time }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: 1000,
            event: "cbr_recv"
        },
        {
            start_time: {{ power_on_time }},
            end_time:   {{ traffic_end_time }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: 1000,
            event: "cbr_send"
        },
        {
          event: "deregister",
          start_time: {{ dereg_time }},
        },
        {
          event: "power_off",
          start_time: {{ poweroff_time }},
        },
{%- if last_group == 'cycling' and j == nof_ue_cycling - 1 %}
        {
          event: "quit",
          start_time: {{ quit_time }},
        },
{%- endif %}
      ]
    },
{%- endfor %}

  ]
