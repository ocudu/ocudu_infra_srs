{% if satellite == "geo" %}
  {%- set delay_sim = true %}
  {%- set apply_ta_commands = false %}
{% elif satellite == "leo" %}
  {%- set delay_sim = false %}
  {%- set apply_ta_commands = true %}
{% endif %}

cell_groups: [
  {
    group_type: "nr",
    multi_ue: true,
    channel_sim: true,

  {% if satellite %}
    delay_sim: {{delay_sim | lower }},
    ground_position: {
      latitude: {{gp_latitude}},
      longitude: {{gp_longitude}},
      altitude: {{gp_altitude}},
    },
  {% endif %}
    cells: [
      {
        rf_port: 0,
        {{cell_ru_cfg}},
        band: {{band|default(78)}},
        bandwidth: {{bandwidth|default(100)}},
        dl_nr_arfcn: {{dl_nr_arfcn|default(626668)}},
        ssb_nr_arfcn: {{ssb_nr_arfcn|default(624000)}},
        subcarrier_spacing: {{common_scs|default(30)}},
        ssb_subcarrier_spacing: {{common_scs|default(30)}},
        n_antenna_dl: {{nof_antennas|default(1)}},
        n_antenna_ul: {{nof_antennas|default(1)}},
        global_timing_advance: -1,

      {% if satellite %}
        apply_ta_commands: {{apply_ta_commands | lower}},
      {% if ephemeris_format == "orbital" %}
        ntn_eci_aligned_ecef: true,
      {% endif %} // if ephemeris_format
        // NTN channel emulation.
        antenna: {
          type: "satellite",
          attenuation: "custom",
          attenuation_A: 1,
          attenuation_B: 1,
          ephemeris_from_sib: true,
      {% if feeder_link %}
          feeder_position: {
            latitude: {{fp_latitude}},
            longitude: {{fp_longitude}},
            altitude: {{fp_altitude}},
          },
      {% else %} // if feeder_link
          feeder_mode: "explicit_delay",
          feeder_delay: 0,
      {% endif %} // if satellite
        },
        ref_signal_power: 0,
        ul_power_attenuation: 0,
        position: [0,0,0],
      {% endif %}
      },
    ],

    // PDCCH fine tuning: Ignore candidates with less power than threshold (relative to SSB) to avoid false-positive phantoms and save CPU power.
    pdcch_decode_opt: true,
    pdcch_decode_opt_threshold: {{pdcch_decode_threshold|default(0)}},
  },
],
