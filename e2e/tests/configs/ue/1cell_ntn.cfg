{%- set satellite = satellite | default("") %}
{%- set feeder_link = feeder_link | default(false) %}
{%- set gp_latitude = gp_latitude | default(0) %}
{%- set gp_longitude = gp_longitude | default(0) %}
{%- set gp_altitude = gp_altitude | default(0) %}
{%- set fp_latitude = fp_latitude | default(0) %}
{%- set fp_longitude = fp_longitude | default(0) %}
{%- set fp_altitude = fp_altitude | default(0) %}
{%- set band = band | default(78) %}
{%- set bandwidth = bandwidth | default(100) %}
{%- set common_scs = common_scs | default(30) %}
{%- set dl_nr_arfcn = dl_nr_arfcn | default(626668) %}
{%- set ssb_nr_arfcn = ssb_nr_arfcn | default(624000) %}

{%- set delay_sim = false %}
{%- set apply_ta_commands = true %}
{% if satellite == "geo" %}
  {%- set delay_sim = true %}
  {%- set apply_ta_commands = false %}
{% endif %}

cell_groups: [
  {
    group_type: "nr",
    multi_ue: true,
    channel_sim: true,

  {% if satellite %}
    delay_sim: {{delay_sim | lower }},
    ground_position: {
      latitude: {{gp_latitude}},
      longitude: {{gp_longitude}},
      altitude: {{gp_altitude}},
    },
  {% endif %}
    cells: [
      {
        rf_port: 0,
        {{cell_ru_cfg}},
        band: {{band}},
        bandwidth: {{bandwidth}},
        dl_nr_arfcn: {{dl_nr_arfcn}},
        ssb_nr_arfcn: {{ssb_nr_arfcn}},
        subcarrier_spacing: {{common_scs}},
        ssb_subcarrier_spacing: {{common_scs}},
        n_antenna_dl: {{nof_antennas_dl}},
        n_antenna_ul: {{nof_antennas_ul}},
        global_timing_advance: -1,

      {% if satellite %}
        apply_ta_commands: {{apply_ta_commands | lower}},
        ntn_eci_aligned_ecef: true,
        // NTN channel emulation.
        antenna: {
          type: "satellite",
          attenuation: "custom",
          attenuation_A: 1,
          attenuation_B: 1,
          ephemeris_from_sib: true,
      {% if feeder_link %}
          feeder_position: {
            latitude: {{fp_latitude}},
            longitude: {{fp_longitude}},
            altitude: {{fp_altitude}},
          },
      {% else %} // if feeder_link
          feeder_mode: "explicit_delay",
          feeder_delay: 0,
      {% endif %} // if satellite
        },
        ref_signal_power: 0,
        ul_power_attenuation: 0,
        position: [0,0,0],
      {% endif %}
      },
    ],

    // PDCCH fine tuning: Ignore candidates with less power than threshold (relative to SSB) to avoid false-positive phantoms and save CPU power.
    pdcch_decode_opt: true,
    pdcch_decode_opt_threshold: 0,
  },
],
