{%- set traffic_duration = traffic_duration | default(10) %}
{%- set dl_bitrate = dl_bitrate | default(1.0e+6) %}
{%- set ul_bitrate_sst1 = ul_bitrate_sst1 | default(1.0e+6) %}
{%- set ul_bitrate_sst2 = ul_bitrate_sst2 | default(1.0e+6) %}

ue_list: [
  {
    ue_count: 1,
    imsi: "001010123456789",
    imeisv: "4279070000000201",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    as_release: 15,
    ue_category: "nr",
    position: [0, 0],
    speed: 0,
    channel: {
      type: "awgn"
    },
    sim_events: [
      {
        event: "power_on",
        start_time: 0,
      },
      {
        start_time: 1,
        // work-around to fill DL buffer for non-RT ZMQ tests TODO: fix it in proper way for all tests
        end_time: {{traffic_duration*2}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate: {{dl_bitrate}},
        event: "cbr_recv"
      },
      {
        start_time: 1,
        end_time: {{traffic_duration}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate: {{ul_bitrate_sst1}},
        event: "cbr_send"
      },
      {
        start_time: {{traffic_duration+1}},
        event: "deregister"
      },
      {
        start_time: {{traffic_duration+2}},
        event: "power_off"
      },
      {
        start_time: {{traffic_duration+3}},
        event: "quit"
      }
    ]
  },
  {
    ue_count: 1,
    imsi: "001010123456790",
    imeisv: "4279070000000201",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddef00",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    as_release: 15,
    default_nssai: [{ sst: 2, sd: 0x2a }],
    ue_category: "nr",
    position: [0, 0],
    speed: 0,
    channel: {
      type: "awgn"
    },
    sim_events: [
      {
        event: "power_on",
        start_time: 1,
      },
      {
        event: "power_on",
        start_time: 1,
      },
      {
        start_time: 2,
        end_time: {{traffic_duration*2}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate: {{dl_bitrate}},
        event: "cbr_recv"
      },
      {
        start_time: 2,
        end_time: {{traffic_duration}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate: {{ul_bitrate_sst2}},
        event: "cbr_send"
      },
      {
        start_time: {{traffic_duration+1}},
        event: "deregister"
      },
      {
        start_time: {{traffic_duration+2}},
        event: "power_off"
      },
      {
        start_time: {{traffic_duration+3}},
        event: "quit"
      }
    ]
  },
],
