{%- set caps = caps | default(20) %}
{%- set nof_ue = nof_ue | default(1) %}

ue_list: [
  {
    ue_count: 1,
    imsi: "001010123456789",
    imeisv: "4279070000000101",
    sim_algo: "xor",
    channel_sim: false,
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    as_release: 15,
    ue_category: "nr",
    sim_events_loop_count: {{nof_paging-1}},
    sim_events_loop_delay: 8,
    sim_events: [
      {% if quit_on_start %}
      {
        start_time: 1,
        event: "quit"
      },
      {% endif %}
      {% if nof_ue == 1 %}
      {
        start_time: 0,
        event: "power_on"
      },
      {% endif %}
      {
        start_time: 7,
        end_time: 8,
        dst_addr: "192.168.3.1",
        event: "cbr_recv",
        type: "udp",
        bit_rate: {{dl_bitrate}},
        payload_len: 1400,
      },
      {
        start_time: {{nof_paging*8}},
        event: "power_off"
      },
      {
        start_time: {{nof_paging*8+0.5}},
        event: "quit"
      },
    ]
  },
],
