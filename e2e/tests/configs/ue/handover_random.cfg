{%- set caps = caps | default(20) %}
{%- set nof_ue = nof_ue | default(1) %}

caps: {{caps}},

ue_list: [
{
    ue_count: {{nof_ue}},
    imsi: "001010123456789",
    imeisv: "4279070000000201",
    sim_algo: "xor",
    channel_sim: false,
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    as_release: 15,
    ue_category: "nr",
    channel_sim: true,
    channel: {
        type: "awgn",
    },
    max_distance: 50,
    bounce: "back",
    position: [0, 0],
    speed: 80,
    direction: 0,
    sim_events: [


				{% if quit_on_start %}
				{
				"start_time": 1,
				"event": "quit"
				},
				{% endif %}

				{% if nof_ue == 1 %}
				{
					"start_time": 0,
					"event": "power_on"
				},
				{% endif %}


				{
            start_time: {{nof_ue/caps+1}},
            end_time: {{nof_ue/caps+200}},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{dl_bitrate}},
            event: "cbr_recv"
        },
        {
            start_time: {{nof_ue/caps+1}},
            end_time: {{nof_ue/caps+200}},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ul_bitrate}},
            event: "cbr_send"
        },
        {
            start_time: {{nof_ue/caps+210}},
            event: "power_off"
        },
        {
            start_time: {{nof_ue/caps+211}},
            event: "quit"
        }
    ]
}]

