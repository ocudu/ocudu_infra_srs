{%- set band = band | default(78) %}
{%- set bandwidth = bandwidth | default(100) %}
{%- set dl_nr_arfcn = dl_nr_arfcn | default(626668) %}
{%- set ssb_nr_arfcn = ssb_nr_arfcn | default(624000) %}

{%- set common_scs = 30 %}

cell_groups: [
  {
    group_type: "nr",
    multi_ue: true,

     cells: [
     {
       rf_port: 0,
       {{cell_ru_cfg}},
       band: {{band}},
       bandwidth: {{bandwidth}},
       dl_nr_arfcn: {{dl_nr_arfcn}},
       ssb_nr_arfcn: {{ssb_nr_arfcn}},
       subcarrier_spacing: {{common_scs}},
       ssb_subcarrier_spacing: {{common_scs}},
       n_antenna_dl: {{nof_antennas_dl}},
       n_antenna_ul: {{nof_antennas_ul}},
       global_timing_advance: -1,
       {% if rx_to_tx_latency > -1 %}
       rx_to_tx_latency: {{rx_to_tx_latency}},
       {% endif %}
     },
     {
       rf_port: 1,
       {{cell_ru_cfg}},
       band: {{band}},
       bandwidth: {{bandwidth}},
       dl_nr_arfcn: {{dl_nr_arfcn}},
       ssb_nr_arfcn: {{ssb_nr_arfcn}},
       subcarrier_spacing: {{common_scs}},
       ssb_subcarrier_spacing: {{common_scs}},
       n_antenna_dl: {{nof_antennas_dl}},
       n_antenna_ul: {{nof_antennas_ul}},
       global_timing_advance: -1,
       {% if rx_to_tx_latency > -1 %}
       rx_to_tx_latency: {{rx_to_tx_latency}},
       {% endif %}
     },
     ],

    /* In case your system has a high SNR and you are running high number of
    * UEs, enable this option to optimize PDCCH decoding and save CPU
    */
    pdcch_decode_opt: true,
    pdcch_decode_opt_threshold: 0.7,

  }
],
