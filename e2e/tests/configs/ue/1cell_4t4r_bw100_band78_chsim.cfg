cell_groups: [
    {
        group_type: "nr",
        multi_ue: true,
        channel_sim: true,
        cells: [
            {
                rf_port: 0,
                sample_rate: {{ sample_rate / 1000000 }},
                band: 78,
                bandwidth: 100,
                dl_nr_arfcn: 626668,
                ssb_nr_arfcn: 624000,
                subcarrier_spacing: 30,
                ssb_subcarrier_spacing: 30,
                n_antenna_dl: 4,
                n_antenna_ul: 4,
                global_timing_advance: 0,
                ref_signal_power: -16,
                position: [0, 0],
                ul_power_attenuation: 40,
                antenna: {
                    type: "parabolic_panel",
                    n1: 2,
                    p: 2,
                    orientation: 0,
                }
            },
        ],
        // PDCCH fine tuning: Ignore candidates with less power than threshold (relative to SSB) to avoid false-positive phantoms and save CPU power.
        pdcch_decode_opt: true,
        pdcch_decode_opt_threshold: 0.1,
    },
],
