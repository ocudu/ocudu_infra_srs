{%- set traffic_duration = traffic_duration | default(10) %}
{%- set nof_tcp_connections = nof_tcp_connections | default(10) %}

ue_list: [
  {
    ue_count: 1,
    imsi: "001010123456789",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    attach_pdn_type: "ipv4",
    apn: "{{apn}}",
    as_release: 15,
    ue_category: "nr",
    sim_events: [
      {
        start_time: 0.25,
        event: "power_on"
      },
      {
        start_time: 0.5,
        end_time: {{0.5 + traffic_duration}},
        dst_addr: "192.168.3.1",
        direction: "rx",
        connections: {{nof_tcp_connections}},
        window_size: 10000000,
        event: "tcp"
      },
      {
        start_time: {{0.5 + traffic_duration + 1}},
        event: "deregister"
      },
      {
        start_time: {{0.5 + traffic_duration + 2}},
        event: "power_off"
      },
      {
        start_time: {{0.5 + traffic_duration + 3}},
        event: "quit"
      }
    ],
  },
],
