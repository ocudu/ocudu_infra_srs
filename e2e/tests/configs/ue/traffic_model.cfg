// -----------------------------------------------------------------------------
// Mixed control/user plane traffic model UE simulator config (2-cell testbed).
//
// Five independent UE groups power on one after another, in this order:
// static, paging, tau, cycling, handover. Within each group, UEs are
// staggered every "power_on_stagger_delay" seconds; the next group only
// starts powering on once the whole previous group has powered on. Each
// group stresses a different part of the stack for the whole test:
//
// - "static" group ("nof_ue_static" UEs): stays attached, camped on cell 1,
//   running bidirectional UDP traffic for the whole test, like udp_multiue.cfg.
//   This group is the anchor for the test's overall duration: it's the first
//   to power on and, unlike the other four groups, its activity length
//   ("traffic_duration") is a direct input rather than derived.
// - "paging" group ("nof_ue_paging" UEs): goes RRC_INACTIVE/idle and gets
//   paged by downlink data roughly every "paging_period" seconds, like
//   paging.cfg. The period is jittered per UE (+/- "paging_jitter" seconds,
//   deterministically from the UE index) to approximate random paging times,
//   since the simulator has no native random-time event.
// - "tau" group ("nof_ue_tau" UEs): stays attached, camped on cell 1, and
//   sends a Tracking Area Update request every "tau_period" seconds, like
//   tau_request.cfg.
// - "cycling" group ("nof_ue_cycling" UEs): repeatedly runs traffic, then
//   deregisters, powers off, waits and powers back on, like
//   cplane_traffic_load.cfg's cycling group. The number of cycles is derived
//   (not a direct input), see below.
// - "handover" group ("nof_ue_handover" UEs): bounces back and forth between
//   the two cells while running traffic, triggering repeated handovers, like
//   handover.cfg. Requires a 2-cell gNB config with A3-event-triggered
//   handover enabled (mobility.yml).
//
// Since each group only starts once the previous one has fully powered on,
// paging/tau/cycling/handover all start strictly after the static group. For
// all of them to still finish at or before the static group (so "static" is
// always the last group standing), their own repeat counts/duration aren't
// free inputs: they're derived from how much of the static group's
// "traffic_duration" window is left by the time that group's last UE powers
// on (nof_paging_cycles, nof_tau_updates, nof_cycles, handover's own traffic
// duration). If a group's population is so large relative to
// "traffic_duration" that it can't even fit a single minimal cycle in the
// remaining budget, it's floored to one cycle and may finish slightly after
// the static group - that's an inherent limit of the population/duration
// combination, not tunable further without breaking the group's own
// procedure.
// -----------------------------------------------------------------------------

{%- set nof_ue_static = nof_ue_static | default(1) %}
{%- set nof_ue_cycling = nof_ue_cycling | default(1) %}
{%- set nof_ue_tau = nof_ue_tau | default(1) %}
{%- set nof_ue_paging = nof_ue_paging | default(1) %}
{%- set nof_ue_handover = nof_ue_handover | default(1) %}

{%- set traffic_duration = traffic_duration | default(60) %}
{%- set dl_bitrate = dl_bitrate | default(1.0e+6) %}
{%- set ul_bitrate = ul_bitrate | default(1.0e+6) %}
{%- set power_on_stagger_delay = power_on_stagger_delay | default(0.1) %}

// One full cycling attach/detach cycle takes this many seconds: traffic, then
// deregister, then power off, then the requested off/wait time before the
// next power on.
{%- set cycle_traffic_duration = cycle_traffic_duration | default(10) %}
{%- set cycle_off_duration = cycle_off_duration | default(10) %}
{%- set cycle_delay = cycle_traffic_duration + 0.5 + 0.5 + cycle_off_duration %}

{%- set tau_period = tau_period | default(1) %}

{%- set paging_period = paging_period | default(5) %}
{%- set paging_jitter = 1 %}
{%- set paging_idle_delay = paging_idle_delay | default(2) %}

// Group start times: each group only starts powering on once the whole
// previous group has powered on (sequential group startup).
{%- set static_group_start = 0.5 %}
{%- set paging_group_start = static_group_start + nof_ue_static * power_on_stagger_delay + 2 %}
{%- set tau_group_start = paging_group_start + nof_ue_paging * power_on_stagger_delay + 2 %}
{%- set cycling_group_start = tau_group_start + nof_ue_tau * power_on_stagger_delay + 2 %}
{%- set handover_group_start = cycling_group_start + nof_ue_cycling * power_on_stagger_delay + 2 %}

// Time at which the static group finishes: last UE of the group powers on,
// then runs traffic for "traffic_duration". This is the target every other
// group's own activity length is derived against, so they finish at or
// before this point.
{%- set static_end_time = static_group_start + (nof_ue_static - 1) * power_on_stagger_delay + traffic_duration %}

// Number of suspend/page/resume cycles per paging UE: as many as fit in the
// static group's remaining window (the paging group's own trailing "+4"
// margin, see paging_end_time below), floored to 1.
{%- set paging_last_ue_start = paging_group_start + (nof_ue_paging - 1) * power_on_stagger_delay %}
{%- set nof_paging_cycles = ([((static_end_time - paging_last_ue_start - 4) / paging_period) | int, 1]) | max %}

// Number of TAU requests per UE, spaced "tau_period" seconds apart, sized the
// same way (the TAU group's own trailing margin is "+1", see tau_end_time).
{%- set tau_last_ue_start = tau_group_start + (nof_ue_tau - 1) * power_on_stagger_delay %}
{%- set nof_tau_updates = ([((static_end_time - tau_last_ue_start - 1) / tau_period) | int, 1]) | max %}

// Number of attach/detach cycles per cycling UE, sized the same way.
{%- set cycling_last_ue_start = cycling_group_start + (nof_ue_cycling - 1) * power_on_stagger_delay %}
{%- set nof_cycles = ([((static_end_time - cycling_last_ue_start) / cycle_delay) | int, 1]) | max %}

// The handover group has no "cycle count": it just runs traffic for its own
// duration, sized (instead of reusing "traffic_duration" outright) so it
// finishes at or before the static group, floored to 1s.
{%- set handover_last_ue_start = handover_group_start + (nof_ue_handover - 1) * power_on_stagger_delay %}
{%- set handover_traffic_duration = ([static_end_time - handover_last_ue_start, 1]) | max %}

// Time at which each of the other groups finishes, and the whole simulation
// is done and the simulator can quit: last UE of each group powers on, then
// runs for as long as its derived count/duration dictates, plus a final
// grace delay.
{%- set paging_end_time = paging_group_start + (nof_ue_paging - 1) * power_on_stagger_delay + nof_paging_cycles * paging_period + 4 %}
{%- set tau_end_time = tau_group_start + (nof_ue_tau - 1) * power_on_stagger_delay + nof_tau_updates * tau_period + 1 %}
{%- set cycling_end_time = cycling_group_start + (nof_ue_cycling - 1) * power_on_stagger_delay + nof_cycles * cycle_delay %}
{%- set handover_end_time = handover_group_start + (nof_ue_handover - 1) * power_on_stagger_delay + handover_traffic_duration %}
{%- set quit_time = ([static_end_time, paging_end_time, tau_end_time, cycling_end_time, handover_end_time]) | max + 10 %}

// The "quit" event is only emitted once, on the last UE of the last non-empty group.
// The static group is expected to finish last (see above), so it's the primary
// pick; the rest is only a fallback for when it's empty.
{%- set last_group = 'static' if nof_ue_static > 0 else ('handover' if nof_ue_handover > 0 else ('cycling' if nof_ue_cycling > 0 else ('tau' if nof_ue_tau > 0 else 'paging'))) %}

// Per-group IMSI/K index offsets, so no two UEs across groups share credentials.
{%- set static_offset = 0 %}
{%- set paging_offset = static_offset + nof_ue_static %}
{%- set tau_offset = paging_offset + nof_ue_paging %}
{%- set cycling_offset = tau_offset + nof_ue_tau %}
{%- set handover_offset = cycling_offset + nof_ue_cycling %}

  ue_list: [

{#- ---------------------------- static traffic group ---------------------------- #}
{%- for i in range(nof_ue_static) %}
{%- set idx = static_offset + i %}
{%- set power_on_time = static_group_start + i * power_on_stagger_delay %}
{%- set traffic_end_time = power_on_time + traffic_duration %}

    /* static UE idx {{ i + 1 }} (stays attached, doing DL/UL traffic for the whole test) */
    {
      sim_algo: "xor",
      imsi: "00{{ 1010123456789 + idx }}",
      K: "{{ "%032x" | format(("00112233445566778899aabbccddeeff" | int(base=16)) + idx) }}",
      apn: "{{apn}}",
      as_release: 15,
      ue_category: "nr",
      power_control_enabled: false,
      position: [-50, 0],
      speed: 0,
      channel: {
        type: "awgn",
      },
      attach_pdn_type: "ipv4",
      ue_count: 1,
      sim_events: [
        {
          event: "power_on",
          start_time: {{ power_on_time }},
        },
        {
            start_time: {{ power_on_time }},
            end_time:   {{ traffic_end_time }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ dl_bitrate }},
            event: "cbr_recv"
        },
        {
            start_time: {{ power_on_time }},
            end_time:   {{ traffic_end_time }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ ul_bitrate }},
            event: "cbr_send"
        },
{%- if last_group == 'static' and i == nof_ue_static - 1 %}
        {
          event: "quit",
          start_time: {{ quit_time }},
        },
{%- endif %}
      ]
    },
{%- endfor %}

{#- ---------------------------- paging group ---------------------------- #}
{%- for m in range(nof_ue_paging) %}
{%- set idx = paging_offset + m %}
{%- set power_on_time = paging_group_start + m * power_on_stagger_delay %}
{#- Deterministic pseudo-random jitter per UE (no native RNG-time event in the
    simulator): spreads paging times across the population instead of all UEs
    getting paged in lockstep. #}
{%- set ue_paging_period = paging_period + (((idx * 37 + 13) % (20 * paging_jitter + 1)) / 10.0 - paging_jitter) %}
{%- set dereg_time = power_on_time + nof_paging_cycles * ue_paging_period + 2 %}
{%- set poweroff_time = dereg_time + 1 %}

    /* paging UE idx {{ m + 1 }} (paged roughly every {{ paging_period }}s +/- {{ paging_jitter }}s, {{ nof_paging_cycles }} times) */
    {
      sim_algo: "xor",
      imsi: "00{{ 1010123456789 + idx }}",
      imeisv: "427907000000{{ "%04d" | format(idx) }}",
      K: "{{ "%032x" | format(("00112233445566778899aabbccddeeff" | int(base=16)) + idx) }}",
      apn: "{{apn}}",
      attach_pdn_type: "ipv4",
      spec_tolerance: false,
      rrc_inactive_support: true,
      as_release: 15,
      ue_category: "nr",
      position: [-50, 0],
      speed: 0,
      channel: {
        type: "awgn",
      },
      sim_events_loop_count: {{ nof_paging_cycles - 1 }},
      sim_events_loop_delay: {{ ue_paging_period }},
      sim_events: [
        {
          start_time: {{ power_on_time }},
          event: "power_on"
        },
        {
            start_time: {{ power_on_time + 0.5 }},
            start_delay: {{ paging_idle_delay }},
            end_time:   {{ power_on_time + 0.5 + paging_idle_delay + 1 }},
            dst_addr: "192.168.3.1",
            event: "cbr_recv",
            type: "udp",
            bit_rate: 100,
            payload_len: 1400,
        },
        {
          event: "deregister",
          start_time: {{ dereg_time }},
        },
        {
          event: "power_off",
          start_time: {{ poweroff_time }},
        },
{%- if last_group == 'paging' and m == nof_ue_paging - 1 %}
        {
          event: "quit",
          start_time: {{ quit_time }},
        },
{%- endif %}
      ]
    },
{%- endfor %}

{#- ---------------------------- TAU group ---------------------------- #}
{%- for k in range(nof_ue_tau) %}
{%- set idx = tau_offset + k %}
{%- set power_on_time = tau_group_start + k * power_on_stagger_delay %}
{%- set last_tau_time = power_on_time + nof_tau_updates * tau_period %}
{%- set dereg_time = last_tau_time + 0.5 %}
{%- set poweroff_time = dereg_time + 0.5 %}

    /* TAU UE idx {{ k + 1 }} (sends a TAU request every {{ tau_period }}s, {{ nof_tau_updates }} times) */
    {
      sim_algo: "xor",
      imsi: "00{{ 1010123456789 + idx }}",
      imeisv: "427907000000{{ "%04d" | format(idx) }}",
      K: "{{ "%032x" | format(("00112233445566778899aabbccddeeff" | int(base=16)) + idx) }}",
      apn: "{{apn}}",
      attach_pdn_type: "ipv4",
      spec_tolerance: false,
      as_release: 15,
      ue_category: "nr",
      position: [-50, 0],
      speed: 0,
      channel: {
        type: "awgn",
      },
      sim_events: [
        {
          event: "power_on",
          start_time: {{ power_on_time }},
        },
{%- for n in range(nof_tau_updates) %}
        {
          event: "tau_request",
          start_time: {{ power_on_time + (n + 1) * tau_period }},
        },
{%- endfor %}
        {
          event: "deregister",
          start_time: {{ dereg_time }},
        },
        {
          event: "power_off",
          start_time: {{ poweroff_time }},
        },
{%- if last_group == 'tau' and k == nof_ue_tau - 1 %}
        {
          event: "quit",
          start_time: {{ quit_time }},
        },
{%- endif %}
      ]
    },
{%- endfor %}

{#- ---------------------------- cycling attach/detach group ---------------------------- #}
{%- for j in range(nof_ue_cycling) %}
{%- set idx = cycling_offset + j %}
{%- set power_on_time = cycling_group_start + j * power_on_stagger_delay %}
{%- set traffic_end_time = power_on_time + cycle_traffic_duration %}
{%- set dereg_time = traffic_end_time + 0.5 %}
{%- set poweroff_time = dereg_time + 0.5 %}

    /* cycling UE idx {{ j + 1 }} (repeats {{ nof_cycles }} attach/detach cycles) */
    {
      sim_algo: "xor",
      imsi: "00{{ 1010123456789 + idx }}",
      K: "{{ "%032x" | format(("00112233445566778899aabbccddeeff" | int(base=16)) + idx) }}",
      apn: "{{apn}}",
      as_release: 15,
      ue_category: "nr",
      power_control_enabled: false,
      position: [-50, 0],
      speed: 0,
      channel: {
        type: "awgn",
      },
      sim_events_loop_count: {{ nof_cycles - 1 }},
      sim_events_loop_delay: {{ cycle_delay }},
      attach_pdn_type: "ipv4",
      ue_count: 1,
      sim_events: [
        {
          event: "power_on",
          start_time: {{ power_on_time }},
        },
        {
            start_time: {{ power_on_time }},
            end_time:   {{ traffic_end_time }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ dl_bitrate }},
            event: "cbr_recv"
        },
        {
            start_time: {{ power_on_time }},
            end_time:   {{ traffic_end_time }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ ul_bitrate }},
            event: "cbr_send"
        },
        {
          event: "deregister",
          start_time: {{ dereg_time }},
        },
        {
          event: "power_off",
          start_time: {{ poweroff_time }},
        },
{%- if last_group == 'cycling' and j == nof_ue_cycling - 1 %}
        {
          event: "quit",
          start_time: {{ quit_time }},
        },
{%- endif %}
      ]
    },
{%- endfor %}

{#- ---------------------------- handover group ---------------------------- #}
{%- for h in range(nof_ue_handover) %}
{%- set idx = handover_offset + h %}
{%- set power_on_time = handover_group_start + h * power_on_stagger_delay %}
{%- set traffic_end_time = power_on_time + handover_traffic_duration %}

    /* handover UE idx {{ h + 1 }} (bounces between the 2 cells, triggering repeated handovers) */
    {
      sim_algo: "xor",
      imsi: "00{{ 1010123456789 + idx }}",
      imeisv: "427907000000{{ "%04d" | format(idx) }}",
      K: "{{ "%032x" | format(("00112233445566778899aabbccddeeff" | int(base=16)) + idx) }}",
      apn: "{{apn}}",
      attach_pdn_type: "ipv4",
      spec_tolerance: false,
      as_release: 16, // this is to support conditional HO
      ue_category: "nr",
      channel: {
        type: "awgn",
      },
      max_distance: 50,
      bounce: "back",
      position: [0, {{idx % 50}}],
      speed: 80,
      direction: 0,
      sim_events: [
        {
          start_time: {{ power_on_time }},
          event: "power_on"
        },
        {
            start_time: {{ power_on_time }},
            end_time:   {{ traffic_end_time }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ dl_bitrate }},
            event: "cbr_recv"
        },
        {
            start_time: {{ power_on_time }},
            end_time:   {{ traffic_end_time }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ ul_bitrate }},
            event: "cbr_send"
        },
{%- if last_group == 'handover' and h == nof_ue_handover - 1 %}
        {
          event: "quit",
          start_time: {{ quit_time }},
        },
{%- endif %}
      ]
    },
{%- endfor %}

  ]
