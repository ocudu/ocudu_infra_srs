// -----------------------------------------------------------------------------
// Bidirectional UDP traffic UE simulator config.
//
// A number of UEs ("nof_ue") attach one after another, every
// "power_on_stagger_delay" seconds. Immediately after powering on, each UE then
// runs bidirectional UDP traffic for "traffic_duration" seconds and stops.
// -----------------------------------------------------------------------------

{%- set nof_ue = nof_ue | default(1) %}
{%- set traffic_duration = traffic_duration | default(10) %}
{%- set dl_bitrate = dl_bitrate | default(1.0e+6) %}
{%- set ul_bitrate = ul_bitrate | default(1.0e+6) %}
{%- set power_on_stagger_delay = power_on_stagger_delay | default(0.1) %}
{%- set as_release = as_release | default(15) %}

// Time at which the whole simulation is done and the simulator can quit:
// last UE powers on, then runs its traffic, plus a final grace delay to allow it to be released due to inactivity.
{%- set quit_time = nof_ue * power_on_stagger_delay + traffic_duration + 10 %}

  ue_list: [
{%- for i in range(nof_ue) %}

{%- set power_on_time = 0.5 + i * power_on_stagger_delay %}
{%- set traffic_end_time = power_on_time + traffic_duration %}

    /* UE idx {{ i + 1 }} */
    {
      sim_algo: "xor",
      imsi: "00{{ 1010123456789 + i }}",
      K: "{{ "%032x" | format(("00112233445566778899aabbccddeeff" | int(base=16)) + i) }}",
      apn: "{{apn}}",
      as_release: {{as_release}},
      ue_category: "nr",
      power_control_enabled: false,
      position: [100, 0],
      speed: 0,
      channel: {
        type: "awgn",
      },
      attach_pdn_type: "ipv4",
      ue_count: 1,
      sim_events: [
        {
          event: "power_on",
          start_time: {{ power_on_time }},
        },
        {
            start_time: {{ power_on_time }},
            end_time:   {{ traffic_end_time }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ dl_bitrate }},
            event: "cbr_recv"
        },
        {
            start_time: {{ power_on_time }},
            end_time:   {{ traffic_end_time }},
            dst_addr: "192.168.3.1",
            payload_len: 1400,
            bit_rate: {{ ul_bitrate }},
            event: "cbr_send"
        },
{%- if i == nof_ue - 1 %}
        {
          event: "quit",
          start_time: {{ quit_time }},
        },
{%- endif %}
      ]
    },
{%- endfor %}

  ]
