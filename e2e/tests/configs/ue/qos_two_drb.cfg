{%- set traffic_duration = traffic_duration | default(10) %}
{%- set default_bitrate = default_bitrate | default(1.0e+6) %}

ue_list: [
  {
    ue_count: 1,
    imsi: "001010123456789",
    imeisv: "4279070000000201",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    as_release: 15,
    ue_category: "nr",
    power_control_enabled: false,
    sim_events: [
      {
        event: "power_on",
        start_time: 0,
      },
      // Traffic on the default 5QI 9 bearer, asking for more than the cell carries.
      {
        event: "cbr_recv",
        start_time: 1,
        end_time: {{1 + traffic_duration}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate: {{default_bitrate}},
      },
      {
        event: "cbr_send",
        start_time: 1,
        end_time: {{1 + traffic_duration}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate: {{default_bitrate}},
      },
      // Port 3001 is the TFT of the 5QI 1 erab, and the rate its guaranteed_bitrate_dl/ul.
      {
        event: "cbr_recv",
        start_time: 1,
        end_time: {{1 + traffic_duration}},
        dst_addr: "192.168.3.1:3001",
        payload_len: 1400,
        bit_rate: 1000000,
      },
      {
        event: "cbr_send",
        start_time: 1,
        end_time: {{1 + traffic_duration}},
        dst_addr: "192.168.3.1:3001",
        payload_len: 1400,
        bit_rate: 1000000,
      },
      {
        event: "deregister",
        start_time: {{traffic_duration + 2}},
      },
      {
        event: "power_off",
        start_time: {{traffic_duration + 3}},
      },
      {
        event: "quit",
        start_time: {{traffic_duration + 4}},
      },
    ]
  },
]
