{%- set test_duration = test_duration | default(10) %}
{%- set dl_bitrate = dl_bitrate | default(1.0e+6) %}
{%- set ul_bitrate = ul_bitrate | default(1.0e+6) %}

{%- set nof_ue = 1 %}
{%- set caps = 20 %}

caps: {{caps}},

ue_list: [
  {
    ue_count: {{nof_ue}},
    imsi: "001010123456789",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    attach_pdn_type: "ipv4",
    apn: "{{apn}}",
    as_release: 15,
    ue_category: "nr",
    sim_events: [
      {% if nof_ue == 1 %}
      {
        start_time: 0,
        event: "power_on"
      },
      {% endif %}
      {% if dl_bitrate != 0 %}
      {
        start_time: {{nof_ue/caps}},
        end_time: {{nof_ue/caps+test_duration}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate: {{dl_bitrate}},
        event: "cbr_recv"
      },
      {% endif %}
      {% if ul_bitrate != 0 %}
      {
        start_time: {{nof_ue/caps}},
        end_time: {{nof_ue/caps+test_duration}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate:  {{ul_bitrate}},
        event: "cbr_send"
      },
      {% endif %}
      {
        start_time: {{nof_ue/caps+test_duration+1}},
        event: "deregister"
      },
      {
        start_time: {{nof_ue/caps+test_duration+2}},
        event: "power_off"
      },
      {
        start_time: {{nof_ue/caps+test_duration+3}},
        event: "quit"
      }
    ],
  },
],
