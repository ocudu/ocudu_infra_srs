{%- set ul_bitrate = ul_bitrate | default(1.0e+6) %}

ue_list: [
  {
    ue_count: 1,
    imsi: "001010123456789",
    imeisv: "4279070000000101",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    rrc_inactive_support: true,
    as_release: 15,
    ue_category: "nr",
    sim_events: [
      {
        start_time: {{start_time}},
        event: "power_on"
      },
      // UL-only traffic to establish the data path. no DL avoids core-triggered MT paging after suspension
      {
        start_time: {{start_time + 0.5}},
        start_delay: 2,
        end_time: {{start_time + 3}},
        dst_addr: "192.168.3.1",
        event: "cbr_send",
        type: "udp",
        bit_rate: {{ul_bitrate}},
        payload_len: 1400,
      },
      // Second UL burst starts after the UE has been suspended to RRC_INACTIVE, triggering MO resume
      {
        start_time: {{start_time + 6}},
        end_time: {{start_time + 8}},
        dst_addr: "192.168.3.1",
        event: "cbr_send",
        type: "udp",
        bit_rate: {{ul_bitrate}},
        payload_len: 1400,
      },
      {
        start_time: {{start_time + 9}},
        event: "deregister"
      },
      {
        start_time: {{start_time + 10}},
        event: "power_off"
      },
      {
        start_time: {{start_time + 11}},
        event: "quit"
      },
    ]
  },
],
