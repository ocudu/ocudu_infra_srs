{%- set caps = caps | default(20) %}
{%- set nof_ue = nof_ue | default(1) %}

caps: {{caps}},

ue_list: [
  {
    ue_count: {{nof_ue}},
    imsi: "001010123456789",
    imeisv: "4279070000000201",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    as_release: 15,
    ue_category: "nr",
    sim_events_loop_count: 26,
    sim_events_loop_delay: 1,
    sim_events: [
      {% if quit_on_start %}
      {
        start_time: 1,
        event: "quit"
      },
      {% endif %}
      {% if nof_ue == 1 %}
      {
        start_time: 0,
        event: "power_on"
      },
       {% endif %}
      {
        start_time: 0.5,
        end_time: 200,
        dst_addr: "192.168.3.1",
        payload_len: 1000,
        delay: 0.5,
        event: "ping"
      },
      {
        start_time: 1,
        event: "pdn_connect",
        apn: "{{apn}}",
      },
      {
        start_time: 1.5,
        event: "pdn_disconnect",
        apn: "{{apn}}",
      },
      {
        start_time: 27,
        event: "power_off"
      },
      {
        start_time: 28,
        event: "quit"
      }
    ]
  },
],
