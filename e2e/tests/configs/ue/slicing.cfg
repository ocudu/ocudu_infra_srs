{%- set dl_bitrate = dl_bitrate | default(1.0e+6) %}
{%- set ul_bitrate = ul_bitrate | default(1.0e+6) %}

ue_list: [
  {
    ue_count: 1,
    imsi: "001010123456789",
    imeisv: "4279070000000201",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    as_release: 15,
    ue_category: "nr",
    sim_events: [
      {
        event: "power_on",
        start_time: 0,
      },
      // Start DL/UL traffic in the first slice
      {
        start_time: 1,
        end_time: 10,
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate:  {{dl_bitrate}},
        event: "cbr_recv"
      },
      // Start UL traffic in the first slice
      {
        start_time: 1,
        end_time: 10,
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate:  {{ul_bitrate}},
        event: "cbr_send"
      },
      // Connect the 2nd PDN to the 2nd slice
      {
        event: "pdn_connect",
        start_time: 3,
        apn: "{{apn}}",
        snssai: {sst: 2,  sd: 42},
      },
      // Start DL traffic on the 2nd slice
      {
        start_time: 4,
        end_time: 10,
        dst_addr: "192.168.4.1",
        payload_len: 1400,
        bit_rate:  {{dl_bitrate}},
        event: "cbr_recv"
      },
      {
        start_time: 4,
        end_time: 10,
        dst_addr: "192.168.4.1",
        payload_len: 1400,
        bit_rate:  {{ul_bitrate}},
        event: "cbr_send"
      },
      {
        start_time: 11,
        event: "deregister"
      },
      {
        start_time: 12,
        event: "power_off"
      },
      {
        start_time: 13,
        event: "quit"
      }
    ]
  },
],
