{%- set base_power_on_time = base_power_on_time | default(0) %}
{%- set nof_ue = nof_ue | default(1) %}
{%- set test_duration = test_duration | default(10) %}
{%- set as_release = as_release | default(15) %}

{%- set traffic_start = base_power_on_time + 0.1*nof_ue + 10 %}

ue_list: [
  {%- for i in range(nof_ue) %}
  /* UEs idx {{ i + 1 }} */
  {
    sim_algo: "xor",
    imsi: "00{{ 1010123456789 + i }}",
    K: "{{ "%032x" | format(("00112233445566778899aabbccddeeff" | int(base=16)) + i) }}",
    apn: "{{apn}}",
    as_release: {{as_release}},
    ue_category: "nr",
    power_control_enabled: false,
    position: [100, 0],
    speed: 0,
    channel: {
      type: "awgn",
    },
    attach_pdn_type: "ipv4",
    ue_count: 1,
    sim_events: [
      {
        event: "power_on",
        start_time: {{ base_power_on_time + 0.1*i }},
      },
      {
        start_time: {{ traffic_start }},
        end_time: {{ traffic_start + test_duration }},
        dst_addr: "192.168.3.1",
        payload_len: 1000,
        delay: 1,
        event: "ping"
      },
      {
        event: "deregister",
        start_time: {{ traffic_start + test_duration + 20 + 0.1*i }},
      },
      {
        event: "power_off",
        start_time: {{ traffic_start + test_duration + 20 + 0.1*i + 5 }},
      },
      {%- if i == nof_ue - 1 %}
      {
        event: "quit",
        start_time: {{ traffic_start + test_duration + 20 + 0.1*i + 10 }},
      },
      {%- endif %}
    ]
  },
  {%- endfor %}
]
