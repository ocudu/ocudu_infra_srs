{%- set caps = caps | default(20) %}
{%- set nof_ue = nof_ue | default(1) %}

  // Number of UE connections per second
  caps: {{caps}},

  ue_list: [
    {
      ue_count: {{nof_ue}},
      imsi: "001010123456789",
      sim_algo: "xor",
      K: "00112233445566778899aabbccddeeff",
      attach_pdn_type: "ipv4",
      apn: "srsapn",
      as_release: 15,
      ue_category: "nr",
      sim_events: [

				{% if quit_on_start %}
				{
				"start_time": 1,
				"event": "quit"
				},
				{% endif %}

       {% if nof_ue == 1 %}
       {
         "start_time": 0,
         "event": "power_on"
       },
       {% endif %}

       {
          start_time: {{nof_ue/caps+1}},
          end_time: {{nof_ue/caps+6}},
          dst_addr: "192.168.3.1",
          payload_len: 1000,
          delay: 1,
          event: "ping"
        },
        {
          start_time: {{nof_ue/caps+7}},
          event: "power_off"
        },
        {
          start_time: {{nof_ue/caps+8}},
          event: "quit"
        }
      ],
    },
  ],
