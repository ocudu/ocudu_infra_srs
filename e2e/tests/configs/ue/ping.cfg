{%- set traffic_duration = traffic_duration | default(10) %}
{%- set as_release = as_release | default(15) %}

ue_list: [
  {
    sim_algo: "xor",
    imsi: "001010123456789",
    imeisv: "4279070000000201",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    as_release: {{as_release}},
    ue_category: "nr",
    power_control_enabled: false,
    position: [100, 0],
    speed: 0,
    channel: {
      type: "awgn",
    },
    attach_pdn_type: "ipv4",
    ue_count: 1,
    sim_events: [
      {
        event: "power_on",
        start_time: 0.5,
      },
      {
        start_time: 0.5,
        end_time: {{ 0.5 + traffic_duration }},
        dst_addr: "192.168.3.1",
        payload_len: 1000,
        delay: 1,
        event: "ping"
      },
      {
        event: "deregister",
        start_time: {{ 0.5 + traffic_duration + 0.5 }},
      },
      {
        event: "power_off",
        start_time: {{ 0.5 + traffic_duration + 1 }},
      },
      {
        event: "quit",
        start_time: {{ 0.5 + traffic_duration + 4 }},
      },
    ]
  },
]
