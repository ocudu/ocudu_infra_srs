// -----------------------------------------------------------------------------
// RRC Inactive UE that resumes on a different gNB.
//
// Meant to be used with a 2 cell channel simulator config (2cell_chsim.cfg),
// where cell 1 sits at [-50, 0] and cell 2 at [50, 0].
//
// The UE starts on top of cell 1 and walks in a straight line towards cell 2 and
// past it, at the default 18 km/h (5 m/s), so its position is -50 + 5 * t meters:
//   * It attaches to gNB-1 and runs a short traffic burst, still well inside
//     cell 1 coverage.
//   * Once the traffic stops, the CU-CP inactivity timer suspends it to
//     RRC_INACTIVE, with gNB-1 anchoring its UE context.
//   * While inactive, it crosses the cell edge (at 10 s) and reselects cell 2.
//   * A second, MO traffic burst resumes it on gNB-2, which has to retrieve the
//     UE context from gNB-1 over XnAP.
// -----------------------------------------------------------------------------

{%- set bitrate = 1.0e+6 %}

// Traffic burst on gNB-1. It ends early enough for the UE to be suspended at
// around 4 s, at [-30, 0], while it is still much closer to cell 1 than to cell 2.
{%- set first_burst_start = 0.5 %}
{%- set first_burst_end = 2 %}

// MO traffic burst resuming the UE, once it has reselected cell 2. Cell 2 becomes
// more than q_hyst + q_offset_cell = 6 dB stronger than cell 1 at [+17, 0], so the
// UE reselects it at around 14 s and is at [+40, 0] when the burst starts.
{%- set second_burst_start = 18 %}
{%- set second_burst_end = 21 %}

ue_list: [
  {
    ue_count: 1,
    imsi: "001010123456789",
    imeisv: "4279070000000101",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    rrc_inactive_support: true,
    as_release: 15,
    ue_category: "nr",
    channel: {
      type: "awgn",
    },
    // Start on cell 1 and move towards cell 2. No max_distance / bounce: the UE
    // walks past cell 2 and stays its closest cell until the end of the test.
    position: [-50, 0],
    speed: 18, // km/h, as the UE simulator takes it
    direction: 0,
    sim_events: [
      {
        start_time: 0,
        event: "power_on"
      },
      {
        start_time: {{first_burst_start}},
        end_time: {{first_burst_end}},
        dst_addr: "192.168.3.1",
        event: "cbr_recv",
        type: "udp",
        bit_rate: {{bitrate}},
        payload_len: 1400,
      },
      {
        start_time: {{first_burst_start}},
        end_time: {{first_burst_end}},
        dst_addr: "192.168.3.1",
        event: "cbr_send",
        type: "udp",
        bit_rate: {{bitrate}},
        payload_len: 1400,
      },
      // MO data resuming the UE on gNB-2. UL first, so that the DL traffic is
      // only requested once the UE is connected again and no DL data can reach
      // the anchor gNB while the UE is suspended.
      {
        start_time: {{second_burst_start}},
        end_time: {{second_burst_end}},
        dst_addr: "192.168.3.1",
        event: "cbr_send",
        type: "udp",
        bit_rate: {{bitrate}},
        payload_len: 1400,
      },
      {
        start_time: {{second_burst_start + 1}},
        end_time: {{second_burst_end}},
        dst_addr: "192.168.3.1",
        event: "cbr_recv",
        type: "udp",
        bit_rate: {{bitrate}},
        payload_len: 1400,
      },
      {
        start_time: {{second_burst_end + 1}},
        event: "deregister"
      },
      {
        start_time: {{second_burst_end + 2}},
        event: "power_off"
      },
      {
        start_time: {{second_burst_end + 3}},
        event: "quit"
      },
    ]
  },
],
