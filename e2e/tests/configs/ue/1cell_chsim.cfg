{%- set band = band | default(78) %}
{%- set bandwidth = bandwidth | default(100) %}
{%- set common_scs = common_scs | default(30) %}
{%- set dl_nr_arfcn = dl_nr_arfcn | default(626668) %}
{%- set ssb_nr_arfcn = ssb_nr_arfcn | default(624000) %}
{%- set pdcch_decode_threshold = pdcch_decode_threshold | default(0.7) %}
{%- set ref_signal_power = ref_signal_power | default(0) %}
{%- set ul_power_attenuation = ul_power_attenuation | default(0) %}
{%- set cell_position = cell_position | default([0, 0]) %}
// "parabolic_panel" gives the cell a panel with one antenna element per UL antenna, 0.5 wavelengths apart, that
// points in the antenna_orientation direction. The cell antennas then receive the UE signal with different phases,
// and the gNB can measure the angle of arrival. The number of DL antennas must be equal to the number of UL antennas.
{%- set antenna_type = antenna_type | default("isotropic") %}
{%- set antenna_orientation = antenna_orientation | default(0) %}

cell_groups: [
  {
    group_type: "nr",
    multi_ue: true,
    channel_sim: true,
    delay_sim: true,
    cells: [
      {
        rf_port: 0,
        {{cell_ru_cfg}},
        band: {{band}},
        bandwidth: {{bandwidth}},
        dl_nr_arfcn: {{dl_nr_arfcn}},
        ssb_nr_arfcn: {{ssb_nr_arfcn}},
        subcarrier_spacing: {{common_scs}},
        ssb_subcarrier_spacing: {{common_scs}},
        n_antenna_dl: {{nof_antennas_dl}},
        n_antenna_ul: {{nof_antennas_ul}},
        global_timing_advance: -1,
        // Cell specific Power calibration
        ref_signal_power: {{ref_signal_power}},
        ul_power_attenuation: {{ul_power_attenuation}},
        position: {{cell_position}},
        {% if rx_to_tx_latency > -1 %}
        rx_to_tx_latency: {{rx_to_tx_latency}},
        {% endif %}
        antenna: {
          type: "{{antenna_type}}",
          {%- if antenna_type == "parabolic_panel" %}
          n1: {{nof_antennas_ul}},
          p: 1,
          orientation: {{antenna_orientation}},
          {%- endif %}
        },
      },
    ],
    // PDCCH fine tuning: Ignore candidates with less power than threshold (relative to SSB) to avoid false-positive phantoms and save CPU power.
  {% if pdcch_decode_threshold > 0.0 %}
    pdcch_decode_opt: true,
    pdcch_decode_opt_threshold: {{pdcch_decode_threshold}},
  {% else %}
    pdcch_decode_opt: false,
  {% endif %}
  },
],
