{%- set caps = caps | default(20) %}
{%- set nof_ue = nof_ue | default(1) %}

  ue_list: [
  {
    "ue_count": 1,
    "imsi": "001010123456789",
    "imeisv": "4279070000000201",
    "sim_algo": "xor",
    "K": "00112233445566778899aabbccddeeff",
    "apn": "srsapn",
    "attach_pdn_type": "ipv4",
    "spec_tolerance": false,
    "as_release": 15,
    "ue_category": "nr",

    "sim_events": [

    {% if quit_on_start %}
			{
				"start_time": 1,
				"event": "quit"
			},
    {% endif %}

      {
        event: "power_on",
        start_time: 0,
      },
      // Start DL traffic in background
      {
        "start_time": 1,
        "end_time": 10,
        "dst_addr": "192.168.3.1",
        "payload_len": 1400,
        "bit_rate": {{dl_bitrate}},
        "event": "cbr_recv"
      },
      // Start DL traffic on QCI1
      {
        "start_time": 4,
        "end_time": 10,
        "dst_addr": "192.168.3.1:3001",
        "payload_len": 1400,
        "bit_rate": {{dl_bitrate}},
        "event": "cbr_recv"
      },
      // Start DL traffic on QCI2
      {
        "start_time": 6,
        "end_time": 10,
        "dst_addr": "192.168.3.1:3002",
        "payload_len": 1400,
        "bit_rate": {{dl_bitrate}},
        "event": "cbr_recv"
      },
      {
        "start_time": 11,
        "event": "power_off"
      },
      {
        "start_time": 12,
        "event": "quit"
      }
    ]
  },
],