{%- set dl_bitrate = dl_bitrate | default(1.0e+6) %}

ue_list: [
  {
    ue_count: 1,
    imsi: "001010123456789",
    imeisv: "4279070000000201",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    as_release: 15,
    ue_category: "nr",
    sim_events: [
      {
        event: "power_on",
        start_time: 0,
      },
      // Start DL traffic in background
      {
        start_time: 1,
        end_time: 10,
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate: {{dl_bitrate}},
        event: "cbr_recv"
      },
      // Start DL traffic on QCI1
      {
        start_time: 4,
        end_time: 10,
        dst_addr: "192.168.3.1:3001",
        payload_len: 1400,
        bit_rate: {{dl_bitrate}},
        event: "cbr_recv"
      },
      // Start DL traffic on QCI2
      {
        start_time: 6,
        end_time: 10,
        dst_addr: "192.168.3.1:3002",
        payload_len: 1400,
        bit_rate: {{dl_bitrate}},
        event: "cbr_recv"
      },
      {
        start_time: 11,
        event: "deregister"
      },
      {
        start_time: 12,
        event: "power_off"
      },
      {
        start_time: 13,
        event: "quit"
      }
    ]
  },
],
