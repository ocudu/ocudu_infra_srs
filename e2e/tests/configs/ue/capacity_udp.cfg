    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    as_release: 15,
    ue_category: "nr",
    channel: {
      type: "awgn",
    },
    bounce: "back",
    position: [{{excellent_position}}, 0],
