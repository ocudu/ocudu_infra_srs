{%- set traffic_duration = traffic_duration | default(200) %}
{%- set dl_bitrate = dl_bitrate | default(1.0e+6) %}
{%- set ul_bitrate = ul_bitrate | default(1.0e+6) %}

{%- set excellent_position = 0 %}
{%- set good_position = 50 %}
{%- set fair_position = 100 %}
{%- set poor_position = 150 %}

{%- set excellent_nof_ue = 1 %}
{%- set good_nof_ue = 2 %}
{%- set fair_nof_ue = 4 %}
{%- set poor_nof_ue = 3 %}

// One entry per UE instead of ue_count groups, so each UE can power on staggered.
{%- set ue_positions = [excellent_position] * excellent_nof_ue
                     + [good_position] * good_nof_ue
                     + [fair_position] * fair_nof_ue
                     + [poor_position] * poor_nof_ue %}
{%- set nof_ue = ue_positions | length %}

ue_list: [
{%- for position in ue_positions %}
{%- set i = loop.index0 %}
{%- set power_on_time = i * 0.02 %}
  {
    ue_count: 1,
    imsi: "00{{ 1010123456789 + i }}",
    imeisv: "4279070000000201",
    sim_algo: "xor",
    K: "{{ "%032x" | format(("00112233445566778899aabbccddeeff" | int(base=16)) + i) }}",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    as_release: 15,
    ue_category: "nr",
    power_control_enabled: false,
    channel: {
      type: "awgn",
    },
    bounce: "back",
    position: [{{position}}, 0],
    speed: 0,
    direction: 0,
    sim_events: [
      {
        start_time: {{power_on_time}},
        event: "power_on"
      },
      {
        start_time: {{power_on_time + 0.1}},
        end_time: {{traffic_duration}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate:  {{dl_bitrate}},
        event: "cbr_recv"
      },
      {
        start_time: {{power_on_time + 0.1}},
        end_time: {{traffic_duration}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate:  {{ul_bitrate}},
        event: "cbr_send"
      },
      {
        start_time: {{traffic_duration+1}},
        event: "deregister"
      },
      {
        start_time: {{traffic_duration+2}},
        event: "power_off"
      },
{%- if i == nof_ue - 1 %}
      {
        start_time: {{traffic_duration+3}},
        event: "quit"
      },
{%- endif %}
    ]
  },
{%- endfor %}
]
