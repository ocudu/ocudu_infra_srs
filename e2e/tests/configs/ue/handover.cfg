{%- set nof_ue = nof_ue | default(1) %}
{%- set traffic_duration = traffic_duration | default(200) %}
{%- set dl_bitrate = dl_bitrate | default(1.0e+6) %}
{%- set ul_bitrate = ul_bitrate | default(1.0e+6) %}
{%- set max_distance = max_distance | default(50) %}
{%- set test_duration = test_duration | default(-1) %}

{%- set quit_time = nof_ue/20+traffic_duration+3 %}

{%- if test_duration > 0 %}
{%- set quit_time = test_duration %}
{%- endif %}

caps: 20,

ue_list: [
  {
    ue_count: {{nof_ue}},
    imsi: "001010123456789",
    imeisv: "4279070000000201",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    as_release: 16, // this is to support conditional HO
    ue_category: "nr",
    channel: {
      type: "awgn",
    },
    max_distance: {{max_distance}},
    bounce: "back",
    position: [0, 0],
    speed: 80,
    direction: 0,
    sim_events: [
      {% if nof_ue == 1 %}
      {
        start_time: 0,
        event: "power_on"
      },
      {% endif %}
      {% if dl_bitrate > 0 %}
      {
        start_time: {{nof_ue/20+0.1}},
        end_time: {{nof_ue/20+traffic_duration}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate:  {{dl_bitrate}},
        event: "cbr_recv"
      },
      {% endif %}
      {% if ul_bitrate > 0 %}
      {
        start_time: {{nof_ue/20+0.1}},
        end_time: {{nof_ue/20+traffic_duration}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate:  {{ul_bitrate}},
        event: "cbr_send"
      },
      {% endif %}
      {
        start_time: {{nof_ue/20+traffic_duration+1}},
        event: "deregister"
      },
      {
        start_time: {{nof_ue/20+traffic_duration+2}},
        event: "power_off"
      },
      {
        start_time: {{quit_time}},
        event: "quit"
      }
    ]
  }
]
