  cell_groups: [
    {
      group_type: "nr",

      multi_ue: true,

      cells: [
        {
          rf_port: 0,
          sample_rate: {{ sample_rate / 1000000 }},
          band: 3,
          bandwidth: 10,
          dl_nr_arfcn: 368500,
          ssb_nr_arfcn: 367930,
          subcarrier_spacing: 15,
          ssb_subcarrier_spacing: 15,
          n_antenna_dl: 1,
          n_antenna_ul: 1,
          global_timing_advance: 0,

        },
      ],
      // PDCCH fine tuning: Ignore candidates with less power than threshold (relative to SSB) to avoid false-positive phantoms and save CPU power.
      pdcch_decode_opt: true,
      pdcch_decode_opt_threshold: 0,
    },
  ],

  ue_list: [
    {
      imsi: "001010123456789",
      sim_algo: "xor",
      K: "00112233445566778899aabbccddeeff",
      attach_pdn_type: "ipv4",
      apn: "srsapn",
      as_release: 15,
      ue_category: "nr",
      sim_events: [
        {
          start_time: 0,
          event: "power_on"
        },
        {
          start_time: 1,
          end_time: 20,
          dst_addr: "192.168.3.1",
          payload_len: 1000,
          delay: 1,
          event: "ping"
        },
        {
          start_time: 20,
          event: "power_off"
        },
        {
          start_time: 21,
          event: "quit"
        }
      ],
      ue_count: 4,
    },
  ],
