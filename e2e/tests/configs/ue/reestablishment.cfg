{%- set caps = caps | default(20) %}
{%- set nof_ue = nof_ue | default(1) %}
{%- set nof_reestablishments = nof_reestablishments | default(5) %}

  caps: {{caps}},

  ue_list: [
  {
    "ue_count": {{nof_ue}},
    "imsi": "001010123456789",
    "imeisv": "4279070000000201",
    "sim_algo": "xor",
    "K": "00112233445566778899aabbccddeeff",
    "apn": "{{apn}}",
    "attach_pdn_type": "ipv4",
    "spec_tolerance": false,
    "as_release": 15,
    "ue_category": "nr",
    "sim_events_loop_count": {{nof_reestablishments-1}},
    "sim_events_loop_delay": 2,

    "sim_events": [


			{% if quit_on_start %}
			{
			"start_time": 1,
			"event": "quit"
			},
			{% endif %}

     {% if nof_ue == 1 %}
     {
     "start_time": 0,
     "event": "power_on"
     },
     {% endif %}

     {
        "start_time": 0.5,
        "end_time": {{nof_reestablishments*2}},
        "dst_addr": "192.168.3.1",
        "payload_len": 1400,
        "bit_rate":  {{ul_bitrate}},
        "event": "cbr_send"
      },
      {
        "start_time": 0.5,
        "end_time": {{nof_reestablishments*2}},
        "dst_addr": "192.168.3.1",
        "payload_len": 1400,
        "bit_rate":  {{dl_bitrate}},
        "event": "cbr_recv"
      },
      {
        "start_time": 1,
        "event": "rrc_reest"
      },
      {
       "start_time": {{nof_reestablishments*2}},
       "event": "power_off"
      },
      {
        "start_time": {{nof_reestablishments*2}}+0.5,
        "event": "quit"
      }
    ]
  },
],