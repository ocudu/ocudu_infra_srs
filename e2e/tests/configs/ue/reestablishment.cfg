{%- set nof_ue = nof_ue | default(1) %}
{%- set nof_reestablishments = nof_reestablishments | default(1) %}
{%- set dl_bitrate = dl_bitrate | default(1.0e+6) %}
{%- set ul_bitrate = ul_bitrate | default(1.0e+6) %}

caps: 20,

ue_list: [
  {
    ue_count: {{nof_ue}},
    imsi: "001010123456789",
    imeisv: "4279070000000201",
    sim_algo: "xor",
    K: "00112233445566778899aabbccddeeff",
    apn: "{{apn}}",
    attach_pdn_type: "ipv4",
    spec_tolerance: false,
    as_release: 15,
    ue_category: "nr",
    power_control_enabled: false,
    position: [100, 0],
    speed: 0,
    channel: {
      type: "awgn",
    },    
    sim_events_loop_count: {{nof_reestablishments-1}},
    sim_events_loop_delay: 4,
    sim_events: [
      {% if nof_ue == 1 %}
      {
        start_time: 0,
        event: "power_on"
      },
      {% endif %}
      {
        start_time: 0.5,
        end_time: {{nof_reestablishments*4}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate:  {{ul_bitrate}},
        event: "cbr_send"
      },
      {
        start_time: 0.5,
        end_time: {{nof_reestablishments*4}},
        dst_addr: "192.168.3.1",
        payload_len: 1400,
        bit_rate:  {{dl_bitrate}},
        event: "cbr_recv"
      },
      {
        start_time: 1,
        event: "rrc_reest"
      },
      {
        start_time: {{nof_reestablishments*4}},
        event: "deregister"
      },
      {
        start_time: {{nof_reestablishments*4+1}},
        event: "power_off"
      },
      {
        start_time: {{nof_reestablishments*4+2}},
        event: "quit"
      }
    ]
  },
],
