cell_groups: [
  {
    group_type: "nr",
    multi_ue: true,
    channel_sim: true,
    delay_sim: true,

    cells: [
      {
        rf_port: 0,
        {{cell_ru_cfg}},
        bandwidth: 100,
        global_timing_advance: -1,
        band: {{band|default(78)}},
        bandwidth: {{bandwidth|default(100)}},
        dl_nr_arfcn: {{dl_nr_arfcn|default(626668)}},
        ssb_nr_arfcn: {{ssb_nr_arfcn|default(624000)}},
        subcarrier_spacing: {{common_scs|default(30)}},
        ssb_subcarrier_spacing: {{common_scs|default(30)}},
        n_antenna_dl: {{nof_antennas|default(1)}},
        n_antenna_ul: {{nof_antennas|default(1)}},
        ref_signal_power: -16,
        position: [-50, 0],
        ul_power_attenuation: 40,
        antenna: {
          type: "isotropic",
        }
      },
      {
        rf_port: 1,
        {{cell_ru_cfg}},
        bandwidth: 100,
        band: {{band|default(78)}},
        bandwidth: {{bandwidth|default(100)}},
        dl_nr_arfcn: {{dl_nr_arfcn|default(626668)}},
        ssb_nr_arfcn: {{ssb_nr_arfcn|default(624000)}},
        subcarrier_spacing: {{common_scs|default(30)}},
        ssb_subcarrier_spacing: {{common_scs|default(30)}},
        n_antenna_dl: {{nof_antennas|default(1)}},
        n_antenna_ul: {{nof_antennas|default(1)}},
        position: [50, 0],
        ref_signal_power: -16,
        ul_power_attenuation: 40,
        antenna: {
          type: "isotropic",
        },
      }
    ],

    /* In case your system has a high SNR and you are running high number of
    * UEs, enable this option to optimize PDCCH decoding and save CPU
    */
    pdcch_decode_opt: false,
    pdcch_decode_opt_threshold: {{pdcch_decode_threshold|default(0.7)}},
    
    channel_sim: true, 
  }
],
