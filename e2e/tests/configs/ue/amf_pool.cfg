// -----------------------------------------------------------------------------
// UEs for the AMF pool test (one core with several AMFs of one AMF Set).
//
// Use it with an Open5GS core. The core has a subscriber for each UE: the IMSIs
// are consecutive from the IMSI of the testbed, and all UEs use the K and OPc of
// the testbed (see the nof_subscribers parameter of the core).
//
// Each UE registers from scratch, one after another every 0.5 seconds, and pings
// the UPF for 5 seconds:
//   * With "reestablishment", the UE does an RRC reestablishment in the middle of
//     the first ping.
//   * With "idle_duration" > 0, the UE stops the traffic, and the CU-CP inactivity
//     timer releases it to RRC_IDLE. After "idle_duration" seconds, the UE pings
//     again for 5 seconds. The UL data triggers a Service Request to the AMF of
//     the UE.
//   * With "speed" > 0, the UE moves between the two cells of
//     2cell_intrafreq_chsim.cfg, so it hands over between them.
// Then the UE deregisters and powers off.
// -----------------------------------------------------------------------------

{%- set nof_ue = nof_ue | default(24) %}
{%- set idle_duration = idle_duration | default(0) %}
{%- set reestablishment = reestablishment | default(false) %}
{%- set speed = speed | default(0) %}

{%- set power_on_stagger_delay = 0.5 %}
{%- set traffic_duration = 5 %}

// The UPF answers the pings on the first address of the UE subnet.
{%- set ping_addr = subnet_prefix ~ ".0.1" %}

// Time of the first ping of a UE after its power on, and duration of all the events of a UE.
{%- set first_ping_delay = 1 %}
{%- set traffic_end_delay = first_ping_delay + traffic_duration + (idle_duration + traffic_duration if idle_duration > 0 else 0) %}

  ue_list: [

{%- for i in range(nof_ue) %}
{%- set power_on_time = 0.5 + i * power_on_stagger_delay %}
{%- set first_ping_time = power_on_time + first_ping_delay %}
{%- set second_ping_time = first_ping_time + traffic_duration + idle_duration %}
{%- set traffic_end_time = power_on_time + traffic_end_delay %}

    /* UE idx {{ i + 1 }} */
    {
      ue_count: 1,
      imsi: "{{ '%015d' % (imsi | int + i) }}",
      sim_algo: "{{sim_algo}}",
      K: "{{k}}",
      opc: "{{opc}}",
      apn: "{{apn}}",
      attach_pdn_type: "ipv4",
      spec_tolerance: false,
      as_release: 15,
      ue_category: "nr",
      power_control_enabled: false,
      channel: {
        type: "awgn",
      },
      {%- if speed > 0 %}
      // Move between the cells at [-50, 0] and [50, 0] of 2cell_intrafreq_chsim.cfg.
      position: [0, 0],
      max_distance: 50,
      bounce: "back",
      speed: {{speed}}, // km/h
      direction: 0,
      {%- else %}
      position: [100, 0],
      speed: 0,
      {%- endif %}
      sim_events: [
        {
          event: "power_on",
          start_time: {{ power_on_time }},
        },
        {
          event: "ping",
          start_time: {{ first_ping_time }},
          end_time: {{ first_ping_time + traffic_duration }},
          dst_addr: "{{ping_addr}}",
          payload_len: 1000,
          delay: 0.2,
        },
        {%- if reestablishment %}
        {
          event: "rrc_reest",
          start_time: {{ first_ping_time + traffic_duration / 2 }},
        },
        {%- endif %}
        {%- if idle_duration > 0 %}
        // UL data after RRC_IDLE
        {
          event: "ping",
          start_time: {{ second_ping_time }},
          end_time: {{ second_ping_time + traffic_duration }},
          dst_addr: "{{ping_addr}}",
          payload_len: 1000,
          delay: 0.2,
        },
        {%- endif %}
        {
          event: "deregister",
          start_time: {{ traffic_end_time + 1 }},
        },
        {
          event: "power_off",
          start_time: {{ traffic_end_time + 2 }},
        },
        {%- if i == nof_ue - 1 %}
        {
          event: "quit",
          start_time: {{ traffic_end_time + 5 }},
        },
        {%- endif %}
      ]
    },
{%- endfor %}

  ]
