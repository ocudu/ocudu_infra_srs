cell_cfg:
  slicing:
    - sst: 2
      sd: 42
      sched_cfg:                              # Scheduler configuration for the slice
        min_prb_policy_ratio: 20                 # Optional UINT (0). Sets the minimum percentage of PRBs to be allocated to the slice. Supported [0 - 100].
        max_prb_policy_ratio: 30
    - sst: 1
      sd: 1
      sched_cfg:                              # Scheduler configuration for the slice
        min_prb_policy_ratio: 60                # Optional UINT (0). Sets the minimum percentage of PRBs to be allocated to the slice. Supported [0 - 100].
        max_prb_policy_ratio: 70
