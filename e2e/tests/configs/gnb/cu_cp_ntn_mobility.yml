# Declares one external NTN cell as a neighbour of the serving cell so that a
# measurement gap gets configured for the UE. The DU only builds a gap when a
# measObject's SSB frequency differs from the serving cell's, so the neighbour
# sits on a different band and SSB ARFCN than the serving cell (band 256,
# ssb_arfcn 437090).
#
# No DU serves this neighbour: it exists purely to get the gap configured, so
# that UL scheduling during a measurement gap is exercised under traffic.
# trigger_handover_from_measurements is left at its default (disabled) so no
# handover is ever attempted towards a cell that is not there.
#
# Cell ids follow gnb_id=411 at gnb_id_bit_length=32, i.e. (gnb_id << 4) |
# sector_id. The serving cell is sector 0 -> 0x19B0; the neighbour uses the
# next gnb_id (412) -> 0x19C0.
#
# The neighbour's satellite is defined inline rather than referencing a
# globally-defined ntn.satellites entry, and reuses the serving cell's orbit so
# it stays consistent with the scenario the test is running.

cu_cp:
  # The NTN neighbour info epoch time is derived from the DU reference time
  # reports, so the CU-CP rejects the config unless periodic reference time
  # reporting is enabled alongside NTN cells.
  f1ap:
    ref_time_reporting:
      enabled: true
      event_type: periodic
      periodicity_rf: 128
  mobility:
    ntn_update_period_ms: 1000
    cells:
      - nr_cell_id: 0x19B0
        ncells:
          - nr_cell_id: 0x19C0
            report_configs: [2]
      - nr_cell_id: 0x19C0
        gnb_id_bit_length: {{gnb_id_bit_length}}
        pci: 42
        plmn: "00101"
        tac: 7
        band: 254
        ssb_arfcn: 498030
        ssb_scs: {{common_scs}}
        ssb_period: 10
        ssb_offset: 0
        ssb_duration: 1
        ntn:
          epoch_timestamp: '{{utc_timestamp}}'
          ephemeris_orbital:
            eccentricity: {{eccentricity}}
            inclination: {{inclination}}
            longitude: {{longitude}}
            mean_anomaly: {{mean_anomaly}}
            periapsis: {{periapsis}}
            semi_major_axis: {{semi_major_axis}}
    report_configs:
      - report_cfg_id: 2
        report_type: event_triggered
        event_triggered_report_type: a3
        meas_trigger_quantity: rsrp
        meas_trigger_quantity_offset_db: 3
        hysteresis_db: 1
        time_to_trigger_ms: 100
