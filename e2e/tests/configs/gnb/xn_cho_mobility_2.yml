cu_cp:
  mobility:
    trigger_cho_on_ue_setup: true
    cho_timeout_ms: 60000
    trigger_handover_from_measurements: false
    cells:
      # Own gNB2 cell (PCI and SSB provided over F1)
      - nr_cell_id: 0x19C0
        ncells:
          - nr_cell_id: 0x19B0
            report_configs: [2]
      # External gNB1 cell (SSB/PCI provided here)
      - nr_cell_id: 0x19B0
        gnb_id_bit_length: {{gnb_id_bit_length}}
        plmn: "00101"
        tac: 7
        pci: 1
        ssb_arfcn: 624000
        band: 78
        ssb_scs: 30
        ssb_period: 10
        ssb_offset: 0
        ssb_duration: 5
        ncells:
          - nr_cell_id: 0x19C0
            report_configs: [2]
    report_configs:
      - report_cfg_id: 1
        report_type: periodical
        report_interval_ms: 480
      - report_cfg_id: 2
        report_type: cond_trigger
        event_triggered_report_type: a3
        meas_trigger_quantity: rsrp
        meas_trigger_quantity_offset_db: 3
        hysteresis_db: 0
        time_to_trigger_ms: 100
