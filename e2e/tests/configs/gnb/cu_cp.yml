{%- set ran_node_name = ran_node_name | default("ocudu01") %}
{%- set cu_cp_report_period = cu_cp_report_period | default(1000) %}
{%- set slice_sd = slice_sd | default(1) %}

gnb_id_bit_length: {{gnb_id_bit_length}}
ran_node_name: {{ran_node_name}}

# Baseline single slice configuration
cu_cp:
  e1ap:
    procedure_timeout: 4000
  amf:
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
                {% if slice_sd %}
                sd: {{slice_sd}}
                {% endif %}

pcap:
  ngap_enable: true
  ngap_filename: {{ngap_filename}}
  e1ap_enable: true
  e1ap_filename: {{e1ap_filename}}
  f1ap_enable: true
  f1ap_filename: {{f1ap_filename}}

metrics:
  layers:
    enable_rrc: true
    enable_ngap: true
  periodicity:
    cu_cp_report_period: {{cu_cp_report_period}}
