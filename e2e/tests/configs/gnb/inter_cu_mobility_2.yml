{%- set neighbor_ssb_arfcn = neighbor_ssb_arfcn | default(624000) %}
{%- set neighbor_band = neighbor_band | default(78) %}
{%- set neighbor_ssb_scs = neighbor_ssb_scs | default(30) %}
{#- Set to false to keep the neighbor cell definitions without ever handing the UE over #}
{%- set trigger_handover_from_measurements = trigger_handover_from_measurements | default(true) %}

gnb_id_bit_length: {{gnb_id_bit_length}}

cu_cp:
  mobility:
    trigger_handover_from_measurements: {{trigger_handover_from_measurements}}
    cells:
      - nr_cell_id: 0x19C0
        periodic_report_cfg_id: 1
        ncells:
          - nr_cell_id: 0x19B0
            report_configs: [2]
      - nr_cell_id: 0x19B0
        ncells:
          - nr_cell_id: 0x19C0
            report_configs: [2]
        gnb_id_bit_length: {{gnb_id_bit_length}}
        plmn: "00101"
        tac: 7
        pci: 1
        ssb_arfcn: {{neighbor_ssb_arfcn}}
        band: {{neighbor_band}}
        ssb_scs: {{neighbor_ssb_scs}}
        ssb_period: 10
        ssb_offset: 0
        ssb_duration: 5
    report_configs:
      - report_cfg_id: 1
        report_type: periodical
        report_interval_ms: 480
      - report_cfg_id: 2
        report_type: event_triggered
        event_triggered_report_type: a3
        meas_trigger_quantity: rsrp
        meas_trigger_quantity_offset_db: 3
        hysteresis_db: 0
        time_to_trigger_ms: 100
        t312: 200
