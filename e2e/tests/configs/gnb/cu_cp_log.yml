# Baseline log and PCAP config
log:
  hex_max_size: 32
  all_level: warning
  lib_level: warning
  config_level: warning
  cu_level: warning
  f1ap_level: warning
  f1ap_json_enabled: false
  e1ap_level: warning
  e1ap_json_enabled: false
  rrc_level: warning
  pdcp_level: warning
  ngap_level: warning
  xnap_level: warning
  sec_level: warning

pcap:
  ngap_enable: true
  ngap_filename: {{ngap_filename}}
  f1ap_enable: true
  f1ap_filename: {{f1ap_filename}}
  e1ap_enable: true
  e1ap_filename: {{e1ap_filename}}
