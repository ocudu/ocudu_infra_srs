{%- set gnb_du_id = gnb_du_id | default(0) %}
{%- set pci = pci | default(1) %}
{%- set dl_nr_arfcn = dl_nr_arfcn | default(626668) %}
{%- set sector_id = sector_id | default(0) %}
{%- set dmrs_additional_pos = dmrs_additional_pos | default(2) %}
{%- set pusch_max_ue_mcs = pusch_max_ue_mcs | default(27) %}
{%- set pusch_dec_max_iterations = pusch_dec_max_iterations | default(12) %}

gnb_id_bit_length: {{gnb_id_bit_length}}
gnb_du_id: {{gnb_du_id}}

cell_cfg:
  pci: {{pci}}
  nof_antennas_dl: {{nof_antennas_dl}}
  nof_antennas_ul: {{nof_antennas_ul}}
  dl_arfcn: {{dl_nr_arfcn}}
  band: {{band}}
  channel_bandwidth_MHz: {{bandwidth}}
  common_scs: {{common_scs}}
  sector_id: {{sector_id}}
  plmn: 00101
  pdsch:
    dmrs_additional_position: {{dmrs_additional_pos}}
    mcs_table: qam256
    max_ue_mcs: 27
  pusch:
    dmrs_additional_position: {{dmrs_additional_pos}}
    mcs_table: qam256
    max_ue_mcs: {{pusch_max_ue_mcs}}

expert_phy:
  pusch_channel_estimator_cfo_compensation: false
  pusch_dec_max_iterations: {{pusch_dec_max_iterations}}
  pusch_channel_estimator_td_strategy: interpolate
  pusch_channel_equalizer_algorithm: "zf"

pcap:
  rlc_enable: true
  rlc_rb_type: srb
  rlc_filename: {{rlc_filename}}
  f1ap_enable: true
  f1ap_filename: {{f1ap_filename}}

metrics:
  layers:
    enable_sched: true
    enable_mac: true
    enable_du_proc: true
    enable_executor: true
    enable_du_low: true
