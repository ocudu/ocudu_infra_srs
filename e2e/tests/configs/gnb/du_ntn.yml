{%- set dl_harq_disabled = dl_harq_disabled | default(false) %}
{%- set ul_harq_disabled = ul_harq_disabled | default(false) %}
{%- set ta_meas_slot_prohibit_period = ta_meas_slot_prohibit_period | default(0) %}
{%- set dl_freq = dl_freq | default(0) %}
{%- set ul_freq = ul_freq | default(0) %}
{%- set gw_altitude = gw_altitude | default(0) %}
{%- set gw_latitude = gw_latitude | default(0) %}
{%- set gw_longitude = gw_longitude | default(0) %}
{%- set ntn_ul_sync_validity_dur = ntn_ul_sync_validity_dur | default(5) %}
{%- set ta_common = ta_common | default(0.0) %}
{%- set ta_common_drift = ta_common_drift | default(0.0) %}
{%- set ta_common_drift_variant = ta_common_drift_variant | default(0.0) %}
{%- set feeder_link = feeder_link | default(false) %}

cell_cfg:
  prach:
    prach_config_index: 31
    max_msg3_harq_retx: 0
    zero_correlation_zone: 0
  pdcch:
    common:
      ss1_n_candidates: [0, 0, 3, 0, 0]
    dedicated:
      ss2_n_candidates: [0, 0, 3, 0, 0]
  pdsch:
    mcs_table: qam256
    harq_feedback_disabled: {{dl_harq_disabled|lower}}
    {% if not dl_harq_disabled %}
    nof_harqs: 32
    max_nof_harq_retxs: 4
    {% endif %}
  pusch:
    mcs_table: qam256
    harq_mode_b: {{ul_harq_disabled|lower}}
    {% if not ul_harq_disabled %}
    nof_harqs: 32
    max_nof_harq_retxs: 4
    {% endif %}
  pucch:
    sr_period_ms: 80
    f1_nof_cyclic_shifts: 6
  csi:
    csi_rs_period: 80
  ssb:
    ssb_period: 10
  sib:
    t300: 2000
    t301: 2000
    t311: 3000
    t319: 2000
    si_window_length: 20
    si_sched_info:
      - si_period: 16               # Set SIB2 period.
        sib_mapping: 2              # Enable SIB2.
      - si_period: 16               # Set SIB19 period.
        sib_mapping: 19             # Enable SIB19.
        si_window_position: 2       # Set SIB19 position.
    sib2:
  ta:
    ta_cmd_offset_threshold: 1
    ta_measurement_slot_period: 1000
    ta_measurement_slot_prohibit_period: {{ta_meas_slot_prohibit_period}}
    ta_outlier_detection_zscore_threshold: 0.0
    ta_target: 0
  ntn:
    cell_specific_koffset: {{cell_specific_koffset}}
    ephemeris_orbital:
      eccentricity: {{eccentricity}}
      inclination: {{inclination}}
      longitude: {{longitude}}
      mean_anomaly: {{mean_anomaly}}
      periapsis: {{periapsis}}
      semi_major_axis: {{semi_major_axis}}
    epoch_time:
      sfn: 0  # only placeholders, gnb overwrites it
      subframe_number: 0  # only placeholders, gnb overwrites it
    epoch_timestamp: '{{utc_timestamp}}'
    ntn_ul_sync_validity_dur: {{ntn_ul_sync_validity_dur}}
    feeder_link:
      dl_freq: {{dl_freq}}
      enable_doppler_compensation: false
      ul_freq: {{ul_freq}}
    {% if feeder_link %}
    gateway_location:
      altitude: {{gw_altitude}}
      latitude: {{gw_latitude}}
      longitude: {{gw_longitude}}
    {% else %}
    ta_info:
      ta_common: {{ta_common}}
      ta_common_drift: {{ta_common_drift}}
      ta_common_drift_variant: {{ta_common_drift_variant}}
    {% endif %}
    use_state_vector: false
