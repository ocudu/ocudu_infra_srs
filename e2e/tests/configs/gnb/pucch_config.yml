{%- set pucch_format = pucch_format | default("f1_and_f2") %}
{%- set resource_set_size = resource_set_size | default(8) %}
{%- set nof_cell_sr_res = nof_cell_sr_res | default(7) %}
{%- set nof_cell_csi_res = nof_cell_csi_res | default(7) %}

cell_cfg:
  pucch:
    formats: {{pucch_format}}
    resource_set_size: {{resource_set_size}}
    nof_cell_res_set_configs: 2
    f1_nof_cyclic_shifts: 2
    f1_enable_occ: false
    nof_cell_sr_res: {{nof_cell_sr_res}}
    nof_cell_csi_res: {{nof_cell_csi_res}}
