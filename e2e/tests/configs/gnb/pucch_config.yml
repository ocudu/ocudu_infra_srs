cell_cfg:
  pucch:
    formats: {{pucch_format | default("f1_and_f2")}}
    resource_set_size: {{resource_set_size|default(8)}}
    nof_cell_res_set_configs: {{nof_cell_res_set_configs|default(2)}}
    f1_nof_cyclic_shifts: {{f1_nof_cyclic_shifts|default(2)}}
    f1_enable_occ: {{f1_enable_occ|default("false")}}
    nof_cell_sr_res: {{nof_cell_sr_res|default(7)}}
    nof_cell_csi_res: {{nof_cell_csi_res|default(7)}}
