expert_phy:
  doa_enabled: true

# The cell panel of the UE channel simulator points in the +y direction ("antenna_orientation: 90" in the UE config).
# The bearing must be equal to this orientation. The gNB uses it to translate the angle of arrival from the antenna
# coordinate system (LCS) to the global coordinate system (GCS).
cell_cfg:
  antenna_orientation:
    bearing: 90
