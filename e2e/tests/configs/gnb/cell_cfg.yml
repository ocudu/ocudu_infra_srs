gnb_id_bit_length: 32
gnb_du_id: {{gnb_du_id_cfg|default(0)}}


cell_cfg:
  pci: {{pci_cfg|default(1)}}
  nof_antennas_dl: {{nof_antennas|default(1)}}
  nof_antennas_ul: {{nof_antennas|default(1)}}
  dl_arfcn: {{cfg_earfcn|default(626668)}}
  band: {{cfg_band|default(78)}}
  channel_bandwidth_MHz: {{cfg_bandwidth|default(100)}}
  common_scs: {{cfg_common_scs|default(30)}}
  sector_id: {{sector_id_cfg|default(0)}}
  plmn: {{plmn_cfg|default("00101")}}
  pdsch:
    dmrs_additional_position: {{dmrs_additional_pos|default(2)}}
  pusch:
    dmrs_additional_position: {{dmrs_additional_pos|default(2)}}

expert_phy:
  pusch_channel_estimator_cfo_compensation: false

pcap:
  rlc_enable: true
  rlc_rb_type: srb
  rlc_filename: {{rlc_filename}}

log:
  all_level: info
  rlc_level: warning
  config_level: debug

metrics:
  autostart_stdout_metrics: true
  enable_log: true
  enable_json: true
  layers:
    enable_sched: true
    enable_mac: true
    enable_du_proc: true
