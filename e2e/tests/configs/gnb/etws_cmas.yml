cell_cfg:
  sib:
    si_window_length: 20
    etws:
      si_period: 16
      test:
        message_id: 0x1104       # ETWS CBS ID for other emergency types.
        serial_num: 0x3000
        warning_type: 0x0980     # Other warning type, user alert, popup
        data_coding_scheme: 0x48 # 16-bit UCS-2 text encoding
        warning_message: "ETWS message"
    cmas:
      si_period: 16
      test:
        message_id: 0x1112       # CMAS Presidential alert type.
        serial_num: 0x3005
        data_coding_scheme: 0x48 # 16-bit UCS-2 text encoding
        warning_message: "CMAS message"
  pdcch:
    common:
      ss1_n_candidates: [0, 0, 2, 0, 0]
