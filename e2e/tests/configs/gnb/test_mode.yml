{%- set nof_test_ues = nof_test_ues | default(2) %}
{%- set test_ue_ri = test_ue_ri | default(1) %}

# The gNB creates the test UEs itself, so no UE (or simulator) is attached
test_mode:
  test_ue:
    rnti: 0x1234
    cqi: 15
    ri: {{test_ue_ri}}
    pdsch_active: true
    pusch_active: true
    nof_ues: {{nof_test_ues}}

cu_up:
  warn_on_drop: False
