{#- Minimum required RX level for intra frequency cell reselection, in dBm. Tests relying on
    reselection have to lower it: the channel simulator setups measure RSRPs well below the
    default, so no neighbor cell ever meets the S criterion of TS 38.304. #}
{%- set sib2_q_rx_lev_min = sib2_q_rx_lev_min | default(-70) %}

cell_cfg:
  sib:
    t300: 1000
    t301: 1000
    t310: 1000
    t319: 1000
    t311: 3000
    n310: 1
    n311: 1
    si_window_length: 40
    si_sched_info:
      - si_period: 64
        sib_mapping: 2
      - si_period: 64
        sib_mapping: 3
      - si_period: 64
        sib_mapping: 4
      - si_period: 64
        sib_mapping: 5
    sib2:
      q_hyst: 3
      thresh_serving_low_p: 0
      cell_reselection_priority: 6
      q_rx_lev_min: {{sib2_q_rx_lev_min}}
      s_intra_search_p: 62
      t_reselection_nr: 1
    sib3:
      intra_freq_neigh_cell_list:
        - pci: 2
          q_offset_cell: 3
        - pci: 3
          q_offset_cell: 3
      intra_freq_excluded_cell_list:
        - start: 4
          size: 4
    sib4:
      inter_freq_carrier_freq_list:
        - arfcn: 520003
          ssb_scs: 30
          derive_ssb_index_from_cell: true
          q_rx_lev_min: -80
          thresh_x_high_p: 4
          thresh_x_low_p: 4
          q_offset_freq: -4
    sib5:
      t_reselection_eutra: 2
      carrier_freq_list_eutra:
        - earfcn: 38950
          allowed_meas_bandwidth: 100
          presence_antenna_port1: false
          cell_reselection_priority: 5
          thresh_x_high: 8
          thresh_x_low: 8
          q_rx_lev_min: -80
          q_qual_min: -20
          p_max_eutra: -2
