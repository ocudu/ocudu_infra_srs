# PUCCH and UL grant resources are sized for the whole UE population of the cell
cell_cfg:
  pucch:
    sr_period_ms: 20
    resource_set_size: 8
    nof_cell_res_set_configs: 2
    nof_cell_sr_res: 80
    nof_cell_csi_res: 80
  csi:
    csi_rs_period: 40
  ul_common:
    max_ul_grants_per_slot: 128
    max_pucchs_per_slot: 120
  pusch:
    rv_sequence: 0
  tdd_ul_dl_cfg:
    nof_dl_slots: 6
    nof_dl_symbols: 10
    nof_ul_slots: 3

expert_phy:
  max_request_headroom_slots: 0
  max_proc_delay: 4
