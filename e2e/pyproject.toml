[tool.pytest.ini_options]
addopts = [
  "--tb=short",
  "--random-order",
  "--random-order-bucket=class",
  "--log-folder=./log",
  "--html=./log/report.html",
  "--self-contained-html",
  "--junitxml=./log/out.xml",
  "--reruns=3",
  "--reruns-delay=10",
  "--only-rerun=Timeout reached while reserving",
  "--only-rerun=Error creating the pod",
  "--only-rerun=Failed to connect to remote host",
  "--only-rerun=Exception calling application",
  "--only-rerun=socket is already closed",
  "--only-rerun=failed to connect to all addresses",
  "--only-rerun=Agent not ready",
  "--only-rerun=License unavailable",
  "--only-rerun=exit code 66",
  "--only-rerun=Viavi API call timed out",
  "--only-rerun=time-out in waiting for Cell Frame Boundary detection",
  "--only-rerun=failed to start",
]
filterwarnings = [
  "ignore:HTTPResponse.getheaders:DeprecationWarning",
]
generate_report_on_test = true
junit_logging = "all"
log_cli = true
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_level = "DEBUG"
log_level = "INFO"
