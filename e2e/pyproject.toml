minversion = "6.0"
python_files = [
  "tests/*.py",
]
render_collapsed = true

[tool.black]
line-length = 120

[tool.isort]
atomic = true
combine_as_imports = true
float_to_top = true
force_alphabetical_sort_within_sections = true
include_trailing_comma = true
line_length = 120
profile = "black"
remove_redundant_aliases = true

[tool.mypy]
ignore_missing_imports = true
install_types = true
non_interactive = true
warn_return_any = true
warn_unused_configs = true

[tool.pylint]
disable = ["no-name-in-module", "duplicate-code", "import-error", "too-many-lines"]
ignore-signatures = true
max-line-length = 120

[tool.tox]
legacy_tox_ini = """
[tox]
minversion = 4.4.0
envlist =
  format
  lint
  type

[testenv:format]
skip_install = true
deps =
  black <= 26.3.1
  isort <= 8.0.1
commands =
  black --check --diff --color tests scripts conftest.py
  isort --check tests scripts conftest.py

[testenv:format_apply]
skip_install = true
deps =
  black <= 26.3.1
  isort <= 8.0.1
commands =
  black tests scripts conftest.py
  isort tests scripts conftest.py

[testenv:lint]
skip_install = true
deps =
  pylint <= 4.0.5
commands =
  pylint tests scripts conftest.py

[testenv:type]
skip_install = true
deps =
  mypy <= 1.20.0
commands =
  mypy --check-untyped-defs tests scripts conftest.py
"""
