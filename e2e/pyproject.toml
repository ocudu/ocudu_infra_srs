minversion = "6.0"
python_files = [
  "tests/*.py",
]
render_collapsed = true

[tool.black]
line-length = 120

[tool.isort]
atomic = true
combine_as_imports = true
float_to_top = true
force_alphabetical_sort_within_sections = true
include_trailing_comma = true
line_length = 120
profile = "black"
remove_redundant_aliases = true

[tool.mypy]
install_types = true
mypy_path = [
  "../retina/launcher/src",
  "../retina/client/src",
  "../retina/orchestrator/src",
  "../retina/protocol/src",
  "../retina/viavi/src",
]
non_interactive = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "retina.protocol.base_pb2",
  "retina.protocol.base_pb2_grpc",
  "retina.protocol.ue_pb2",
  "retina.protocol.ue_pb2_grpc",
  "retina.protocol.gnb_pb2",
  "retina.protocol.gnb_pb2_grpc",
  "retina.protocol.fivegc_pb2",
  "retina.protocol.fivegc_pb2_grpc",
  "retina.protocol.ric_pb2",
  "retina.protocol.ric_pb2_grpc",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "jinja2",
  "jinja2.meta",
  "jinja2.nodes",
  "gitlab",
  "gitlab.v4.objects",
  "pytest_metadata.plugin",
  "pytest_html",
  "rich.console",
  "rich.table",
]
ignore_missing_imports = true

[tool.pylint]
disable = ["duplicate-code"]
ignore-signatures = true
max-line-length = 120

[tool.pylint.typecheck]
ignored-modules = ["google.protobuf.*", "grpc_health.*", "retina.protocol.*pb2*"]

[tool.tox]
legacy_tox_ini = """
[tox]
minversion = 4.4.0
envlist =
  format
  lint
  type
  static

[testenv:format]
skip_install = true
deps =
  black <= 26.3.1
  isort <= 8.0.1
commands =
  black tests scripts conftest.py
  isort tests scripts conftest.py

[testenv:lint]
skip_install = true
deps =
  pylint <= 4.0.5
  pylint-pytest <= 1.1.8
  -e ../retina/launcher
  -e ../retina/client
  -e ../retina/orchestrator
  -e ../retina/protocol
  -e ../retina/viavi
commands =
  pylint tests scripts conftest.py

[testenv:type]
skip_install = true
deps =
  mypy <= 1.20.0
  pytest < 9
commands =
  mypy --check-untyped-defs tests scripts conftest.py

[testenv:static]
skip_install = true
deps =
  jinja2
  jsonschema
  pyyaml
commands =
  python3 scripts/static_checks.py
"""
