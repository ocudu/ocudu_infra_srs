# Workflow Variables
#
# ON_DEFAULT_BRANCH  Commit in the default branch
# ON_MR              Commit on a merge request
# ON_SCHEDULE        Scheduled pipeline to check the default branch
#
# Usage
# ON_X variables has "true" value when the pipeline runs in that scenario
# Otherwise, its value is empty. Then the following expressions are equivalent:
# rules:
#   - if: $ON_MR
# and
# rules:
#   - if: $ON_MR == "true"

workflow:
  rules:
    # There is no need to import this file in a child pipeline (same project or multi project)!!!
    # - We always want to run the child pipeline.
    #     Filter is done in the parent trigger job & for each jon inside the child pipeline
    # - ON_X variables are available in the child pipeline because they are inherited from
    #     - Global parent pipeline variables (its workflow:rules)
    #     - Parent trigger job specific variables
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "web"
      variables:
        ON_WEB: "true"
    - if: $CI_PIPELINE_SOURCE == "api"
      variables:
        ON_API: "true"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        ON_SCHEDULE: "true"
    - if: $CI_COMMIT_TAG
      variables:
        ON_TAG: "true"
    - if: $CI_MERGE_REQUEST_IID
      variables:
        ON_MR: "true"
      # Why $CI_MERGE_REQUEST_IID instead of $CI_PIPELINE_SOURCE == "merge_request_event" ?
      # Child pipelines in a MR have CI_PIPELINE_SOURCE = parent_pipeline
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        ON_DEFAULT_BRANCH: "true"
    - when: never

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "1"
  GET_SOURCES_ATTEMPTS: 3
  ARTIFACT_DOWNLOAD_ATTEMPTS: 3
  RESTORE_CACHE_ATTEMPTS: 3
  CI_TOOLS_REPO: ci/tools
  CLICOLOR_FORCE: 1
  FORCE_COLOR: 1

default:
  interruptible: true
  retry:
    max: 2
    when:
      - unknown_failure
      - api_failure
      - runner_system_failure
      - runner_unsupported
      - unmet_prerequisites
      - scheduler_failure
      - data_integrity_failure
