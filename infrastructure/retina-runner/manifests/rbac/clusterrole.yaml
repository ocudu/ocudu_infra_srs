apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: read-all-resources-${organization_name}
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps", "batch", "extensions"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "delete"]
