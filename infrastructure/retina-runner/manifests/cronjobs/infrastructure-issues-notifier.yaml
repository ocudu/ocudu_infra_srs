apiVersion: batch/v1
kind: CronJob
metadata:
  name: infrastructure-issues-notifier-${organization_name}
  namespace: ${namespace}
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 50
      template:
        metadata:
          annotations:
            retinaRunnerJob: "true"
        spec:
          serviceAccountName: retina-runner-sa-${organization_name}
          containers:
            - name: infrastructure-issues-notifier-script
              image: ${image_repository}:${image_tag}
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  python3 /usr/local/bin/gitlab_checker.py --check-before 1200 --group-id "${gitlab_group_id}"
              env:
                - name: GITLAB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gitlabtoken-${organization_name}
                      key: GITLAB_TOKEN
          imagePullSecrets:
            - name: registry-credentials
          tolerations:
            - key: ${taint_key}
              operator: "Equal"
              value: ${taint_value}
              effect: "NoSchedule"
          restartPolicy: Never
