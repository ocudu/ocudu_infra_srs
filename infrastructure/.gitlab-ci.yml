spec:
  inputs:
    infra_srs_path:
      type: string
      description: "ocudu_infra_srs repository path (namespace/project, e.g. ocudu/ocudu_infra_srs)."
      default: $CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
    infra_srs_ref:
      type: string
      description: "ocudu_infra_srs branch or tag."
      default: $CI_COMMIT_REF_NAME
    retina_pypi_index:
      type: string
      description: "retina pypi repository url"
      default: ${RETINA_PYPI_INDEX}
    retina_registry_uri:
      type: string
      description: "retina container registry url"
      default: ${RETINA_REGISTRY_URI}
    kubeconfig_var:
      type: string
      description: "Name of the file-type CI/CD variable containing the kubeconfig (e.g. MY_KUBECONFIG)."
    runner_tags:
      type: array
      description: "Runner tags for jobs that need access to the cluster."
    state_name:
      type: string
      default: retina-cluster
      description: "Terraform state name. Use a unique name per cluster (e.g. retina-cluster-setup)."
    root_dir:
      type: string
      description: "Directory containing the consumer's main.tf."
---
variables:
  KUBECONFIG_VAR: $[[ inputs.kubeconfig_var ]]
  TF_VAR_infra_srs_path: $CI_SERVER_HOST/$[[ inputs.infra_srs_path ]]
  TF_VAR_infra_srs_ref: $[[ inputs.infra_srs_ref ]]
  TF_VAR_retina_version: $RETINA_VERSION
  TF_VAR_retina_registry_uri: $[[ inputs.retina_registry_uri ]]

include:
  - local: retina/version.yml
  - component: gitlab.com/components/opentofu/job-templates@3.11.0
    inputs:
      root_dir: $[[ inputs.root_dir ]]
      state_name: $[[ inputs.state_name ]]
      auto_define_backend: true

stages:
  - fmt
  - validate
  - plan
  - apply

.cluster-base:
  tags: $[[ inputs.runner_tags ]]
  retry: 2
  variables:
    TWINE_REPO: $[[ inputs.retina_pypi_index ]]
  before_script:
    - eval "export KUBE_CONFIG_PATH=\${$KUBECONFIG_VAR}"
    - apk add --no-cache py3-pip
    - pip install --break-system-packages --extra-index-url $TWINE_REPO retina-orchestrator
  cache: []

fmt:
  stage: fmt
  extends:
    - .opentofu:fmt
    - .cluster-base
  rules:
    - if: $ON_MR
      allow_failure: false

validate:
  stage: validate
  extends:
    - .opentofu:validate
    - .cluster-base
  rules:
    - if: $ON_MR

plan:
  stage: plan
  extends:
    - .opentofu:plan
    - .cluster-base
  rules:
    - if: $ON_MR
    - if: $ON_DEFAULT_BRANCH

apply:
  stage: apply
  extends:
    - .opentofu:apply
    - .cluster-base
  rules:
    - if: $ON_MR
      when: manual
      allow_failure: true
    - if: $ON_DEFAULT_BRANCH
