include:
  - project: ocudu/ocudu
    file: .gitlab/ci-shared/workflow.yml
    ref: dev
  - local: infrastructure/base/terraform.yml

variables:
  OCUDU_BRANCH: main

stages:
  - generate
  - validate
  - plan
  - apply

generate:
  stage: generate
  image: python:3.11
  before_script:
    - pip install --quiet pyyaml jinja2
  script:
    - echo "Generating GitLab runner configuration..."
    - git clone --depth 1 --branch ${OCUDU_BRANCH:-main} https://gitlab.com/ocudu/ocudu_infra_srs.git /tmp/ocudu_infra_srs
    - python3 /tmp/ocudu_infra_srs/infrastructure/generator/generate.py "$CLUSTER_DEF" "$CLUSTER_TYPE" "$OUTPUT_DIR/tf" --repo-root .
  rules:
    - if: $ON_MR
    - if: $ON_DEFAULT_BRANCH
  artifacts:
    paths:
      - "${OUTPUT_DIR}/tf/*.tf"
      - "${OUTPUT_DIR}/manifests/*.yaml"
    expire_in: 1 hour
    when: on_success

check-format:
  stage: validate
  extends: .terraform-base
  tags:
    - ${RUNNER_TAGS}
  variables:
    TF_DIR: "${OUTPUT_DIR}/tf"
    TF_STATE_NAME: ${TF_STATE_NAME}
  needs:
    - job: generate
      artifacts: true
  rules:
    - if: $ON_MR
    - if: $ON_DEFAULT_BRANCH
  script:
    - terraform fmt -check -diff

validate:
  stage: validate
  extends: .terraform-base
  tags:
    - ${RUNNER_TAGS}
  variables:
    TF_DIR: "${OUTPUT_DIR}/tf"
    TF_STATE_NAME: ${TF_STATE_NAME}
  needs:
    - job: generate
      artifacts: true
  rules:
    - if: $ON_MR
    - if: $ON_DEFAULT_BRANCH
  script:
    - terraform validate

plan:
  extends: .terraform-base
  stage: plan
  tags:
    - ${RUNNER_TAGS}
  variables:
    TF_DIR: "${OUTPUT_DIR}/tf"
    TF_STATE_NAME: ${TF_STATE_NAME}
  rules:
    - if: $ON_MR
  needs:
    - job: generate
      artifacts: true
  script:
    - terraform plan

runner-quarantine-apply:
  stage: apply
  extends: .terraform-base
  tags:
    - ${RUNNER_TAGS}
  variables:
    TF_DIR: "${OUTPUT_DIR}/tf"
    TF_STATE_NAME: ${TF_STATE_NAME}
    RUNNER_UPDATE_TOKEN: ${RUNNER_UPDATE_TOKEN_VAR}
    RUNNERS_DEF: ${RUNNERS_DEF}
  needs:
    - job: generate
      artifacts: true
  rules:
    - if: $ON_MR
      when: manual
      allow_failure: true
    - if: $ON_DEFAULT_BRANCH
  script:
    - cd "$CI_PROJECT_DIR"
    - echo "Processing $CI_PROJECT_DIR/$RUNNERS_DEF"
    - git clone --depth 1 --branch ${OCUDU_BRANCH:-main} https://gitlab.com/ocudu/ocudu_infra_srs.git /tmp/ocudu_infra_srs
    - chmod +x /tmp/ocudu_infra_srs/infrastructure/gitlab-runner/runner-quarantine-apply.sh
    - /tmp/ocudu_infra_srs/infrastructure/gitlab-runner/runner-quarantine-apply.sh "${OUTPUT_DIR}/tf" "$CI_PROJECT_DIR/$RUNNERS_DEF" "$RUNNER_UPDATE_TOKEN"
