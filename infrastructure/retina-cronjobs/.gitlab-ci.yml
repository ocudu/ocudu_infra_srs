include:
  - project: ocudu/ocudu
    file: .gitlab/ci-shared/workflow.yml
    ref: dev
  - project: ocudu/ocudu
    file: .gitlab/ci-shared/docker.yml
    ref: dev
  - local: infrastructure/base/terraform.yml
  - local: infrastructure/retina-cronjobs/version.yml

stages:
  - validate
  - plan
  - apply

variables:
  OCUDU_BRANCH: main

.retina-cronjobs-setup:
  &setup-retina-cronjobs-files # Clone ocudu_infra_srs to get the TF files and manifests
  - apk add --no-cache git
  - git clone --depth 1 --branch ${OCUDU_BRANCH} https://gitlab.com/ocudu/ocudu_infra_srs.git /tmp/ocudu_infra_srs
  - mkdir -p infrastructure/retina-cronjobs
  - cp -r /tmp/ocudu_infra_srs/infrastructure/retina-cronjobs/tf infrastructure/retina-cronjobs/
  - cp -r /tmp/ocudu_infra_srs/infrastructure/retina-cronjobs/manifests infrastructure/retina-cronjobs/

check-format:
  extends: .terraform-base
  variables:
    TF_DIR: "infrastructure/retina-cronjobs/tf"
  stage: validate
  tags:
    - ${RUNNER_TAGS}
  before_script:
    - *setup-retina-cronjobs-files
    - |
      eval KUBECONFIG_PATH="\$$KUBECONFIG_VAR_NAME"
      mkdir -p ~/.kube/
      cp $KUBECONFIG_PATH ~/.kube/config
      chmod 600 ~/.kube/config
    - cd $TF_DIR
    - terraform init --backend-config=backend.tfbackend --backend-config=username=$CODEBOT_USERNAME --backend-config=password=$CODEBOT_TOKEN --backend-config="address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}" --backend-config="lock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock" --backend-config="unlock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock"
  rules:
    - if: $ON_MR
  script:
    - terraform fmt -check

validate:
  extends: .terraform-base
  stage: validate
  variables:
    TF_DIR: "infrastructure/retina-cronjobs/tf"
  tags:
    - ${RUNNER_TAGS}
  before_script:
    - *setup-retina-cronjobs-files
    - |
      eval KUBECONFIG_PATH="\$$KUBECONFIG_VAR_NAME"
      mkdir -p ~/.kube/
      cp $KUBECONFIG_PATH ~/.kube/config
      chmod 600 ~/.kube/config
    - cd $TF_DIR
    - terraform init --backend-config=backend.tfbackend --backend-config=username=$CODEBOT_USERNAME --backend-config=password=$CODEBOT_TOKEN --backend-config="address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}" --backend-config="lock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock" --backend-config="unlock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock"
  rules:
    - if: $ON_MR
  script:
    - terraform validate

##############################################
## Generic Retina Runner CronJob Deployment ##
##############################################
# This is a generic template job that accepts all cluster-specific
# parameters from the calling pipeline (private repo).
#
# Required variables (must be provided by parent pipeline):
#   KUBECONFIG_VAR_NAME: Name of the CI/CD variable containing kubeconfig path
#   NAMESPACE: Kubernetes namespace for deployment
#   TF_STATE_NAME: Terraform state name
#   ORGANIZATION_NAME: Organization identifier for resources
#   GROUP_ID: GitLab group ID
#   RUNNERS_FILE_PATH: Path to runners definition file
#   ENABLED_CRONJOBS: JSON array of enabled cronjobs
#   RUNNER_TAGS: GitLab runner tags (comma-separated or array)

plan:
  extends: .terraform-base
  stage: plan
  tags:
    - ${RUNNER_TAGS}
  variables:
    TF_DIR: "infrastructure/retina-cronjobs/tf"
    TAINT_KEY: "purpose"
    TAINT_VALUE: "retina-e2e"
  rules:
    - if: $ON_MR
  before_script:
    - *setup-retina-cronjobs-files
    - mkdir -p ~/.kube/
    - |
      eval K_PATH="\$$KUBECONFIG_VAR_NAME"
      cp $K_PATH ~/.kube/config
    - chmod 600 ~/.kube/config
    - cd $TF_DIR
    - terraform init --backend-config=backend.tfbackend --backend-config=username=$CODEBOT_USERNAME --backend-config=password=$CODEBOT_TOKEN --backend-config="address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}" --backend-config="lock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock" --backend-config="unlock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock"
  script:
    - |
      eval KUBECONFIG_PATH="\$$KUBECONFIG_VAR_NAME"
      terraform plan \
        -var="kubeconfig=$KUBECONFIG_PATH" \
        -var="namespace=$NAMESPACE" \
        -var="image_repository=${RETINA_REGISTRY_URI}/cronjobs" \
        -var="retina_cronjobs_version=$RETINA_CRONJOBS_VERSION" \
        -var="taint_key=$TAINT_KEY" \
        -var="taint_value=$TAINT_VALUE" \
        -var="gitlab_group_id=$GROUP_ID" \
        -var="organization_name=$ORGANIZATION_NAME" \
        -var="enabled_cronjobs=$ENABLED_CRONJOBS" \
        -var='runners_file=["'"${CI_PROJECT_DIR}/${RUNNERS_FILE_PATH}"'"]'

deploy cronjob:
  extends: .terraform-base
  stage: apply
  before_script:
    - *setup-retina-cronjobs-files
    - mkdir -p ~/.kube/
    - |
      eval K_PATH="\$$KUBECONFIG_VAR_NAME"
      cp $K_PATH ~/.kube/config
    - chmod 600 ~/.kube/config
    - cd $TF_DIR
    - terraform init --backend-config=backend.tfbackend --backend-config=username=$CODEBOT_USERNAME --backend-config=password=$CODEBOT_TOKEN --backend-config="address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}" --backend-config="lock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock" --backend-config="unlock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock"
  tags:
    - ${RUNNER_TAGS}
  variables:
    TF_DIR: "infrastructure/retina-cronjobs/tf"
    TAINT_KEY: "purpose"
    TAINT_VALUE: "retina-e2e"
  rules:
    - if: $ON_DEFAULT_BRANCH
    - if: $ON_MR
      when: manual
      allow_failure: true
  script:
    - |
      eval KUBECONFIG_PATH="\$$KUBECONFIG_VAR_NAME"
      terraform apply -auto-approve \
        -var="kubeconfig=$KUBECONFIG_PATH" \
        -var="namespace=$NAMESPACE" \
        -var="image_repository=${RETINA_REGISTRY_URI}/cronjobs" \
        -var="retina_cronjobs_version=$RETINA_CRONJOBS_VERSION" \
        -var="taint_key=$TAINT_KEY" \
        -var="taint_value=$TAINT_VALUE" \
        -var="gitlab_group_id=$GROUP_ID" \
        -var="organization_name=$ORGANIZATION_NAME" \
        -var="enabled_cronjobs=$ENABLED_CRONJOBS" \
        -var='runners_file=["'"${CI_PROJECT_DIR}/${RUNNERS_FILE_PATH}"'"]'
