apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${name}-${suffix}
  namespace: ${namespace}
spec:
  schedule: "${schedule}"
  timeZone: "${timezone}"
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 50
      template:
        metadata:
          annotations:
            retinaRunnerJob: "true"
        spec:
          serviceAccountName: retina-cronjobs-sa-${suffix}
          volumes:
            - name: scripts
              configMap:
                name: ${scripts_configmap}
                defaultMode: 0o755
          containers:
            - name: amarisoft-license-script
              image: ${retina_registry_uri}/launcher:${retina_version}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh"]
              args:
                - "-c"
                - |
                  set -euo pipefail
                  python3 /usr/local/bin/amarisoft_license.py --incluster ${join(" ", extra_args)}
              env:
                - name: GITLAB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gitlabtoken-${suffix}
                      key: GITLAB_TOKEN
              volumeMounts:
                - name: scripts
                  mountPath: /usr/local/bin/amarisoft_license.py
                  subPath: amarisoft_license.py
          imagePullSecrets:
            - name: registry-credentials
          tolerations: ${jsonencode(tolerations)}
          restartPolicy: Never
