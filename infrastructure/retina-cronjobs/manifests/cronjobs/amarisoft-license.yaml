apiVersion: batch/v1
kind: CronJob
metadata:
  name: amarisoft-license-${organization_name}
  namespace: ${namespace}
spec:
  schedule: "* * * * *"  # Every minute
  timeZone: "Europe/Madrid"
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 50
      template:
        metadata:
          annotations:
            retinaRunnerJob: "true"
        spec:
          serviceAccountName: retina-cronjobs-sa-${organization_name}
          containers:
            - name: amarisoft-license-script
              image: ${image_repository}:${image_tag}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh"]
              args:
                - "-c"
                - |
                  set -euo pipefail
                  python3 /usr/local/bin/amarisoft_license.py --incluster
              env:
                - name: GITLAB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gitlabtoken-${organization_name}
                      key: GITLAB_TOKEN
          imagePullSecrets:
            - name: registry-credentials
          tolerations:
            - key: ${taint_key}
              operator: "Equal"
              value: ${taint_value}
              effect: "NoSchedule"
          restartPolicy: Never
