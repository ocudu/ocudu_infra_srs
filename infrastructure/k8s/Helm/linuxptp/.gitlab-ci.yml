include:
  - project: ocudu/ocudu
    file: .gitlab/ci-shared/workflow.yml
    ref: dev
  - local: infrastructure/base/terraform.yml

variables:
  OCUDU_BRANCH: main
  # Required variables (must be passed from parent pipeline):
  # - RUNNER_TAGS: GitLab runner tags (e.g., "terraform")
  # - KUBECONFIG_VAR_NAME: Name of the variable containing kubeconfig path
  # - TF_STATE_NAME: Terraform state name (e.g., "linuxptp")
  # - CLUSTER_DEF: Path to cluster definition file
  # - CLUSTER_TYPE: Cluster type identifier
  # - OUTPUT_DIR: Output directory for generated files
  # - SERVICE_DEF: Path to service definition file

stages:
  - generate
  - validate
  - plan
  - apply

generate:
  stage: generate
  image: python:3.11
  before_script:
    - pip install --quiet pyyaml jinja2
  script:
    - echo "Generating linuxptp Helm configuration..."
    - git clone --depth 1 --branch ${OCUDU_BRANCH:-main} https://gitlab.com/ocudu/ocudu_infra_srs.git /tmp/ocudu_infra_srs
    - python3 /tmp/ocudu_infra_srs/infrastructure/generator/generate.py "$CLUSTER_DEF" linuxptp "$OUTPUT_DIR" --services-file "$SERVICE_DEF" --repo-root .
    - cp /tmp/ocudu_infra_srs/infrastructure/k8s/Helm/linuxptp/main.tf "$OUTPUT_DIR/"
    - cp /tmp/ocudu_infra_srs/infrastructure/k8s/Helm/linuxptp/backend.tfbackend "$OUTPUT_DIR/"
  rules:
    - if: $ON_MR
    - if: $ON_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
  artifacts:
    paths:
      - "${OUTPUT_DIR}/*.tf"
      - "${OUTPUT_DIR}/*.tfbackend"
      - "k8s/Helm/linuxptp/manifests/*.yaml"
    expire_in: 1 hour
    when: on_success

.linuxptp-base:
  extends: .terraform-base
  tags:
    - ${RUNNER_TAGS}
  variables:
    TF_DIR: "${OUTPUT_DIR}"
    TF_STATE_NAME: ${TF_STATE_NAME}

check-format:
  extends: .linuxptp-base
  stage: validate
  rules:
    - if: $ON_MR
  needs:
    - job: generate
      artifacts: true
  script:
    - terraform fmt -check

validate:
  extends: .linuxptp-base
  stage: validate
  rules:
    - if: $ON_MR
  needs:
    - job: generate
      artifacts: true
  script:
    - terraform validate

plan:
  extends: .linuxptp-base
  stage: plan
  rules:
    - if: $ON_MR
  needs:
    - job: generate
      artifacts: true
  before_script:
    - echo "DEBUG - Files in OUTPUT_DIR:"
    - ls -laR "$OUTPUT_DIR" || echo "OUTPUT_DIR does not exist"
    - cd $TF_DIR
    - |
      terraform init \
        --backend-config=backend.tfbackend \
        --backend-config=username=$CODEBOT_USERNAME \
        --backend-config=password=$CODEBOT_TOKEN \
        --backend-config="address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}" \
        --backend-config="lock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock" \
        --backend-config="unlock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock"
    - |
      if [ -n "$KUBECONFIG_VAR_NAME" ]; then
        eval KUBECONFIG_PATH="\$$KUBECONFIG_VAR_NAME"
        export KUBECONFIG=$KUBECONFIG_PATH
        if [ -f "$KUBECONFIG_PATH" ]; then
          mkdir -p ~/.kube/
          cp $KUBECONFIG_PATH ~/.kube/config
          chmod 600 ~/.kube/config
        fi
      fi
  script:
    - terraform plan

apply:
  extends: .linuxptp-base
  stage: apply
  rules:
    - if: $ON_MR
      when: manual
      allow_failure: true
    - if: $ON_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
  needs:
    - job: generate
      artifacts: true
  script:
    - terraform apply -auto-approve
