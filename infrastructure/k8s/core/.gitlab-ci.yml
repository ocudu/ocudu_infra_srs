include:
  - project: ocudu/ocudu
    file: .gitlab/ci-shared/workflow.yml
    ref: dev
  - local: infrastructure/base/terraform.yml

variables:
  OCUDU_BRANCH: main
  # Required variables (must be passed from parent pipeline):
  # - RUNNER_TAGS: GitLab runner tags (e.g., "terraform")
  # - KUBECONFIG_VAR_NAME: Name of the variable containing kubeconfig path
  # - TF_STATE_NAME: Terraform state name (e.g., "k8s-coredump", "state-etcd-defrag-lab")

stages:
  - validate
  - plan
  - apply

.k8s-core-setup: &setup-k8s-core-files
  # Clone ocudu_infra_srs to get the TF files and k8s manifests
  - apk add --no-cache git
  - git clone --depth 1 --branch ${OCUDU_BRANCH:-main} https://gitlab.com/ocudu/ocudu_infra_srs.git /tmp/ocudu_infra_srs
  - mkdir -p infrastructure/k8s
  - cp -r /tmp/ocudu_infra_srs/infrastructure/k8s/core infrastructure/k8s/

.k8s-core-base:
  extends: .terraform-base
  tags:
    - ${RUNNER_TAGS}
  variables:
    TF_DIR: "infrastructure/k8s/core"
  before_script:
    - *setup-k8s-core-files
    - cd $TF_DIR
    - |
      terraform init \
        --backend-config=backend.tfbackend \
        --backend-config=username=$CODEBOT_USERNAME \
        --backend-config=password=$CODEBOT_TOKEN \
        --backend-config="address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}" \
        --backend-config="lock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock" \
        --backend-config="unlock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock"
    - |
      eval KUBECONFIG_PATH="\$$KUBECONFIG_VAR_NAME"
      mkdir -p ~/.kube/
      cp $KUBECONFIG_PATH ~/.kube/config
      chmod 600 ~/.kube/config

check-format:
  extends: .k8s-core-base
  stage: validate
  rules:
    - if: $ON_MR
  script:
    - terraform fmt -check

validate:
  extends: .k8s-core-base
  stage: validate
  rules:
    - if: $ON_MR
  script:
    - terraform validate

plan:
  extends: .k8s-core-base
  stage: plan
  rules:
    - if: $ON_MR
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - infrastructure/k8s/core/tfplan
    expire_in: 1 day

apply:
  extends: .k8s-core-base
  stage: apply
  rules:
    - if: $ON_MR
      when: manual
      allow_failure: true
    - if: $ON_DEFAULT_BRANCH
  script:
    - |
      if [ -n "$RESOURCE" ]; then
        echo "Applying resource: $RESOURCE"
        terraform apply -auto-approve -target=$RESOURCE
      else
        echo "Applying coredump cleanup"
        terraform apply -auto-approve -target=kubernetes_manifest.coredump_cleanup
      fi

import-etcd-defrag:
  extends: .k8s-core-base
  stage: apply
  rules:
    - if: $CI_COMMIT_BRANCH != "main" && $ON_MR
      when: manual
      allow_failure: true
    - when: never
  script:
    - terraform init
    - terraform import $RESOURCE "apiVersion=batch/v1,kind=CronJob,namespace=kube-system,name=etcd-defrag"
