include:
  - project: ocudu/ocudu
    file: .gitlab/ci-shared/workflow.yml
    ref: dev
  - local: infrastructure/base/terraform.yml

variables:
  OCUDU_BRANCH: main
  # Required variables (must be passed from parent pipeline):
  # - RUNNER_TAGS: GitLab runner tags (e.g., "terraform", "terraform-dc")
  # - KUBECONFIG_VAR_NAME: Name of the variable containing kubeconfig path
  # - TF_STATE_NAME: Terraform state name (e.g., "rbac-lab", "rbac-dc")

stages:
  - validate
  - plan
  - apply

.rbac-setup: &setup-rbac-files
  # Clone ocudu_infra_srs to get the TF files and RBAC manifests
  - apk add --no-cache git
  - git clone --depth 1 --branch ${OCUDU_BRANCH:-main} https://gitlab.com/ocudu/ocudu_infra_srs.git /tmp/ocudu_infra_srs
  - mkdir -p infrastructure/k8s/rbac
  - cp -r /tmp/ocudu_infra_srs/infrastructure/k8s/rbac/tf infrastructure/k8s/rbac/
  - cp -r /tmp/ocudu_infra_srs/infrastructure/rbac infrastructure/

##################################
## Generic RBAC deployment jobs ##
##################################
validate-rbac:
  extends: .terraform-base
  stage: validate
  tags:
    - ${RUNNER_TAGS}
  variables:
    TF_DIR: "infrastructure/k8s/rbac/tf"
  before_script:
    - *setup-rbac-files
    - |
      eval KUBECONFIG_PATH="\$$KUBECONFIG_VAR_NAME"
      mkdir -p ~/.kube/
      cp $KUBECONFIG_PATH ~/.kube/config
      chmod 600 ~/.kube/config
    - cd $TF_DIR
    - terraform init --backend-config=backend.tfbackend --backend-config=username=$CODEBOT_USERNAME --backend-config=password=$CODEBOT_TOKEN --backend-config="address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}" --backend-config="lock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock" --backend-config="unlock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock"
  rules:
    - if: $ON_MR
  script:
    - terraform validate

plan-rbac:
  extends: .terraform-base
  stage: plan
  tags:
    - ${RUNNER_TAGS}
  variables:
    TF_DIR: "infrastructure/k8s/rbac/tf"
  before_script:
    - *setup-rbac-files
    - |
      eval KUBECONFIG_PATH="\$$KUBECONFIG_VAR_NAME"
      mkdir -p ~/.kube/
      cp $KUBECONFIG_PATH ~/.kube/config
      chmod 600 ~/.kube/config
    - cd $TF_DIR
    - terraform init --backend-config=backend.tfbackend --backend-config=username=$CODEBOT_USERNAME --backend-config=password=$CODEBOT_TOKEN --backend-config="address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}" --backend-config="lock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock" --backend-config="unlock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock"
  rules:
    - if: $ON_MR
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - infrastructure/k8s/rbac/tf/tfplan
    expire_in: 1 day

apply-rbac:
  extends: .terraform-base
  stage: apply
  tags:
    - ${RUNNER_TAGS}
  variables:
    TF_DIR: "infrastructure/k8s/rbac/tf"
  before_script:
    - *setup-rbac-files
    - |
      eval KUBECONFIG_PATH="\$$KUBECONFIG_VAR_NAME"
      mkdir -p ~/.kube/
      cp $KUBECONFIG_PATH ~/.kube/config
      chmod 600 ~/.kube/config
    - cd $TF_DIR
    - terraform init --backend-config=backend.tfbackend --backend-config=username=$CODEBOT_USERNAME --backend-config=password=$CODEBOT_TOKEN --backend-config="address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}" --backend-config="lock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock" --backend-config="unlock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/terraform-${TF_STATE_NAME}/lock"
  rules:
    - if: $ON_MR
      when: manual
      allow_failure: true
    - if: $ON_DEFAULT_BRANCH
  script:
    - terraform apply -auto-approve
