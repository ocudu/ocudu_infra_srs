spec:
  inputs:
    ocudu_path:
      type: string
      default: ocudu/ocudu
      description: "OCUDU repository path."
    ocudu_ref:
      type: string
      default: dev
      description: "OCUDU reference branch or tag."
---
include:
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/python.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/docker.yml

.retina ci rules:
  rules:
    - &skip_retina_ci
      if: $SKIP_RETINA_CI
      when: never
    - &skip_mr_fork
      if: $ON_MR_FORK
      when: never
    - &force_retina_ci
      if: $CI_MERGE_REQUEST_LABELS =~ /ci-retina-force/
    - &retina_on_mr
      if: $ON_MR
      changes:
        paths:
          - retina/**/*
          - .gitlab-ci.yml  # Amarisoft version
    - &retina_on_default_branch
      if: $ON_DEFAULT_BRANCH
      changes:
        paths:
          - retina/**/*
        compare_to: "$CI_COMMIT_BEFORE_SHA"

.retina python:
  before_script:
    - |
      . /etc/os-release

      echo "Setting up the OS"
      case "$ID" in
        debian | ubuntu) DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y --no-install-recommends build-essential libffi-dev ;;
                 alpine) apk add build-base linux-headers libffi-dev ;;
                      *) echo 'Unsupported OS' && exit 1 ;;
      esac
  needs:
    - get retina version

# Static
.retina tox:
  stage: static
  extends:
    - .tox
    - .retina python
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.14"]

retina tox [protocol]:
  extends: .retina tox
  variables:
    PY_DIR: retina/protocol
  rules:
    - *skip_retina_ci
    - *skip_mr_fork
    - if: $ON_MR
      changes:
        paths:
          - retina/protocol/**/*.{py,pyi,proto,json,sh,nj,jinja,ntl,toml,in}

retina tox [client]:
  extends: .retina tox
  variables:
    PY_DIR: retina/client
  rules:
    - *skip_retina_ci
    - *skip_mr_fork
    - if: $ON_MR
      changes:
        paths:
          - retina/client/**/*.{py,pyi,proto,json,sh,nj,jinja,ntl,toml,in}

retina tox [orchestrator]:
  extends: .retina tox
  variables:
    PY_DIR: retina/orchestrator
  rules:
    - *skip_retina_ci
    - *skip_mr_fork
    - if: $ON_MR
      changes:
        paths:
          - retina/orchestrator/**/*.{py,pyi,proto,json,sh,nj,jinja,ntl,toml,in}

retina tox [viavi]:
  extends: .retina tox
  variables:
    PY_DIR: retina/viavi
  rules:
    - *skip_retina_ci
    - *skip_mr_fork
    - if: $ON_MR
      changes:
        paths:
          - retina/viavi/**/*.{py,pyi,proto,json,sh,nj,jinja,ntl,toml,in}

retina tox [launcher]:
  extends: .retina tox
  variables:
    PY_DIR: retina/launcher
  rules:
    - *skip_retina_ci
    - *skip_mr_fork
    - if: $ON_MR
      changes:
        paths:
          - retina/launcher/**/*.{py,pyi,proto,json,sh,nj,jinja,ntl,toml,in}

retina tox [agent]:
  extends: .retina tox
  variables:
    PY_DIR: retina/agent
  rules:
    - *skip_retina_ci
    - *skip_mr_fork
    - if: $ON_MR
      changes:
        paths:
          - retina/agent/**/*.{py,pyi,proto,json,sh,nj,jinja,ntl,toml,in}

# Publish PyPi
.retina publish:
  extends: .retina python
  stage: ci
  retry: 2
  rules:
    - *skip_retina_ci
    - *skip_mr_fork
    - *force_retina_ci
    - *retina_on_default_branch

retina publish deps:
  extends:
    - .publish deps
    - .retina publish
  parallel:
    matrix:
      - PY_DIR:
          &py_dir_libs [
            "retina/protocol",
            "retina/client",
            "retina/orchestrator",
            "retina/viavi",
            "retina/launcher",
            "retina/agent",
          ]
        PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

retina publish wheel:
  extends:
    - .publish wheel
    - .retina publish
  parallel:
    matrix:
      - PY_DIR: *py_dir_libs

# Publish Containers
.retina containers:
  extends: .docker-builder
  stage: ci
  rules:
    - *skip_retina_ci
    - *skip_mr_fork
    - *force_retina_ci
    - *retina_on_mr
  retry: 2
  variables:
    REGISTRY_URI: ${RETINA_REGISTRY_URI}
    MODE: publish
    CACHE: "true"
    CACHE_MODE: max
    VERSION: ${RETINA_VERSION}
    AGENT_OS_VERSION: "noble-20260410"
    FLEXRIC_VERSION: "br-flexric" # NOTE: there is only version 1.0.0 but very old
    OPEN5GS_VERSION: "2.8.0"
    SRSUE_VERSION: "23.11"
  needs:
    - get retina version

retina containers [launcher]:
  extends: .retina containers
  variables:
    NAME: launcher
    DOCKERFILE: retina/launcher
    CONTEXT: ${CI_PROJECT_DIR}/retina
    PYTHON_VERSION: "3.12"
    OS: alpine
    BUILD_ARGS: RETINA_VERSION=${RETINA_VERSION};OS=${OS};PYTHON_VERSION=${PYTHON_VERSION}

retina containers [agent]:
  extends: .retina containers
  variables:
    NAME: agent
    VERSION: ${AGENT_OS_VERSION}
    DOCKERFILE: retina/agent
    CONTEXT: ${CI_PROJECT_DIR}/retina
    BUILD_ARGS: AGENT_OS_VERSION=${AGENT_OS_VERSION}

retina containers [wheelhouse]:
  extends: .retina containers
  variables:
    NAME: wheelhouse
    DOCKERFILE: retina/agent
    CONTEXT: ${CI_PROJECT_DIR}/retina
    BUILD_ARGS: RETINA_VERSION=${RETINA_VERSION};AGENT_OS_VERSION=${AGENT_OS_VERSION} --opt filename=Dockerfile.wheelhouse

.retina containers images:
  extends: .retina containers
  variables:
    CONTEXT: retina/images/${NAME}
    BUILD_ARGS: RETINA_REGISTRY_URI=${RETINA_REGISTRY_URI};RETINA_VERSION=${RETINA_VERSION};AGENT_OS_VERSION=${AGENT_OS_VERSION}
  needs:
    - get retina version
    - retina containers [agent]
    - retina containers [wheelhouse]

retina containers:
  extends: .retina containers images
  rules:
    - *skip_retina_ci
    - *skip_mr_fork
    - *force_retina_ci
    - <<: *retina_on_mr
      when: delayed
      start_in: 1 minute
  variables:
    CACHE: "false" # Just FROM agent + minimal apt
  parallel:
    matrix:
      - NAME: amarisoftue
      - NAME: amarisoftue-remote
        CONTEXT: retina/images/amarisoftue_remote
      - NAME: amarisoft5gc
      - NAME: amarisoft5gc-remote
        CONTEXT: retina/images/amarisoft5gc_remote
      - NAME: ocudu-remote
        CONTEXT: retina/images/ocudu_remote
      - NAME: android

retina containers [flexric]:
  extends: .retina containers images
  rules:
    - *skip_retina_ci
    - *skip_mr_fork
    - *force_retina_ci
    - <<: *retina_on_mr
      when: delayed
      start_in: 1 minute
  variables:
    NAME: flexric
    FLEXRIC_REPO_URL: https://gitlab.eurecom.fr/mosaic5g/flexric.git
    FLEXRIC_BRANCH: br-flexric
    VERSION: ${FLEXRIC_VERSION}_${RETINA_VERSION}
    BUILD_ARGS: RETINA_REGISTRY_URI=${RETINA_REGISTRY_URI};RETINA_VERSION=${RETINA_VERSION};AGENT_OS_VERSION=${AGENT_OS_VERSION};REPO_URL=${FLEXRIC_REPO_URL};REPO_BRANCH=${FLEXRIC_BRANCH}

retina containers [ocudu]:
  extends: .retina containers images
  variables:
    NAME: ocudu
    CONTEXT: retina/images/ocudu
    BUILDER_IMAGE_NAME: builder-ubuntu-24.04:${DOCKER_BUILDER_VERSION}
    BUILD_ARGS: RETINA_REGISTRY_URI=${RETINA_REGISTRY_URI};RETINA_VERSION=${RETINA_VERSION};AGENT_OS_VERSION=${AGENT_OS_VERSION};BUILDER_IMAGE=${OCUDU_REGISTRY_URI}/${BUILDER_IMAGE_NAME};RETINA_AGENT=${NAME}
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "100G"
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: "100G"

retina containers [open5gs]:
  extends: .retina containers images
  rules:
    - *skip_retina_ci
    - *skip_mr_fork
    - *force_retina_ci
    - <<: *retina_on_mr
      when: delayed
      start_in: 1 minute
  variables:
    NAME: open5gs
    VERSION: ${OPEN5GS_VERSION}_${RETINA_VERSION}
    BUILD_ARGS: RETINA_REGISTRY_URI=${RETINA_REGISTRY_URI};RETINA_VERSION=${RETINA_VERSION};AGENT_OS_VERSION=${AGENT_OS_VERSION};OPEN5GS_VERSION=v${OPEN5GS_VERSION}

retina containers [srsue]:
  extends: .retina containers images
  rules:
    - *skip_retina_ci
    - *skip_mr_fork
    - *force_retina_ci
    - <<: *retina_on_mr
      when: delayed
      start_in: 1 minute
  variables:
    NAME: srsue
    VERSION: ${SRSUE_VERSION}_${RETINA_VERSION}
    SRSRAN_REPO_URL: https://github.com/srsran/srsRAN_4G.git
    SRSRAN_BRANCH: release_23_11
    BUILD_ARGS: RETINA_REGISTRY_URI=${RETINA_REGISTRY_URI};RETINA_VERSION=${RETINA_VERSION};AGENT_OS_VERSION=${AGENT_OS_VERSION};REPO_URL=${SRSRAN_REPO_URL};REPO_BRANCH=${SRSRAN_BRANCH}

# Publish Containers
publish latest:
  stage: ci
  extends:
    - .docker manifest
    - .retina containers
  retry: 2
  rules:
    - *skip_retina_ci
    - *skip_mr_fork
    - *force_retina_ci
    - *retina_on_default_branch
  script:
    - |
      docker manifest create \
        ${REGISTRY_URI}/${NAME}:latest \
        --amend ${REGISTRY_URI}/${NAME}:${VERSION}
      docker manifest push ${REGISTRY_URI}/${NAME}:latest
      echo "Image ${REGISTRY_URI}/${NAME}:latest pushed"
  parallel:
    matrix:
      - NAME: launcher
  needs:
    - get retina version
    - job: retina containers [launcher]
      optional: true
