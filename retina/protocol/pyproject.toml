#########
# Build #
#########
[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 61", "wheel"]

###########
# Project #
###########
[project]
authors = [
  {name = "Software Radio Systems"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 4 - Beta",
]
dependencies = ["grpcio < 1.78.1", "grpcio-health-checking < 1.78.1", "protobuf < 8", "PyYAML < 7", "typing_extensions < 5; python_version < '3.12'"]
description = "Retina Software Protocols"
dynamic = ["version"]
name = "retina_protocol"
requires-python = ">=3.9"

#############
# Dev Tools #
#############
[tool.black]
exclude = '''
(
    .*pb2.*
)
'''
line-length = 120

[tool.isort]
atomic = true
combine_as_imports = true
extend_skip_glob = ["*pb2*"]
float_to_top = true
force_alphabetical_sort_within_sections = true
include_trailing_comma = true
known_first_party = ["retina"]
line_length = 120
profile = "black"
remove_redundant_aliases = true

[tool.mypy]
exclude = [
  '.*pb2.*',
]
explicit_package_bases = true
install_types = true
mypy_path = ["src"]
non_interactive = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "retina.protocol.base_pb2",
  "retina.protocol.base_pb2_grpc",
  "retina.protocol.ue_pb2",
  "retina.protocol.ue_pb2_grpc",
  "retina.protocol.gnb_pb2",
  "retina.protocol.gnb_pb2_grpc",
  "retina.protocol.fivegc_pb2",
  "retina.protocol.fivegc_pb2_grpc",
  "retina.protocol.ric_pb2",
  "retina.protocol.ric_pb2_grpc",
]
ignore_errors = true

[tool.pylint]
ignore-patterns = '.*pb2.*'
ignore-signatures = true
max-line-length = 120

[tool.pylint.typecheck]
ignored-modules = ["google.protobuf.*"]

[tool.coverage.run]
branch = true
source = ["src/retina/protocol"]

[tool.coverage.report]
show_missing = true

[tool.tox]
legacy_tox_ini = """
[tox]
minversion = 4.4.0
envlist =
  grpc
  format
  lint
  type
  unittest
  build

[testenv]
passenv = RETINA_VERSION

[pkgenv]
passenv = RETINA_VERSION

[testenv:grpc]
skip_install = true
deps =
  mypy-protobuf <= 3.7.0
  grpcio < 1.78.1
  grpcio-tools < 1.78.1
  requests <= 2.33.1
commands_pre =
  python3 scripts/download_protoc_gen.py
commands =
  python -m grpc_tools.protoc -I src --python_out=src --grpc_python_out=src \
    --mypy_out=src --doc_out=. --doc_opt=scripts/docusaurus.mdx.tmpl,README.mdx \
    --plugin=protoc-gen-doc=./.protoc-gen-doc/protoc-gen-doc \
    src/retina/protocol/base.proto \
    src/retina/protocol/ue.proto \
    src/retina/protocol/gnb.proto \
    src/retina/protocol/fivegc.proto \
    src/retina/protocol/ric.proto
  python scripts/add_copyright_header.py

[testenv:format]
skip_install = true
deps =
  black <= 26.3.1
  isort <= 8.0.1
commands =
  black src
  isort src

[testenv:lint]
deps =
  pylint <= 4.0.5
commands =
  pylint src

[testenv:type]
depends = grpc
skip_install = true
deps =
  mypy <= 1.20.0
commands =
  mypy src

[testenv:unittest]
usedevelop = True
deps =
  coverage[toml] <= 7.13.5
commands =
  coverage run -m unittest discover -v
  coverage report
  coverage xml
  coverage html

[testenv:build]
skip_install = true
deps =
  build <= 1.4.2
  setuptools >= 61, <= 82.0.1
  wheel <= 0.46.3
commands =
  python -m build --no-isolation
"""
