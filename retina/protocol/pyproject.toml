#########
# Build #
#########
[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 61", "wheel"]

###########
# Project #
###########
[project]
authors = [
  {name = "Software Radio Systems"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 4 - Beta",
]
dependencies = ["grpcio < 1.68.0", "grpcio-health-checking < 1.68.0", "protobuf < 6", "PyYAML < 7"]
description = "Retina Software Protocols"
dynamic = ["version"]
name = "retina_protocol"
requires-python = ">=3.9"

#############
# Dev Tools #
#############
[tool.black]
exclude = '''
(
    .*pb2.*
)
'''
line-length = 120

[tool.isort]
atomic = true
combine_as_imports = true
extend_skip_glob = ["*pb2*"]
float_to_top = true
force_alphabetical_sort_within_sections = true
include_trailing_comma = true
line_length = 120
profile = "black"
remove_redundant_aliases = true

[tool.mypy]
exclude = [
  '.*pb2.*',
]
ignore_missing_imports = true
install_types = true
non_interactive = true
warn_return_any = true
warn_unused_configs = true

[tool.pylint]
disable = ["no-name-in-module"]
ignore-patterns = '.*pb2.*'
ignore-signatures = true
max-line-length = 120

[tool.coverage.run]
branch = true
source = ["src/retina/protocol"]

[tool.coverage.report]
show_missing = true

[tool.tox]
legacy_tox_ini = """
[tox]
minversion = 4.4.0
envlist = 
  grpc
  format
  lint
  type
  unittest
  build

[testenv]
passenv = RETINA_VERSION

[pkgenv]
passenv = RETINA_VERSION

[testenv:grpc]
skip_install = true
deps =
  mypy-protobuf < 4
  grpcio < 1.68.0
  grpcio-tools < 1.68.0
  requests < 3
commands_pre =
  python3 scripts/download_protoc_gen.py
commands =    
  python -m grpc_tools.protoc -I src --python_out=src --grpc_python_out=src \
    --mypy_out=src --doc_out=. --doc_opt=scripts/docusaurus.mdx.tmpl,README.mdx \
    --plugin=protoc-gen-doc=./.protoc-gen-doc/protoc-gen-doc \
    src/retina/protocol/base.proto \
    src/retina/protocol/ue.proto \
    src/retina/protocol/gnb.proto \
    src/retina/protocol/fivegc.proto \
    src/retina/protocol/ric.proto \ 
    src/retina/protocol/channel_emulator.proto
  python scripts/add_copyright_header.py

[testenv:format]
skip_install = true
deps =
  black
  isort
commands =
  black --check --diff --color src
  isort --check src

[testenv:format_apply]
skip_install = true
deps =
  black
  isort
commands =
  black src
  isort src

[testenv:lint]
deps =
  pylint
commands =
  pylint src

[testenv:type]
skip_install = true
deps = 
  mypy
commands = 
  mypy src

[testenv:unittest]
usedevelop = True
deps =
  coverage[toml]
commands =
  coverage run -m unittest discover -v
  coverage report
  coverage xml
  coverage html

[testenv:build]
skip_install = true
deps =
  build
  setuptools >= 61
  wheel
commands =
  python -m build --no-isolation
"""
