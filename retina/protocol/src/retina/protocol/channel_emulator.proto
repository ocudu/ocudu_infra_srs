syntax = "proto3";

import "google/protobuf/empty.proto";

import "retina/protocol/base.proto";

// ChannelEmulator service manages wireless channel emulation for testing
service ChannelEmulator {
  // Get Basic information about the Channel Emulator
  rpc GetDefinition(google.protobuf.Empty) returns (ChannelEmulatorDefinition) {};
  // Start the Channel Emulator. Raise an error if can't be started.
  rpc Start(ChannelEmulatorStartInfo) returns (google.protobuf.Empty) {};
  // Get scenario configs to be used in gnb and UE.
  rpc GetScenarioConfigs(google.protobuf.Empty) returns (ScenarioConfig) {};
  // Get Channel Emulator Summary
  rpc GetChannelEmulatorSummary(google.protobuf.Empty) returns (ChannelEmulatorSummary) {};
}

// Generic Channel Emulator Messages
message ChannelEmulatorStartInfo {
  DUDefinition                   du_definition = 1; // Requird in ZMQ mode
  UEDefinition                   ue_definition = 2; // Required in ZMQ mode
  StartInfo                      start_info    = 3;
};

message ScenarioConfig {
};

message ChannelEmulatorSummary {
  uint32 placeholder = 1;
};