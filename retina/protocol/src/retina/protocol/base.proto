syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

// Base service provides health checking, version information, and common functionality
service Base {
  // Get agent and binary versions
  rpc GetRetinaInfo(google.protobuf.Empty) returns (RetinaInfo) {};
  // Set parameters at runtime. If fails, it will raise an Error.
  rpc SetParameter(Parameter) returns (google.protobuf.Empty) {};
  // Ping an ip
  rpc Ping(PingRequest) returns (PingResponse) {};
  // Stop the sut in the specified timeout. Returns the exit code
  rpc Stop(google.protobuf.UInt32Value) returns (StopResponse) {};
  // Returns metrics
  rpc GetMetrics(google.protobuf.Empty) returns (Metrics) {};
  // Get Artifacts ID
  rpc GetArtifactsId(google.protobuf.Empty) returns (google.protobuf.StringValue) {};
  // Download the artifacts
  rpc DownloadArtifacts(google.protobuf.Empty) returns (stream google.protobuf.BytesValue) {};
  // Stop the sut and close the agent server
  rpc Shutdown(google.protobuf.Empty) returns (google.protobuf.Empty) {};
};

message RetinaInfo {
  string agent_version = 1;
  string sut_version   = 2;
};

message Parameter {
  string name  = 1;
  string value = 2;
};

message UEDefinition {
  Subscriber      subscriber     = 1;
  string          zmq_ip         = 2; // Empty if not zmq mode
  repeated uint32 zmq_port_array = 3;
};

message Subscriber {
  string imsi     = 1;
  string algo_str = 2;
  string k        = 3;
  string opc      = 4;
  string amf      = 5;
  uint64 tel      = 6;
  string sd       = 7;
};

message SubscriberArray {
  repeated Subscriber value = 1;
};

message CUCPDefinition {
  string cucp_ip   = 1;
  uint32 cucp_port = 2;
};

message CUUPDefinition {
  string cuup_ip = 1;
  uint32 e1_port = 2;
};

message DUDefinition {
  string          zmq_ip         = 1; // Empty if not zmq mode
  repeated uint32 zmq_port_array = 2;
};

message GNBDefinition {
  DUDefinition   du_definition   = 1;
  CUCPDefinition cucp_definition = 2;
};

message FiveGCDefinition {
  string amf_ip   = 1;
  uint32 amf_port = 2;
  string tun_ip   = 3;
  uint32 tun_mask = 4;
};

message NearRtRicDefinition {
  bool   enabled  = 1; // Bool default value is False
  string ric_ip   = 2;
  uint32 ric_port = 3;
};

enum ChannelEmulatorType {
  UNKNOWN = 0;
  TN      = 1;
  NTN     = 2;
}

message ChannelEmulatorDefinition {
  ChannelEmulatorType type        = 1;
  string              zmq_ip      = 2; // Empty if not zmq mode
  uint32              dl_zmq_port = 3;
  uint32              ul_zmq_port = 4;
};

message PLMN {
  string mcc = 1;
  string mnc = 2;
}

message StartInfo {
  bool            dryrun        = 1; // Bool default value is False
  uint32          timeout       = 2; // uint default value is 0
  repeated string pre_commands  = 3;
  repeated string post_commands = 4;
};

message PingRequest {
  string address  = 1;
  uint32 count    = 2;
  double interval = 3;
};

message PingResponse {
  bool   status   = 1;
  uint32 sent     = 2;
  uint32 received = 3;
  double min      = 4;
  double avg      = 5;
  double max      = 6;
  double mdev     = 7;
};

message IPerfServer {
  string ip   = 1;
  uint32 port = 2;
};

message StopResponse {
  int32  exit_code     = 1;
  uint32 error_count   = 2;
  string error_msg     = 3;
  uint32 warning_count = 4;
  string warning_msg   = 5;
};

message UeMetrics {
  // UE identification
  uint32 rnti = 1;
  uint32 pci  = 2;

  // Throughput
  double dl_bitrate = 3;
  double ul_bitrate = 4;

  // Peak moving-average bitrates (5 / 15 / 30 samples)
  double dl_av_5_samples  = 5;
  double dl_av_15_samples = 6;
  double dl_av_30_samples = 7;
  double ul_av_5_samples  = 8;
  double ul_av_15_samples = 9;
  double ul_av_30_samples = 10;

  // Link quality
  uint64 nof_ko_dl = 11;
  uint64 nof_ko_ul = 12;

  // PUCCH / PUSCH UCI
  uint32 nof_pucch_f0f1_invalid_harqs   = 13;
  uint32 nof_pucch_f2f3f4_invalid_harqs = 14;
  uint32 nof_pucch_f2f3f4_invalid_csis  = 15;
  uint32 nof_pusch_invalid_csis         = 25;
  uint32 nof_pusch_invalid_harqs        = 26;

  // RRC events
  uint32 nof_reestablishments_request  = 16;
  uint32 nof_reestablishments_complete = 17;
  uint32 nof_handovers                 = 18;
  uint32 nof_rrc_suspend               = 19;
  uint32 nof_rrc_resume_request        = 20;

  // Rank indicator
  double dl_avg_ri = 21;
  double ul_avg_ri = 22;

  // MCS (maximum observed across the reporting window)
  uint32 dl_max_mcs = 23;
  uint32 ul_max_mcs = 24;
};

message DuMetrics {
  uint32 nof_error_indications = 1;
  uint64 max_late_dl_harqs     = 2;
  uint64 max_late_ul_harqs     = 3;
  uint32 nof_lates             = 4;
  uint32 nof_under             = 5;
  uint32 nof_seq_err           = 6;

  uint32 nof_sib1_transmissions = 7;
  uint32 nof_sib2_transmissions = 8;
  uint32 nof_sib3_transmissions = 9;
  uint32 nof_sib4_transmissions = 10;
  uint32 nof_sib5_transmissions = 11;
  uint32 nof_sib8_transmissions  = 12;
  uint32 nof_paging_messages     = 13;

  uint32 nof_sib16_transmissions = 20;
  uint32 nof_sib19_transmissions = 21;

  bool sib1_has_rach_prioritization_slice = 22;

  int32 prach_configuration_index   = 14;
  int32 transform_precoder          = 15;
  int32 drx_long_cycle_start_offset = 16;
  int32 t312                        = 17;
  int32 c_srs                       = 18;
  int32 b_srs                       = 19;

  repeated uint32 pdsch_prbs_used_per_tdd_slot_idx = 23;
  repeated uint32 pusch_prbs_used_per_tdd_slot_idx = 24;
};

message CoreMetrics {
  uint32 nof_pdu_session_establishment_accept    = 1;
  uint32 nof_nas_service_accept              = 2;
  uint32 nof_ng_paging                           = 3;
  uint32 nof_tau_request                         = 4;
  uint32 nof_pdu_session_resource_modify_request = 5;

  uint32 nof_e_cid_measurement_initiation_request  = 6;
  uint32 nof_e_cid_measurement_initiation_response = 7;
  uint32 nof_e_cid_measurement_report              = 8;

  uint32 nof_trp_information_request  = 9;
  uint32 nof_trp_information_response = 10;
};

message Metrics {
  UeMetrics          aggregate = 1;
  repeated UeMetrics ue_array  = 2;
  DuMetrics          du        = 3;
  CoreMetrics        core      = 4;
};