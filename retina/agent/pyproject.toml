#########
# Build #
#########
[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 61", "wheel"]

###########
# Project #
###########
[project]
authors = [
  {name = "Software Radio Systems"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 4 - Beta",
]
dependencies = [
  "retina_protocol",
  "importlib-metadata < 7; python_version<'3.8'",
  "psutil < 6",
  "PyYAML < 7",
  "typeguard < 3",
  "jinja2 < 4",
  "pymongo < 5",
  "websocket-client < 2",
  "paramiko < 4",
  "pyshark < 1",
]
description = "Retina Software Agent"
dynamic = ["version"]
name = "retina_agent"
requires-python = ">=3.9"

[project.scripts]
retina-agent = "retina.agent.__main__:main"

#############
# Dev Tools #
#############
[tool.black]
line-length = 120

[tool.isort]
atomic = true
combine_as_imports = true
float_to_top = true
force_alphabetical_sort_within_sections = true
include_trailing_comma = true
line_length = 120
profile = "black"
remove_redundant_aliases = true

[tool.mypy]
check_untyped_defs = true
explicit_package_bases = true
install_types = true
mypy_path = [
  "src",
  "../protocol/src",
]
non_interactive = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "retina.protocol.base_pb2",
  "retina.protocol.base_pb2_grpc",
  "retina.protocol.ue_pb2",
  "retina.protocol.ue_pb2_grpc",
  "retina.protocol.gnb_pb2",
  "retina.protocol.gnb_pb2_grpc",
  "retina.protocol.fivegc_pb2",
  "retina.protocol.fivegc_pb2_grpc",
  "retina.protocol.ric_pb2",
  "retina.protocol.ric_pb2_grpc",
  "retina.protocol.channel_emulator_pb2",
  "retina.protocol.channel_emulator_pb2_grpc",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "grpc_health.*",
  "jinja2",
  "pymongo",
  "pymongo.collection",
  "pyshark",
  "typeguard",
  "websocket",
]
ignore_missing_imports = true

[tool.pylint]
ignore-signatures = true
max-line-length = 120

[tool.pylint.typecheck]
ignored-modules = ["google.protobuf.*", "grpc_health.*", "retina.protocol.*pb2*"]

[tool.coverage.run]
branch = true
source = ["src/retina/agent"]

[tool.coverage.report]
show_missing = true

[tool.tox]
legacy_tox_ini = """
[tox]
minversion = 4.4.0
envlist = 
  format
  lint
  type
  unittest
  build

[testenv]
passenv = RETINA_VERSION

[pkgenv]
passenv = RETINA_VERSION

[testenv:format]
skip_install = true
deps =
  black <= 26.3.1
  isort <= 8.0.1
commands =
  black src
  isort src

[testenv:lint]
deps =
  pylint <= 4.0.5
  -e ../protocol
commands =
  pylint src

[testenv:type]
skip_install = true
deps =
  mypy <= 1.20.0
commands =
  mypy src

[testenv:unittest]
usedevelop = True
deps =
  coverage[toml] <= 7.13.5
  -e ../protocol 
commands =
  coverage run -m unittest discover -v
  coverage report
  coverage xml
  coverage html

[testenv:build]
skip_install = true
deps =
  build <= 1.4.2
  setuptools >= 61, <= 82.0.1
  wheel <= 0.46.3
  -e ../protocol
commands =
  python -m build --no-isolation
"""
