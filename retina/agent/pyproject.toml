#########
# Build #
#########
[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 61", "wheel"]

###########
# Project #
###########
[project]
authors = [
  {name = "Software Radio Systems"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 4 - Beta",
]
dependencies = [
  "retina_protocol",
  "importlib-metadata < 7; python_version<'3.8'",
  "psutil < 6",
  "PyYAML < 7",
  "typeguard < 3",
  "jinja2 < 4",
  "pymongo < 5",
  "websocket-client < 2",
  "paramiko < 4", 
]
description = "Retina Software Agent"
dynamic = ["version"]
name = "retina_agent"
requires-python = ">=3.9"

[project.scripts]
retina-agent = "retina.agent.__main__:main"

#############
# Dev Tools #
#############
[tool.black]
line-length = 120

[tool.isort]
atomic = true
combine_as_imports = true
float_to_top = true
force_alphabetical_sort_within_sections = true
include_trailing_comma = true
line_length = 120
profile = "black"
remove_redundant_aliases = true

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
install_types = true
non_interactive = true
warn_return_any = false
warn_unused_configs = true

[tool.pylint]
disable = ["no-name-in-module"]
ignore-signatures = true
max-line-length = 120

[tool.coverage.run]
branch = true
source = ["src/retina/agent"]

[tool.coverage.report]
show_missing = true

[tool.tox]
legacy_tox_ini = """
[tox]
minversion = 4.4.0
envlist = 
  format
  lint
  type
  unittest
  build

[testenv]
passenv = RETINA_VERSION

[pkgenv]
passenv = RETINA_VERSION

[testenv:format]
skip_install = true
deps =
  black
  isort
commands =
  black --check --diff --color src
  isort --check src

[testenv:format_apply]
skip_install = true
deps =
  black
  isort
commands =
  black src
  isort src

[testenv:lint]
deps =
  pylint
  -e ../protocol 
commands =
  pylint src

[testenv:type]
skip_install = true
deps = 
  mypy
commands = 
  mypy src

[testenv:unittest]
usedevelop = True
deps =
  coverage[toml]
  -e ../protocol 
commands =
  coverage run -m unittest discover -v
  coverage report
  coverage xml
  coverage html

[testenv:build]
skip_install = true
deps =
  build
  -e ../protocol 
commands =
  python -m build
"""
