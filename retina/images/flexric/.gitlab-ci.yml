spec:
  inputs:
    ocudu_path:
      type: string
      default: ocudu/ocudu
      description: "OCUDU repository path."
    ocudu_ref:
      type: string
      default: dev
      description: "OCUDU reference branch or tag."
---
include:
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/docker.yml

stages:
  - test
  - publish

variables:
  FLEXRIC_VERSION: "br-flexric" # NOTE: there is only version 1.0.0 but very old
  FLEXRIC_REPO_URL: https://gitlab.eurecom.fr/mosaic5g/flexric.git
  FLEXRIC_BRANCH: br-flexric

.docker-builder-flexric:
  extends: .docker-builder
  variables:
    REGISTRY_URI: ${RETINA_REGISTRY_URI}
    NAME: flexric
    CONTEXT: retina/images/flexric
    VERSION: ${FLEXRIC_VERSION}_${RETINA_VERSION}
    BUILD_ARGS: REPO_URL=${FLEXRIC_REPO_URL};REPO_BRANCH=${FLEXRIC_BRANCH};RETINA_VERSION=${RETINA_VERSION};RETINA_REGISTRY_URI=${RETINA_REGISTRY_URI}
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "10G"

only-build:
  stage: test
  extends: .docker-builder-flexric
  rules:
    - if: $ON_MR
  variables:
    MODE: test

build-and-publish:
  stage: publish
  extends: .docker-builder-flexric
  rules:
    - if: $ON_DEFAULT_BRANCH
    - if: $ON_MR
      when: manual
      allow_failure: true
  retry: 2
  variables:
    MODE: publish
