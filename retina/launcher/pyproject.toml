#########
# Build #
#########
[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 61", "wheel"]

###########
# Project #
###########
[project]
authors = [
  {name = "Software Radio Systems"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
]
dependencies = [
  "pytest < 9",
  "pytest-html < 5",
  "pytest-json < 1",
  "pytest-random-order < 2",
  "pytest-rerunfailures < 17",
  "pytest-xdist < 4",
  "jinja2 < 4",
  "PyYAML < 7",
  "rich < 14",
  "retina-client",
  "retina-orchestrator",
  "retina-viavi",
]
description = "Retina launcher"
dynamic = ["version"]
name = "retina_launcher"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
retina-launcher = "retina.launcher.__main__:main"

[project.entry-points.pytest11]
retina = "retina.launcher.plugin"

#############
# Dev Tools #
#############
[tool.black]
line-length = 120

[tool.isort]
atomic = true
combine_as_imports = true
float_to_top = true
force_alphabetical_sort_within_sections = true
include_trailing_comma = true
line_length = 120
profile = "black"
remove_redundant_aliases = true

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
install_types = true
non_interactive = true
warn_return_any = false
warn_unused_configs = true

[tool.pylint]
load-plugins = "pylint_pytest"
disable = ["no-name-in-module"]
ignore-signatures = true
max-line-length = 120

[tool.coverage.run]
branch = true
source = ["src/retina/launcher"]

[tool.tox]
legacy_tox_ini = """
[tox]
minversion = 4.4.0
envlist = 
  format
  lint
  type
  build

[testenv]
passenv = RETINA_VERSION

[pkgenv]
passenv = RETINA_VERSION

[testenv:format]
skip_install = true
deps =
  black <= 26.3.1
  isort <= 8.0.1
commands =
  black --check --diff --color src
  isort --check src

[testenv:format_apply]
skip_install = true
deps =
  black <= 26.3.1
  isort <= 8.0.1
commands =
  black src
  isort src

[testenv:lint]
deps =
  pylint <= 4.0.5
  pylint-pytest <= 1.1.8
  -e ../protocol
  -e ../client
  -e ../orchestrator
  -e ../viavi
commands =
  pylint src

[testenv:type]
skip_install = true
deps =
  mypy <= 1.20.0
commands =
  mypy src

[testenv:unittest]
usedevelop = True
deps =
  coverage[toml] <= 7.13.5
  -e ../protocol
  -e ../client
  -e ../orchestrator
  -e ../viavi
commands =
  coverage run -m unittest discover -v
  coverage report
  coverage xml
  coverage html

[testenv:build]
skip_install = true
deps =
  setuptools >= 61, <= 82.0.1
  wheel <= 0.46.3
  build <= 1.4.2
  -e ../protocol
  -e ../client
  -e ../orchestrator
  -e ../viavi
commands =
  python -m build --no-isolation
"""
