spec:
  inputs:
    # Build job configuration for web and api triggered pipelines
    ocudu_ref:
      type: string
      default: dev
      description: "OCUDU reference branch or tag."
    infrastructure_tag:
      type: string
      default: amd64-avx2
      description: "Tag to use for the build job."
      options:
        - amd64
        - amd64-avx2
        - amd64-avx2-avx512
        - arm64
    os:
      type: string
      default: ubuntu-24.04
      description: "Operating system."
    srs_target: # TODO Rename when ocudu ci-shared/build.yml is updated
      type: string
      default: ""
      description: "Build target. Keep it empty to use the default target."
    compiler:
      type: string
      default: gcc
      description: "Compiler."
    build_args:
      type: string
      default: ""
      description: "Build arguments for the job. It will be passed to cmake"
    uhd_version:
      type: string
      default: ""
      description: "UHD version. Must be a version included in the specified OS builder image."
    dpdk_version:
      type: string
      default: ""
      description: "DPDK version. Must be a version included in the specified OS builder image."
    test_mode:
      type: string
      default: none
      description: "Run ctest selecting tests with labels matching regular expression. `none` wont run any test at all."
---
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "web"
      variables:
        ON_WEB: "true"
    - if: $CI_PIPELINE_SOURCE == "api"
      variables:
        ON_API: "true"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        ON_SCHEDULE: "true"
    - if: $CI_COMMIT_TAG
      variables:
        ON_TAG: "true"
    - if: $CI_MERGE_REQUEST_IID
      variables:
        ON_MR: "true"
      # Why $CI_MERGE_REQUEST_IID instead of $CI_PIPELINE_SOURCE == "merge_request_event" ?
      # Child pipelines in a MR have CI_PIPELINE_SOURCE = parent_pipeline
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        ON_DEFAULT_BRANCH: "true"
    - when: never

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "1"
  GET_SOURCES_ATTEMPTS: 3
  ARTIFACT_DOWNLOAD_ATTEMPTS: 3
  RESTORE_CACHE_ATTEMPTS: 3
  CLICOLOR_FORCE: 1
  FORCE_COLOR: 1

default:
  retry:
    max: 2
    when:
      - unknown_failure
      - api_failure
      - runner_system_failure
      - runner_unsupported
      - unmet_prerequisites
      - scheduler_failure
      - data_integrity_failure

include:
  - local: templates/build.yml
    inputs:
      ocudu_ref: $[[ inputs.ocudu_ref ]]
      job: build
      rules:
        - if: $ON_WEB
        - if: $ON_API
      tag: $[[ inputs.infrastructure_tag ]]
      os: $[[ inputs.os ]]
      compiler: $[[ inputs.compiler ]]
      target: $[[ inputs.srs_target ]]
      build_args: $[[ inputs.build_args ]]
      uhd_version: $[[ inputs.uhd_version ]]
      dpdk_version: $[[ inputs.dpdk_version ]]
      test_mode: $[[ inputs.test_mode ]]
  - local: infra/gitlab/.gitlab-ci.yml

stages: [infra, build]
