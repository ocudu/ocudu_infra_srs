spec:
  inputs:
    ocudu_path:
      type: string
      default: ocudu/ocudu
      description: "OCUDU repository path."
    ocudu_ref:
      type: string
      default: dev
      description: "OCUDU reference branch or tag."
    ocudu_build_dir:
      type: string
      default: build
      description: "OCUDU build directory."
    job:
      type: string
      default: build_ocudu
      description: "Job name to use."
    stage:
      type: string
      default: build
      description: "Job stage to use."
    rules:
      type: array
      default: []
      description: "Defines the `rules` of the job."
    tags:
      type: array
      default: [saas-linux-medium-amd64]
      description: "Tags to use for the job."
    image_version:
      type: string
      default: ${DOCKER_BUILDER_VERSION}
      description: "Docker image version to use for the job."
    image_prefix:
      type: string
      default: registry.gitlab.com/ocudu/ocudu/builder-
      description: "Prefix of the docker image to use for the job."
    os:
      type: string
      default: ubuntu-24.04
      description: "Operating system. It is included in the docker image name after the prefix. Set it empty if you are setting a full image name in `image_prefix` input."
    download_urls_pre_build:
      type: string
      default: ""
      description: "URLs of packages to download before building, one per line. Can include wget options before the URL."
    ocudu_target:
      type: string
      default: ""
      description: "Build target. Keep it empty to use the default target."
    compiler:
      type: string
      default: gcc
      description: "Compiler."
    uhd_version:
      type: string
      default: ""
      description: "UHD version. Must be a version included in the specified OS builder image."
    dpdk_version:
      type: string
      default: ""
      description: "DPDK version. Must be a version included in the specified OS builder image."
    build_args:
      type: string
      default: ""
      description: "Build arguments for the job. It will be passed to cmake"
    test_mode:
      type: string
      default: none
      description: "Run ctest selecting tests with labels matching regular expression. `none` wont run any test at all."
    cache:
      type: array
      default: []
      description: "Caching configuration for the job."
    needs:
      type: array
      default: []
      description: "Jobs that this job depends on."
---
include:
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/build.yml

"$[[ inputs.job ]]":
  extends: .build_and_unit_template
  image: "$[[ inputs.image_prefix ]]${OS}:$[[ inputs.image_version ]]"
  stage: $[[ inputs.stage ]]
  rules: $[[ inputs.rules ]]
  variables:
    OCUDU_DIR: ${CI_PROJECT_DIR}/ocudu
    OCUDU_BUILD_DIR: $[[ inputs.ocudu_build_dir ]]
    # Setup variables
    OCUDU_PATH: $[[ inputs.ocudu_path ]]
    OCUDU_REF: $[[ inputs.ocudu_ref ]]
    DOWNLOAD_URLS_PRE_BUILD: $[[ inputs.download_urls_pre_build ]]
    # Build variables
    OS: $[[ inputs.os ]]
    OCUDU_TARGET: $[[ inputs.ocudu_target ]]
    COMPILER: $[[ inputs.compiler ]]
    UHD_VERSION: $[[ inputs.uhd_version ]]
    DPDK_VERSION: $[[ inputs.dpdk_version ]]
    BUILD_ARGS: $[[ inputs.build_args ]]
    # CTest variables
    TEST_MODE: $[[ inputs.test_mode ]]
  tags: $[[ inputs.tags ]]
  script:
    # Download pre-build packages
    - |
      echo "${DOWNLOAD_URLS_PRE_BUILD}" | while IFS= read -r line; do
        # Skip empty lines
        [[ -z "$line" ]] && continue

        # Parse line: extract wget options and URL
        # Assume the last token is the URL, everything before are wget options
        url=$(echo "$line" | awk '{print $NF}')
        wget_opts=$(echo "$line" | sed "s|${url}$||" | xargs)

        echo "Downloading: $url"
        # Download file
        filename=$(basename "$url")
        max_attempts=10
        attempt=1
        while [ $attempt -le $max_attempts ]; do
          wget $wget_opts "$url" -O "$filename" > /dev/null 2>&1 && break || true
          sleep 10
          echo "Retrying... (attempt $attempt/$max_attempts)"
          attempt=$((attempt + 1))
        done
        if [ $attempt -gt $max_attempts ]; then
          echo "Error: Failed to download $url after $max_attempts attempts"
          exit 1
        fi
        echo "Downloaded to: $filename"

        # Extract main tar.gz file
        extract_dir="${filename%.tar.gz}"
        mkdir -p "$extract_dir"
        tar -zxf "$filename" -C "$extract_dir"

        # Extract nested tar.gz files if any exist
        for nested_file in "$extract_dir"/*/*.tar.gz; do
          if [[ -f "$nested_file" ]]; then
            tar -zxf "$nested_file" -C "$extract_dir/"
          fi
        done
        echo "Extracted to: $extract_dir"

      done
    # Setup OCUDU repository
    - |
      mkdir -p ${OCUDU_DIR}
      cd ${OCUDU_DIR}
    - |
      git init > /dev/null 2>&1
      git remote add origin https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_SHELL_SSH_HOST}/${OCUDU_PATH}.git > /dev/null
      git fetch --depth=1 origin ${OCUDU_REF} > /dev/null
      git reset --hard FETCH_HEAD
      git config --global --add safe.directory ${OCUDU_DIR}
      git rev-parse HEAD > .gitlab/ci/version.txt
    - cd ${CI_PROJECT_DIR}
    # Save build info
    - |
      echo "${DPDK_VERSION}" > ${OCUDU_DIR}/.gitlab/ci/dpdk_version.txt
      echo "${UHD_VERSION}"  > ${OCUDU_DIR}/.gitlab/ci/uhd_version.txt
    # Build
    - build_ocudu
    # Run unit and integration tests
    - |
      if [[ $TEST_MODE != "none" ]]; then
        launch_tests_ocudu
      fi
  after_script: # Save sources, ctest output and built apps
    # Save Testing output (ctest)
    - |
      cd ${OCUDU_DIR}
      mkdir -p ${CI_PROJECT_DIR}/${OCUDU_BUILD_DIR}/Testing
      mv ${OCUDU_DIR}/${OCUDU_BUILD_DIR}/Testing ${CI_PROJECT_DIR}/${OCUDU_BUILD_DIR}/Testing || true >/dev/null 2>&1
    # Save .so
    - |
      cd ${OCUDU_DIR}/${OCUDU_BUILD_DIR}/
      find . -name "*.so" -exec sh -c 'mkdir -p "${CI_PROJECT_DIR}/${OCUDU_BUILD_DIR}/$(dirname "$1")" && cp "$1" "${CI_PROJECT_DIR}/${OCUDU_BUILD_DIR}/$1"' _ {} \;
    # Save built apps
    - |
      cd ${OCUDU_DIR}/${OCUDU_BUILD_DIR}/apps
      find . -type f -executable -exec sh -c 'mkdir -p "${CI_PROJECT_DIR}/${OCUDU_BUILD_DIR}/apps/$(dirname "$1")" && cp "$1" "${CI_PROJECT_DIR}/${OCUDU_BUILD_DIR}/apps/$1"' _ {} \;
    # Copy build folder back to OCUDU directory
    - |
      cd ${OCUDU_DIR}
      rm -Rf ${OCUDU_DIR}/${OCUDU_BUILD_DIR}
      cp -r ${CI_PROJECT_DIR}/${OCUDU_BUILD_DIR} ${OCUDU_DIR}/${OCUDU_BUILD_DIR}
      echo "OCUDU build size is" $(du -hs ${OCUDU_BUILD_DIR} | cut -f1)
  cache: $[[ inputs.cache ]]
  artifacts:
    paths:
      - ocudu
    exclude:
      - ocudu/.git/**/*
      - ocudu/plugins/enterprise/.git/**/*
      - ocudu/ccache/**/*
    expire_in: 3 days
  needs: $[[ inputs.needs ]]
