spec:
  inputs:
    job:
      type: string
      default: e2e_ocudu
      description: "Job name to use."
    stage:
      type: string
      default: e2e
      description: "Job stage to use."
    rules:
      type: array
      default: []
      description: "Defines the `rules` of the job."
    timeout:
      type: string
      default: 3 hours
      description: "Timeout for the job."
    testbed:
      type: string
      default: zmq
      description: "Retina Testbed configuration to use."
      options:
        - android_b200
        - android_callbox
        - android_x300
        - rf_b200
        - s72
        - s72_fr2
        - test_mode_ru
        - test_mode_ue
        - viavi
        - zmq_1cu2du
        - zmq_2gnb
        - zmq_cudu
        - zmq_mme
        - zmq_ntn
        - zmq_ric
        - zmq_srsue
        - zmq
        - dynamic
        - none
    group:
      type: string
      description: "Retina group to use."
      rules:
        - if: '"$[[ inputs.testbed ]]" !~ /^(zmq|dynamic)/'
          default: zmq
        - if: $[[ inputs.testbed ]] =~ /s72/
          default: s72
        - if: $[[ inputs.testbed ]] =~ /viavi/
          default: viavi
        - if: $[[ inputs.testbed ]] =~ /rf/
          default: rf
    markers:
      type: string
      default: ""
      description: "Selected pytest marker (label / tag). Tests with that mark will run. Do not use quotes."
    file_or_dir:
      type: string
      default: ""
      description: "Test file or folder to select. Use relative path from e2e folder. Do not use quotes. Empty for all tests in the folder."
    keywords:
      type: string
      default: ""
      description: "Select tests by keyword expressions. Do not use quotes. This will run tests which contain names that match the given string expression (case-insensitive), which can include Python operators that use filenames, class names and function names as variables"
    retina_args:
      type: string
      default: ""
      description: "Extra retina args for the e2e suite to run"
    launcher_args:
      type: string
      default: ""
      description: "Extra launcher args"
    needs:
      type: array
      default: []
      description: "Needs configuration for the job."
---
get retina version:
  stage: .pre
  image:
    name: alpine/git:v2.49.1
    entrypoint: ["/bin/sh", "-c"]
  variables:
    GIT_DEPTH: 0
  script:
    - echo "RETINA_VERSION=$(sh retina/version.sh)" | tee retina_version.env
  artifacts:
    reports:
      dotenv: retina_version.env
  retry: 2
  needs: []

"$[[ inputs.job ]]":
  stage: $[[ inputs.stage ]]
  rules: $[[ inputs.rules ]]
  timeout: $[[ inputs.timeout ]]
  tags:
    - retina
    - ${GROUP}
  image:
    name: ${RETINA_REGISTRY_URI}/launcher:${RETINA_VERSION}
    entrypoint: ["/bin/sh", "-c"]
  variables:
    # CI variables
    OCUDU_DIR: ${CI_PROJECT_DIR}/ocudu
    GROUP: $[[ inputs.group ]]
    # Retina E2E variables
    LOGNAME: ci_${CI_RUNNER_ID}_${CI_CONCURRENT_PROJECT_ID}
    TESTBED: $[[ inputs.testbed ]]
    MARKERS: $[[ inputs.markers ]]
    FILE_OR_DIR: $[[ inputs.file_or_dir ]]
    KEYWORDS: $[[ inputs.keywords ]]
    RETINA_ARGS: $[[ inputs.retina_args ]]
    LAUNCHER_ARGS: $[[ inputs.launcher_args ]]
    # Configured for big artifacts
    TRANSFER_METER_FREQUENCY: 5s
    ARTIFACT_COMPRESSION_LEVEL: slowest
    RUNNER_AFTER_SCRIPT_TIMEOUT: 20m
  needs:
    - $[[ inputs.needs ]]
    - get retina version
  artifacts:
    paths:
      - e2e/log
    when: always
    expire_in: 1 week
    reports:
      junit: e2e/log/out.xml
  before_script:
    - |
      export OCUDU_COMMIT=$(cat ${OCUDU_DIR}/.gitlab/ci/version.txt)
    # Print E2E parameters
    - |
      echo "TESTBED=${TESTBED}"
      echo "MARKERS=${MARKERS}"
      echo "FILE_OR_DIR=${FILE_OR_DIR}"
      echo "KEYWORDS=${KEYWORDS}"
      echo "RETINA_ARGS=${RETINA_ARGS}"
      echo "LAUNCHER_ARGS=${LAUNCHER_ARGS}"
    # Generate env file for e2e requests
    - |
      cd ${CI_PROJECT_DIR}/e2e/retina_requests
      DPDK_VERSION=$(cat ${OCUDU_DIR}/.gitlab/ci/dpdk_version.txt)
      python3 ${CI_PROJECT_DIR}/retina/_scripts/generate_env.py --ocudu-path ${CI_PROJECT_DIR}/ocudu --dpdk-version "${DPDK_VERSION}"
      cd ${CI_PROJECT_DIR}
    # Modify request to shared the complete folder with ocudu containers
    - |
      find e2e/retina_requests/ -iname "*.yml" -exec yq -i '(.[] | select(.name == "ocudu*") | .shared_files) = [{"local_path": "../ocudu", "remote_path": env(OCUDU_DIR), "is_executable": false}]' {} \;
    # Remove any reserved resources from previous runs
    - retina --in-cluster release --username ${LOGNAME}
    - |
      run_retina() {
        cd ${CI_PROJECT_DIR}/e2e
        set -x
        retina-launcher --retina-in-cluster "${FILE_OR_DIR}" ${LAUNCHER_ARGS} --retina-request=retina_requests/${TESTBED}.yml -m "${MARKERS}" -k "${KEYWORDS}" --register-parameter ${RETINA_ARGS}
        { set +x; } 2>/dev/null
      }
  script:
    - cd e2e
    - run_retina
  after_script:
    - retina --in-cluster release --username ${LOGNAME}
    # Artifact size
    - echo -e "\e[0Ksection_start:`date +%s`:e2e_folder_section[collapsed=true]\r\e[0KLog folder's tree"
    - |
      print_tree() {
        local dir="$1"
        local prefix="$2"

        # List directories first
        find "$dir" -mindepth 1 -maxdepth 1 -type d | while read -r subdir; do
          local size=$(du -sh "$subdir" | awk '{print $1}')
          echo "${prefix}├── $(basename "$subdir") [$size]"
          print_tree "$subdir" "$prefix│   "
        done

        # List files afterwards
        find "$dir" -mindepth 1 -maxdepth 1 -type f | while read -r file; do
          local size=$(du -sh "$file" | awk '{print $1}')
          echo "${prefix}├── $(basename "$file") [$size]"
        done
      }
      print_tree "e2e/log/" ""
    - echo -e "\e[0Ksection_end:`date +%s`:e2e_folder_section\r\e[0K"
    # Report link
    - |
      echo "*******************************************************************************************************************************"
      echo "Test report ---> https://${CI_PROJECT_NAMESPACE_SLUG}.${CI_PAGES_DOMAIN}/-/$CI_PROJECT_NAME/-/jobs/$CI_JOB_ID/artifacts/e2e/log/report.html"
      echo "*******************************************************************************************************************************"
    # Artifact transfer to an alternative ftp server
    - |
      if [ -n "$FTP_SERVER_IP" ]; then
        # Saving artifacts to the FTP server
        # Verify if SSH connection is active
        if ! nc -z -v "$FTP_SERVER_IP" "$FTP_SERVER_PORT" >/dev/null 2>&1; then
            echo "Error: SSH server is not active or is not reachable."
            exit 1
        fi
        artifacts_dir="${CI_PROJECT_DIR}/e2e/log"
        compressed_artifact="artifacts_${CI_JOB_NAME_SLUG}_${CI_JOB_ID}.zip"
        # Compress the artifacts
        zip -q -r "${compressed_artifact}" "${artifacts_dir}"
        # Send the artifacts to the server
        sshpass -p "${FTP_SERVER_PASS}" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "${FTP_SERVER_PORT}" "${compressed_artifact}" "${FTP_SERVER_USER}@${FTP_SERVER_IP}:${FTP_REMOTE_PATH}" >/dev/null 2>&1
        echo "Artifacts saved at ${FTP_SERVER_IP}:${FTP_REMOTE_PATH}/${compressed_artifact}"
      fi
