services:
  docusaurus:
    image: node:20
    working_dir: /workdir/docs
    volumes:
      - ../:/workdir
    ports:
      - "3000:3000"
    stop_grace_period: 1s
    environment:
      CI_COMMIT_SHORT_SHA: main
    command: >
      sh -c "
      echo 'Starting Docusaurus server...' &&
      npm install &&
      npm run clear &&
      npm run build &&
      npm run serve
      "
